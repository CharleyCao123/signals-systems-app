    { sec: "7.4  逆 z 变换", items: [
      { type: "choice", q: "用部分分式法求逆 z 变换时，先对 F(z)/z（而不是 F(z)）作部分分式展开，其原因是", opts: ["F(z) 不是有理函数，需先除以 z 化为有理函数", "F(z)/z 的极点个数更少，展开更简单", "基本变换对的形式是 z/(z − a)，对 F(z)/z 展开后各项乘回 z 恰好直接套用该表", "直接展开 F(z) 会丢失 f(0) 的信息"], ans: 2,
        exp: "常用变换对的分子都含 z（如 a^{k}ε(k) ↔ z/(z − a)）。把 F(z)/z 展开成 ΣK_{i}/(z − p_{i}) 后各项乘回 z，得 K_{i}z/(z − p_{i})，逐项对应 p_{i}^{k}ε(k) 可直接查表。若直接对 F(z) 展开，各项为 1/(z − p_{i}) 形式，无法从表中找到对应序列。" },
      { type: "blank", q: "F(z) = z^{2}/[(z − 1)(z − 0.25)]，对 F(z)/z 展开时极点 z = 1 对应的系数 K_{1} = ？（填分数或保留两位小数）", answers: ["4/3", "1.33", "1.333"],
        exp: "系数公式 K_{i} = [(z − p_{i})F(z)/z]|_{z = p_{i}}：K_{1} = z/(z − 0.25)|_{z=1} = 1/0.75 = 4/3 ≈ 1.33；K_{2} = z/(z − 1)|_{z=0.25} = −1/3。故 f(k) = [4/3 − (1/3)(0.25)^{k}]ε(k)，f(0) = 1 与 lim_{z→∞}F(z) = 1 一致。" },
      { type: "judge", q: "幂级数展开法（长除法）求逆 z 变换时，将分子、分母按 z 的降幂排列后相除，商中 z^{−k} 项的系数就是 f(k)，该方法适合求序列的前若干项。", ans: true,
        exp: "正确。F(z) 本身就是 f(0) + f(1)z^{−1} + f(2)z^{−2} + … 的幂级数，按降幂长除可逐项得出系数，适合求数值前几项或校验部分分式结果，缺点是难以写出闭式表达式。注意升幂排列对应非因果（左边）序列，本题因果序列必须降幂。" }
    ]},
    { sec: "7.5  用 z 变换求解差分方程", items: [
      { type: "choice", q: "系统 y(k) + 0.5y(k − 1) = f(k)，激励 f(k) = ε(k)，则零状态响应 y_{zs}(k) 为", opts: ["[2 − (0.5)^{k}]ε(k)", "[2/3 − (1/3)(−0.5)^{k}]ε(k)", "[1 + (0.5)^{k}]ε(k)", "[2/3 + (1/3)(−0.5)^{k}]ε(k)"], ans: 3,
        exp: "零状态下取 z 变换：Y(z)(1 + 0.5z^{−1}) = z/(z − 1)，故 Y(z) = z^{2}/[(z − 1)(z + 0.5)]。对 Y(z)/z 展开得 K_{1} = z/(z + 0.5)|_{z=1} = 2/3、K_{2} = z/(z − 1)|_{z=−0.5} = 1/3，即 y_{zs} = [2/3 + (1/3)(−0.5)^{k}]ε(k)；校验 y_{zs}(0) = 1、y_{zs}(1) = 0.5 与递推一致。" },
      { type: "blank", q: "差分方程 y(k + 2) − 5y(k + 1) + 6y(k) = f(k) 的特征根为 2 和 ？（填数值）", answers: ["3"],
        exp: "特征方程 r^{2} − 5r + 6 = (r − 2)(r − 3) = 0，特征根为 2 与 3，验证 2+3 = 5、2×3 = 6。注意两个根的模均大于 1（单位圆外），系统不稳定，零输入响应按 2^{k}、3^{k} 增长。特征根即 H(z) 的极点，决定响应模式 p_{i}^{k}。" },
      { type: "judge", q: "用 z 变换解差分方程时，初始条件项对应的逆变换是零输入响应，H(z)F(z) 对应零状态响应，全响应等于两者之和。", ans: true,
        exp: "正确。方程变换后 A(z)Y(z) = 初始条件项 + B(z)F(z)：前者只与初始状态有关，逆变换得 y_{zi}(k)，模式由特征根决定；后者只与激励有关，即 y_{zs}(k) = h(k)*f(k)。两种响应在 z 域自动分离，与连续系统用拉氏变换解微分方程的做法完全平行。" }
    ]},
    { sec: "7.6  系统函数 H(z) 与系统稳定性", items: [
      { type: "choice", q: "因果离散 LTI 系统 BIBO 稳定的充要条件是", opts: ["H(z) 的全部极点位于单位圆内（|p_{i}| < 1）", "H(z) 的全部极点位于 s 左半平面", "H(z) 的全部零点位于单位圆内", "H(z) 的全部极点位于单位圆上"], ans: 0,
        exp: "离散因果系统稳定 ⇔ 所有极点模小于 1，此时各自然模式 p_{i}^{k} 均随 k 衰减，h(k) 绝对可和。B 是连续系统判据（极点实部小于零）；零点不影响稳定性；极点全部落在单位圆上属临界稳定而非稳定。由 |z| = e^{σT} 知两个判据一一对应。" },
      { type: "blank", q: "某离散系统的极点为 z = 0.6 ± j0.8，则极点的模为 ？（填数值），该系统为临界稳定", answers: ["1"],
        exp: "极点模 |p| = (0.6^{2} + 0.8^{2})^{1/2} = (0.36 + 0.64)^{1/2} = 1，恰好在单位圆上，对应等幅振荡（数字角频率 β = arctan(0.8/0.6) ≈ 0.927 rad），系统临界稳定；若模大于 1 则振荡包络增长，系统不稳定，模小于 1 才衰减稳定。" },
      { type: "judge", q: "FIR（有限冲激响应）系统的 H(z) 除原点外没有极点，因此 FIR 系统总是稳定的。", ans: true,
        exp: "正确。h(k) 有限长时 H(z) = Σ_{k=0}^{N} h(k)z^{−k} 是 z^{−1} 的多项式，只有 z = 0 处的极点（不影响稳定性），故 FIR 系统恒稳定。IIR 系统含反馈支路，极点位置随系数变化，必须逐个检查是否满足 |p_{i}| < 1。" }
    ]}
  ];
})();

</script>
<script>
/* ── quiz.js ── */
/* 自测模块：按知识点小节分组，三题型（单选/填空/判断），详细解析 */
(function () {
  "use strict";
  var BANK = window.QUIZ_BANK || {};
  var DOC = window.DOC_CONTENT;

  function chapterLabel(id) {
    for (var i = 0; i < DOC.chapters.length; i++) if (DOC.chapters[i].id === id) return DOC.chapters[i].label;
    return id;
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/\^\{([^}]*)\}/g, "<sup>$1</sup>").replace(/_\{([^}]*)\}/g, "<sub>$1</sub>");
  }
  /* 填空判分：归一化字符串匹配 或 数值 ±2% 容差 */
  function normStr(s) {
    return String(s)
      .replace(/\s+/g, "").replace(/，/g, ",").replace(/。/g, "")
      .replace(/（/g, "(").replace(/）/g, ")")
      .replace(/[−–—]/g, "-").replace(/×/g, "*").replace(/÷/g, "/")
      .toLowerCase();
  }
  function isBlankOk(user, answers) {
    var u = normStr(user);
    if (!u) return false;
    return answers.some(function (a) {
      var av = normStr(a);
      if (u === av) return true;
      var un = parseFloat(u.replace(/,/g, ""));
      var an = parseFloat(av.replace(/,/g, ""));
      if (isFinite(un) && isFinite(an)) {
        return Math.abs(un - an) <= Math.max(Math.abs(an) * 0.02, 0.05);
      }
      return false;
    });
  }
  /* 收集某章全部题目：[{sec, ch, item}] */
  function chapterItems(ch) {
    var out = [];
    (BANK[ch] || []).forEach(function (grp) {
      grp.items.forEach(function (it) { out.push({ sec: grp.sec, ch: ch, item: it }); });
    });
    return out;
  }
  function allItems() {
    var out = [];
    Object.keys(BANK).forEach(function (ch) {
      out = out.concat(chapterItems(ch));
    });
    return out;
  }

  function open(ch) {
    var shell = document.getElementById("quizShell");
    var view = document.getElementById("quizView");
    var qs, groupMode = false;
    if (ch === "all") {
      qs = allItems();
      /* 打乱后抽 15 题，并尽量覆盖不同章节 */
      for (var i = qs.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = qs[i]; qs[i] = qs[j]; qs[j] = t;
      }
      qs = qs.slice(0, Math.min(15, qs.length));
    } else {
      qs = chapterItems(ch);
      groupMode = true;
    }
    if (!qs.length) {
      shell.innerHTML = '<div class="quiz-card">该章节暂无自测题。</div><button class="ex-toggle" id="quizClose2">返回</button>';
      view.hidden = false; bindClose(); return;
    }

    var answered = 0, correct = 0;
    var h = '<div class="quiz-head"><h2>' + (ch === "all" ? "综合自测（随机 15 题）" : chapterLabel(ch) + " · 分知识点自测") +
      '</h2><button class="icon-btn" id="quizClose">✕ 关闭</button></div>';
    if (groupMode) {
      h += '<div class="quiz-card" style="padding:10px 16px;font-size:13px;color:var(--text-2)">共 ' + qs.length + ' 题：每个知识点小节 3 题（单选 → 填空 → 判断），提交后立即判分并显示详细解析。</div>';
    }

    var lastSec = null;
    qs.forEach(function (entry, qi) {
      var it = entry.item;
      if (groupMode && entry.sec !== lastSec) {
        h += '<div class="quiz-sec-bar">' + escapeHtml(entry.sec) + "</div>";
        lastSec = entry.sec;
      }
      var from = ch === "all" ? '　<span style="color:var(--text-2);font-size:11.5px">[' + chapterLabel(entry.ch) + ']</span>' : "";
      var typeTag = { choice: "单选", blank: "填空", judge: "判断" }[it.type] || it.type;
      h += '<div class="quiz-card" data-q="' + qi + '"><div class="quiz-q"><span class="q-no">' + (qi + 1) + '.</span>' +
        '<span class="q-type q-type-' + it.type + '">' + typeTag + "</span>" + escapeHtml(it.q) + from + "</div>";
      if (it.type === "choice") {
        it.opts.forEach(function (op, oi) {
          h += '<button class="quiz-opt" data-qi="' + qi + '" data-oi="' + oi + '">' + String.fromCharCode(65 + oi) + ". " + escapeHtml(op) + "</button>";
        });
      } else if (it.type === "judge") {
        h += '<div class="quiz-judge-row">' +
          '<button class="quiz-opt quiz-judge" data-qi="' + qi + '" data-oi="1">✔ 正确</button>' +
          '<button class="quiz-opt quiz-judge" data-qi="' + qi + '" data-oi="0">✘ 错误</button></div>';
      } else {
        h += '<div class="quiz-blank-row">' +
          '<input class="quiz-input" id="in-' + qi + '" placeholder="在此输入答案…" autocomplete="off">' +
          '<button class="quiz-submit" data-qi="' + qi + '">提交</button></div>';
      }
      var reveal = it.type === "blank" ? "　参考答案：" + escapeHtml(String(it.answers[0])) : "";
      h += '<div class="quiz-exp" id="exp-' + qi + '">✔ ' + escapeHtml(it.exp) + reveal + "</div></div>";
    });
    h += '<div class="quiz-card"><div class="quiz-score" id="quizScore">已答 0 / ' + qs.length + '，答对 0</div>' +
      '<div style="color:var(--text-2);font-size:13px">选择题点击选项即判分；填空题输入后点\u201c提交\u201d（数值允许 2% 误差）；判断题点击\u201c正确/错误\u201d。</div></div>';
    shell.innerHTML = h;
    view.hidden = false;
    window.scrollTo(0, 0);

    function bindClose() {
      var b = document.getElementById("quizClose") || document.getElementById("quizClose2");
      if (b) b.addEventListener("click", function () { view.hidden = true; });
    }
    bindClose();

    function mark(qi, ok) {
      var card = shell.querySelector('.quiz-card[data-q="' + qi + '"]');
      if (card.getAttribute("data-done")) return;
      card.setAttribute("data-done", "1");
      answered++;
      if (ok) correct++;
      var exp = document.getElementById("exp-" + qi);
      exp.classList.add("show");
      exp.style.borderLeft = ok ? "3px solid var(--ok)" : "3px solid var(--danger)";
      document.getElementById("quizScore").textContent = "已答 " + answered + " / " + qs.length + "，答对 " + correct +
        (answered === qs.length ? "　——　得分 " + Math.round(correct * 100 / qs.length) + " 分" : "");
    }

    shell.querySelectorAll(".quiz-opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var qi = +btn.getAttribute("data-qi"), oi = +btn.getAttribute("data-oi");
        var card = shell.querySelector('.quiz-card[data-q="' + qi + '"]');
        if (card.getAttribute("data-done")) return;
        var it = qs[qi].item;
        var ans;
        if (it.type === "choice") ans = it.ans;
        else ans = it.ans ? 1 : 0; /* judge: 正确=1 */
        shell.querySelectorAll('.quiz-opt[data-qi="' + qi + '"]').forEach(function (b2) {
          b2.disabled = true;
          var o2 = +b2.getAttribute("data-oi");
          if (o2 === ans) b2.classList.add("correct");
          else if (o2 === oi) b2.classList.add("wrong");
        });
        mark(qi, oi === ans);
      });
    });
    function submitBlank(qi) {
      var it = qs[qi].item;
      var input = document.getElementById("in-" + qi);
      var btn = shell.querySelector('.quiz-submit[data-qi="' + qi + '"]');
      if (!input || !btn) return;
      var ok = isBlankOk(input.value, it.answers);
      btn.disabled = true; input.disabled = true;
      btn.textContent = ok ? "✓ 正确" : "✗ 错误";
      btn.style.borderColor = ok ? "var(--ok)" : "var(--danger)";
      btn.style.color = ok ? "var(--ok)" : "var(--danger)";
      input.style.borderColor = ok ? "var(--ok)" : "var(--danger)";
      mark(qi, ok);
    }
    shell.querySelectorAll(".quiz-submit").forEach(function (btn) {
      btn.addEventListener("click", function () { submitBlank(+btn.getAttribute("data-qi")); });
    });
    shell.querySelectorAll(".quiz-input").forEach(function (inp) {
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); submitBlank(+inp.id.replace("in-", "")); }
      });
    });
  }

  window.SIG_QUIZ = { open: open };
})();

</script>
<script>
/* ── app.js ── */
/* 信号与系统学习工具 App 主逻辑：路由 / 渲染 / 搜索 / 主题 / 进度 / 字号 */
(function () {
  "use strict";
  var DOC = window.DOC_CONTENT;
  var $ = function (id) { return document.getElementById(id); };

  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem("sigApp_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("sigApp_" + k, JSON.stringify(v)); } catch (e) {} }
  };
  var state = {
    read: LS.get("read", {}),
    theme: LS.get("theme", "light"),
    fontStep: LS.get("fontStep", 1),
    lastHash: LS.get("lastHash", "#/pre")
  };
  var FONT_STEPS = [15, 16.5, 18, 19.5];

  /* ── 工具 ──────────────────────────────────────────── */
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* 上下标标记：^{上标}、_{下标} */
  function supsub(s) {
    return escapeHtml(s)
      .replace(/\^\{([^}]*)\}/g, "<sup>$1</sup>")
      .replace(/_\{([^}]*)\}/g, "<sub>$1</sub>");
  }
  function inlineHtml(s) {
    return supsub(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function stripMarkup(s) {
    return String(s).replace(/\^\{([^}]*)\}/g, "$1").replace(/_\{([^}]*)\}/g, "$1")
      .replace(/\*\*/g, "").replace(/\{\{|\}\}/g, "");
  }
  function chapterIndex(id) {
    for (var i = 0; i < DOC.chapters.length; i++) if (DOC.chapters[i].id === id) return i;
    return -1;
  }

  /* ── 块渲染 ────────────────────────────────────────── */
  function renderBlocks(blocks, out) {
    blocks.forEach(function (b) { renderBlock(b, out); });
  }
  function renderBlock(b, out) {
    switch (b.t) {
      case "h3":
        out.push('<h3 id="sec-' + out.length + '">' + inlineHtml(b.x) + "</h3>");
        break;
      case "p":
        out.push("<p>" + inlineHtml(b.x) + "</p>");
        break;
      case "f":
        out.push('<div class="formula">' + supsub(b.x) + "</div>");
        break;
      case "kp":
        out.push('<div class="kp-box"><span class="kp-tag">【要点】</span>' + inlineHtml(b.x) + "</div>");
        break;
      case "tbl": {
        var widths = b.widths && b.widths.length === b.head.length ? b.widths : null;
        var h = '<div class="tbl-wrap">';
        if (b.cap) h += '<div class="tbl-cap">' + supsub(b.cap) + "</div>";
        h += '<div class="tbl-scroll"><table><thead><tr>';
        b.head.forEach(function (cell, ci) {
          h += "<th" + (widths ? ' style="width:' + widths[ci] + '%"' : "") + ">" + supsub(cell) + "</th>";
        });
        h += "</tr></thead><tbody>";
        b.rows.forEach(function (row) {
          h += "<tr>";
          row.forEach(function (cell) { h += "<td>" + supsub(cell) + "</td>"; });
          h += "</tr>";
        });
        h += "</tbody></table></div></div>";
        out.push(h);
        break;
      }
      case "ex": {
        var h2 = '<div class="ex-box"><div class="ex-title"><span class="ex-tag">例题</span>' + supsub(b.title) + '</div><div class="ex-problem">';
        b.problem.forEach(function (pb) { h2 += "<p>" + inlineHtml(pb.x) + "</p>"; });
        h2 += '</div><button class="ex-toggle">显示解析 ▾</button><div class="ex-solution">';
        b.solution.forEach(function (sb) {
          if (sb.t === "f") h2 += '<div class="formula">' + supsub(sb.x) + "</div>";
          else h2 += "<p>" + inlineHtml(sb.x) + "</p>";
        });
        h2 += "</div></div>";
        out.push(h2);
        break;
      }
      case "sim": {
        var h3 = '<div class="sim" data-sim="' + b.id + '">';
        h3 += '<div class="sim-head"><span class="sim-icon">📊</span><span class="sim-cap">' + supsub(b.cap || "互动实验") + '</span><span class="sim-live">拖动 / 点击交互</span></div>';
        if (b.note) h3 += '<div class="sim-note">' + supsub(b.note) + "</div>";
        h3 += '<div class="sim-body"></div></div>';
        out.push(h3);
        break;
      }
      case "quiz": {
        var chId = b.ch;
        out.push('<div class="sim"><div class="sim-head"><span class="sim-icon">✎</span><span class="sim-cap">本章知识点自测</span></div><div class="sim-note">每个知识点小节 3 题（单选 → 填空 → 判断），提交即判分并给出详细解析。</div><div class="sim-body"><button class="ex-toggle" data-quiz="' + chId + '">开始自测 ✎</button></div></div>');
        break;
      }
    }
  }

  /* ── 交互实验挂载 ──────────────────────────────────── */
  function mountSims(article) {
    var nodes = article.querySelectorAll(".sim[data-sim]");
    nodes.forEach(function (node) {
      var id = node.getAttribute("data-sim");
      var fn = window.SIG_SIMS && window.SIG_SIMS[id];
      if (typeof fn !== "function") {
        node.querySelector(".sim-body").innerHTML =
          '<div class="sim-note">（该实验模块未加载：' + escapeHtml(id) + "）</div>";
        return;
      }
      try { fn(node.querySelector(".sim-body"), node); }
      catch (e) {
        node.querySelector(".sim-body").innerHTML =
          '<div class="sim-note">实验初始化出错：' + escapeHtml(String(e && e.message)) + "</div>";
      }
    });
  }

  /* ── 章节渲染 ──────────────────────────────────────── */
  function renderChapter(idx) {
    var ch = DOC.chapters[idx];
    var out = ['<div class="chapter-head"><div class="ch-label">SIGNALS AND SYSTEMS · 互动学习</div><h1>' + supsub(ch.label) + "</h1></div>"];
    renderBlocks(ch.blocks, out);

    var prev = idx > 0 ? DOC.chapters[idx - 1] : null;
    var next = idx < DOC.chapters.length - 1 ? DOC.chapters[idx + 1] : null;
    out.push('<nav class="chapter-nav">');
    out.push(prev ? '<a href="#/' + prev.id + '"><span class="cn-label">← 上一章</span>' + supsub(prev.label) + "</a>" : "<span></span>");
    out.push(next ? '<a class="cn-next" href="#/' + next.id + '"><span class="cn-label">下一章 →</span>' + supsub(next.label) + "</a>" : "<span></span>");
    out.push("</nav>");

    var article = $("article");
    article.innerHTML = out.join("");
    bindArticle(article, ch);
    mountSims(article);
    updateNav(ch.id);
    $("main").scrollTop = 0;
    window.scrollTo(0, 0);
    observeBottom();
  }

  function bindArticle(article, ch) {
    article.querySelectorAll(".ex-toggle").forEach(function (btn) {
      if (btn.getAttribute("data-quiz")) return;
      btn.addEventListener("click", function () {
        var sol = btn.nextElementSibling;
        var open = sol.classList.toggle("open");
        btn.textContent = open ? "收起解析 ▴" : "显示解析 ▾";
      });
    });
    article.querySelectorAll("[data-quiz]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        window.SIG_QUIZ.open(btn.getAttribute("data-quiz"));
      });
    });
  }

  /* ── 阅读进度（滚动到底视为读完）───────────────────── */
  var bottomSentinel = null;
  function observeBottom() {
    if (bottomSentinel && bottomSentinel.disconnect) bottomSentinel.disconnect();
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          var id = en.target.getAttribute("data-ch");
          if (id && !state.read[id]) {
            state.read[id] = true;
            LS.set("read", state.read);
            updateProgress();
            updateNav(id);
          }
        }
      });
    }, { threshold: 0.6 });
    var article = $("article");
    bottomSentinel = document.createElement("div");
    bottomSentinel.style.height = "4px";
    bottomSentinel.setAttribute("data-ch", currentId());
    article.appendChild(bottomSentinel);
    io.observe(bottomSentinel);
    bottomSentinel.disconnect = function () { io.disconnect(); };
  }
  function currentId() {
    var m = location.hash.match(/^#\/([a-z0-9]+)/i);
    return m ? m[1] : DOC.chapters[0].id;
  }
  function updateProgress() {
    var n = 0;
    DOC.chapters.forEach(function (c) { if (state.read[c.id]) n++; });
    var pct = Math.round(n * 100 / DOC.chapters.length);
    $("progressNum").textContent = pct;
    $("progressBar").style.width = pct + "%";
  }

  /* ── 侧边栏 ────────────────────────────────────────── */
  function buildNav() {
    var nav = $("navTree");
    var h = ['<div class="nav-group">'];
    DOC.chapters.forEach(function (c, i) {
      h.push('<a class="nav-item" data-id="' + c.id + '" href="#/' + c.id + '">' +
        '<span class="ni-no">' + (i + 1) + "</span><span class=\"ni-text\">" + supsub(c.label) + "</span>" +
        '<span class="ni-check" style="visibility:' + (state.read[c.id] ? "visible" : "hidden") + '">✔</span></a>');
    });
    h.push("</div>");
    nav.innerHTML = h.join("");
  }
  function updateNav(id) {
    document.querySelectorAll(".nav-tree .nav-item").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-id") === id);
      var chk = a.querySelector(".ni-check");
      if (chk) chk.style.visibility = state.read[a.getAttribute("data-id")] ? "visible" : "hidden";
    });
  }

  /* ── 搜索 ──────────────────────────────────────────── */
  function searchableText(b) {
    if (b.t === "tbl") return (b.cap || "") + " " + b.head.join(" ") + " " + b.rows.map(function (r) { return r.join(" "); }).join(" ");
    if (b.t === "ex") return b.title + " " + b.problem.map(function (x) { return x.x; }).join(" ");
    if (b.t === "sim") return (b.cap || "") + " " + (b.note || "");
    return b.x || "";
  }
  function doSearch(q) {
    q = q.trim().toLowerCase();
    var box = $("searchResults");
    if (!q) { box.hidden = true; return; }
    var hits = [];
    DOC.chapters.forEach(function (c) {
      c.blocks.forEach(function (b) {
        var text = searchableText(b);
        if (text && text.toLowerCase().indexOf(q) >= 0) hits.push({ ch: c, b: b, text: stripMarkup(text) });
      });
    });
    var h = "";
    if (!hits.length) {
      h = '<div class="sr-empty">没有找到相关内容</div>';
    } else {
      hits.slice(0, 14).forEach(function (hit) {
        var pos = hit.text.toLowerCase().indexOf(q);
        var start = Math.max(0, pos - 18);
        var snippet = (start > 0 ? "…" : "") + hit.text.substr(start, 58) + "…";
        h += '<a class="sr-item" href="#/' + hit.ch.id + '"><span class="sr-ch">' + supsub(hit.ch.label) + '</span><span class="sr-snippet">' + escapeHtml(snippet) + "</span></a>";
      });
      if (hits.length > 14) h += '<div class="sr-empty">共 ' + hits.length + " 条结果，仅显示前 14 条</div>";
    }
    box.innerHTML = h;
    box.hidden = false;
  }

  /* ── 路由 ──────────────────────────────────────────── */
  function route() {
    var id = currentId();
    var idx = chapterIndex(id);
    if (idx < 0) { location.hash = "#/pre"; return; }
    renderChapter(idx);
    LS.set("lastHash", location.hash);
    closeSidebar();
  }

  /* ── 侧栏开合（移动端）─────────────────────────────── */
  function closeSidebar() {
    $("sidebar").classList.remove("open");
    $("backdrop").classList.remove("show");
  }

  /* ── 主题 / 字号 ───────────────────────────────────── */
  function applyTheme() {
    document.body.classList.toggle("dark", state.theme === "dark");
    $("btnTheme").textContent = state.theme === "dark" ? "☀️" : "🌙";
    if (window.SIG_SIMS && window.SIG_SIMS.onTheme) window.SIG_SIMS.onTheme();
  }
  function applyFont() {
    document.body.style.setProperty("--article-font", FONT_STEPS[state.fontStep] + "px");
  }

  /* ── 初始化 ────────────────────────────────────────── */
  function init() {
    buildNav();
    updateProgress();
    applyTheme();
    applyFont();

    window.addEventListener("hashchange", route);
    if (!location.hash) location.hash = state.lastHash || "#/pre";
    route();

    $("btnSidebar").addEventListener("click", function () {
      $("sidebar").classList.toggle("open");
      $("backdrop").classList.toggle("show");
    });
    $("backdrop").addEventListener("click", closeSidebar);

    var st = null;
    $("searchInput").addEventListener("input", function (e) {
      clearTimeout(st);
      var v = e.target.value;
      st = setTimeout(function () { doSearch(v); }, 160);
    });
    document.addEventListener("click", function (e) {
      if (!e.target.closest || !e.target.closest(".search-box")) $("searchResults").hidden = true;
    });

    $("btnTheme").addEventListener("click", function () {
      state.theme = state.theme === "dark" ? "light" : "dark";
      LS.set("theme", state.theme);
      applyTheme();
    });
    $("btnFontPlus").addEventListener("click", function () {
      state.fontStep = Math.min(FONT_STEPS.length - 1, state.fontStep + 1);
      LS.set("fontStep", state.fontStep); applyFont();
    });
    $("btnFontMinus").addEventListener("click", function () {
      state.fontStep = Math.max(0, state.fontStep - 1);
      LS.set("fontStep", state.fontStep); applyFont();
    });
    $("btnQuiz").addEventListener("click", function () {
      window.SIG_QUIZ.open("all");
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
