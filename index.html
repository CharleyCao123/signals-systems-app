<script>
/* ── sim-core.js ── */
/* 交互实验框架：绘图类 Plot + 控件生成 + 主题适配 */
(function () {
  "use strict";
  window.SIG_SIMS = window.SIG_SIMS || {};
  var SIMS = window.SIG_SIMS;
  SIMS._redraws = []; /* 主题切换时需要重绘的实验 */

  var C = {
    axis: "#8ba0b0", grid: "#e2ecf1", text: "#5a6b78",
    blue: "#1668b3", orange: "#d97a1f", green: "#1f8a4c", red: "#c0392b",
    purple: "#7d3ac1", grey: "#9aa8b2", accent: "#1b6b7a",
    bgLight: "#ffffff", bgDark: "#0e1822",
    darkAxis: "#5f7488", darkGrid: "#1d2c3a", darkText: "#8ba0b0"
  };
  SIMS.colors = C;
  SIMS.isDark = function () { return document.body.classList.contains("dark"); };

  /* ── 控件 ──────────────────────────────────────────── */
  /* makeControls(body, [
     {k:"tau", label:"脉宽 τ", min:.05, max:2, step:.01, val:.5, fmt:v=>v.toFixed(2)},
     {k:"mode", label:"波形", sel:[["sine","正弦"],["rect","矩形"]], val:"sine"},
     {btn:"播放", primary:true, onClick:fn},
     {btn:"重置", onClick:fn}
   ]) → { tau:HTMLInputElement, mode:HTMLSelectElement, root, get(k), num(k) } */
  function makeControls(body, defs) {
    var root = document.createElement("div");
    root.className = "sim-controls";
    body.appendChild(root);
    var refs = {};
    defs.forEach(function (d) {
      if (d.btn) {
        var b = document.createElement("button");
        b.textContent = d.btn;
        if (d.primary) b.className = "primary";
        b.addEventListener("click", d.onClick);
        root.appendChild(b);
        return;
      }
      var lab = document.createElement("label");
      if (d.sel) {
        var sel = document.createElement("select");
        d.sel.forEach(function (op) {
          var o = document.createElement("option");
          o.value = op[0]; o.textContent = op[1];
          sel.appendChild(o);
        });
        sel.value = d.val;
        lab.appendChild(document.createTextNode(d.label + " "));
        lab.appendChild(sel);
        root.appendChild(lab);
        refs[d.k] = sel;
      } else {
        var inp = document.createElement("input");
        inp.type = "range";
        inp.min = d.min; inp.max = d.max; inp.step = d.step; inp.value = d.val;
        var val = document.createElement("span");
        val.className = "val";
        var refresh = function () { val.textContent = d.fmt ? d.fmt(parseFloat(inp.value)) : inp.value; };
        refresh();
        lab.appendChild(document.createTextNode(d.label + " "));
        lab.appendChild(inp);
        lab.appendChild(val);
        root.appendChild(lab);
        refs[d.k] = inp;
        inp._refreshVal = refresh;
        inp.addEventListener("input", function () { refresh(); if (d.onChange) d.onChange(parseFloat(inp.value)); });
      }
    });
    refs.root = root;
    refs.get = function (k) { return refs[k]; };
    refs.num = function (k) { return parseFloat(refs[k].value); };
    return refs;
  }

  function readout(body, html) {
    var div = document.createElement("div");
    div.className = "sim-readout";
    div.innerHTML = html || "";
    body.appendChild(div);
    return div;
  }
  function canvasRow(body, titles, n) {
    var row = document.createElement("div");
    row.className = "sim-canvas-row";
    body.appendChild(row);
    var canvases = [];
    for (var i = 0; i < n; i++) {
      var box = document.createElement("div");
      box.className = "sim-canvas-box";
      if (titles && titles[i]) {
        var t = document.createElement("div");
        t.className = "cv-title";
        t.innerHTML = titles[i];
        box.appendChild(t);
      }
      var cv = document.createElement("canvas");
      cv.height = 0; /* 尺寸在 Plot 里按容器宽度设定 */
      box.appendChild(cv);
      row.appendChild(box);
      canvases.push(cv);
    }
    return canvases;
  }

  /* ── 绘图类 ────────────────────────────────────────── */
  function Plot(canvas, opts) {
    opts = opts || {};
    this.cv = canvas;
    this.ctx = canvas.getContext("2d");
    this.padL = opts.padL !== undefined ? opts.padL : 44;
    this.padR = opts.padR !== undefined ? opts.padR : 14;
    this.padT = opts.padT !== undefined ? opts.padT : 10;
    this.padB = opts.padB !== undefined ? opts.padB : 26;
    this.x0 = opts.x0 !== undefined ? opts.x0 : -1;
    this.x1 = opts.x1 !== undefined ? opts.x1 : 1;
    this.y0 = opts.y0 !== undefined ? opts.y0 : -1;
    this.y1 = opts.y1 !== undefined ? opts.y1 : 1;
    this.xLabel = opts.xLabel || "t";
    this.yLabel = opts.yLabel || "";
    this.intX = opts.intX || false;  /* x 轴按整数刻度 */
    this.resize();
  }
  Plot.prototype.resize = function () {
    var w = this.cv.parentElement.clientWidth || 320;
    var h = Math.max(150, Math.min(240, Math.round(w * 0.52)));
    var dpr = window.devicePixelRatio || 1;
    this.cv.width = Math.round(w * dpr);
    this.cv.height = Math.round(h * dpr);
    this.cv.style.height = h + "px";
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.W = w; this.H = h;
  };
  Plot.prototype.setX = function (a, b) { this.x0 = a; this.x1 = b; };
  Plot.prototype.setY = function (a, b) { this.y0 = a; this.y1 = b; };
  Plot.prototype.px = function (x) { return this.padL + (x - this.x0) / (this.x1 - this.x0) * (this.W - this.padL - this.padR); };
  Plot.prototype.py = function (y) {
    var mid = (this.y0 + this.y1) / 2, half = Math.max(1e-9, (this.y1 - this.y0) / 2);
    var clamped = Math.max(mid - half * 40, Math.min(mid + half * 40, y)); /* 限幅防溢出 */
    return this.H - this.padB - (clamped - this.y0) / (this.y1 - this.y0) * (this.H - this.padT - this.padB);
  };
  Plot.prototype.clear = function () {
    var dark = SIMS.isDark();
    this.ctx.fillStyle = dark ? C.bgDark : C.bgLight;
    this.ctx.fillRect(0, 0, this.W, this.H);
    this.col = {
      axis: dark ? C.darkAxis : C.axis,
      grid: dark ? C.darkGrid : C.grid,
      text: dark ? C.darkText : C.text
    };
  };
  Plot.prototype.grid = function (nx, ny) {
    var ctx = this.ctx, i;
    ctx.strokeStyle = this.col.grid; ctx.lineWidth = 1;
    ctx.beginPath();
    for (i = 1; i < nx; i++) {
      var x = this.padL + i * (this.W - this.padL - this.padR) / nx;
      ctx.moveTo(x, this.padT); ctx.lineTo(x, this.H - this.padB);
    }
    for (i = 1; i < ny; i++) {
      var y = this.padT + i * (this.H - this.padT - this.padB) / ny;
      ctx.moveTo(this.padL, y); ctx.lineTo(this.W - this.padR, y);
    }
    ctx.stroke();
  };
  Plot.prototype.axes = function () {
    var ctx = this.ctx;
    ctx.strokeStyle = this.col.axis; ctx.lineWidth = 1.2;
    ctx.beginPath();
    var yZero = Math.max(this.padT, Math.min(this.H - this.padB, this.py(0)));
    var xZero = Math.max(this.padL, Math.min(this.W - this.padR, this.px(0)));
    ctx.moveTo(this.padL, yZero); ctx.lineTo(this.W - this.padR, yZero);
    ctx.moveTo(xZero, this.padT); ctx.lineTo(xZero, this.H - this.padB);
    ctx.stroke();
    /* 刻度与标签 */
    ctx.fillStyle = this.col.text;
    ctx.font = "10.5px Consolas, monospace";
    var i, step;
    if (this.intX) {
      step = Math.max(1, Math.ceil((this.x1 - this.x0) / 12));
      for (i = Math.ceil(this.x0 / step) * step; i <= this.x1; i += step) {
        var x = this.px(i);
        ctx.beginPath(); ctx.moveTo(x, yZero - 3); ctx.lineTo(x, yZero + 3);
        ctx.strokeStyle = this.col.axis; ctx.stroke();
        if (i !== 0) ctx.fillText(String(i), x - 4, yZero + 14);
      }
    } else {
      /* 1-2-5 优良刻度，避免取整后标签重复 */
      var span = this.x1 - this.x0;
      var rawStep = span / 6;
      var mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
      var nrm = rawStep / mag;
      var nice = nrm < 1.5 ? 1 : nrm < 3.5 ? 2 : nrm < 7.5 ? 5 : 10;
      step = nice * mag;
      var dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
      var v0 = Math.ceil(this.x0 / step - 1e-9) * step;
      for (var v = v0; v <= this.x1 + 1e-9; v += step) {
        ctx.fillText(v.toFixed(dec), this.px(v) - 7, yZero + 14);
      }
    }
    if (this.xLabel) {
      ctx.fillText(this.xLabel, this.W - this.padR - ctx.measureText(this.xLabel).width - 2, yZero - 5);
    }
    if (this.yLabel) {
      ctx.save(); ctx.translate(10, this.padT + 10); ctx.fillText(this.yLabel, 0, 0); ctx.restore();
    }
  };
  /* 按函数绘制曲线: fn(x) → y；xRange=[a,b]，步长自动 */
  Plot.prototype.fn = function (fn, color, width, dash) {
    var ctx = this.ctx, n = Math.round((this.W - this.padL - this.padR) * 1.5);
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = width || 2;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= n; i++) {
      var x = this.x0 + i * (this.x1 - this.x0) / n;
      var y = fn(x);
      if (!isFinite(y)) { started = false; continue; }
      var px = this.px(x), py = this.py(y);
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  };
  /* 填充 fn 与 x 轴之间区域 (x from a to b) */
  Plot.prototype.area = function (fn, a, b, color, alpha) {
    var ctx = this.ctx, n = Math.round((this.W - this.padL - this.padR));
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 0.28 : alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(this.px(a), this.py(0));
    for (var i = 0; i <= n; i++) {
      var x = a + i * (b - a) / n;
      var y = fn(x);
      if (isFinite(y)) ctx.lineTo(this.px(x), this.py(y));
    }
    ctx.lineTo(this.px(b), this.py(0));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };
  Plot.prototype.line = function (x0, y0, x1, y1, color, width, dash) {
    var ctx = this.ctx;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = width || 1.2;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.moveTo(this.px(x0), this.py(y0));
    ctx.lineTo(this.px(x1), this.py(y1));
    ctx.stroke();
    ctx.restore();
  };
  Plot.prototype.dot = function (x, y, color, r) {
    var ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(this.px(x), this.py(y), r || 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };
  /* 离散序列茎状图 pts=[{x,y}] */
  Plot.prototype.stems = function (pts, color, r) {
    var ctx = this.ctx;
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.6;
    pts.forEach(function (p) {
      var x = this.px(p.x), y0 = this.py(0), y = this.py(p.y);
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r || 3, 0, Math.PI * 2); ctx.fill();
    }, this);
    ctx.restore();
  };
  Plot.prototype.text = function (s, x, y, color, font) {
    var ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = color || this.col.text;
    ctx.font = font || "12px Microsoft YaHei, sans-serif";
    ctx.fillText(s, this.px(x), this.py(y));
    ctx.restore();
  };
  Plot.prototype.pixels = function (x, y) { return { x: this.px(x), y: this.py(y) }; };
  Plot.prototype.fromPixels = function (px, py) {
    return {
      x: this.x0 + (px - this.padL) / (this.W - this.padL - this.padR) * (this.x1 - this.x0),
      y: this.y0 + (this.H - this.padB - py) / (this.H - this.padT - this.padB) * (this.y1 - this.y0)
    };
  };

  /* ── 导出 ──────────────────────────────────────────── */
  SIMS.makeControls = makeControls;
  SIMS.readout = readout;
  SIMS.canvasRow = canvasRow;
  SIMS.Plot = Plot;
  SIMS.onTheme = function () { SIMS._redraws.forEach(function (fn) { try { fn(); } catch (e) {} }); };
})();

</script>
<script>
/* ── sims-a.js ── */
/* 实验组 A：信号运算 / 冲激信号形成 / 系统性质判定 / 卷积积分 */
(function () {
  "use strict";
  var S = window.SIG_SIMS, C = S.colors, Plot = S.Plot;
  function u(t) { return t >= 0 ? 1 : 0; }
  function Sa(x) { return Math.abs(x) < 1e-7 ? 1 : Math.sin(x) / x; }

  /* ══ 1. 信号的平移 / 反转 / 尺度变换 ══════════════════ */
  S["signal-ops"] = function (body) {
    var cv = S.canvasRow(body, ["原信号 f(t)", "变换后 f(a·t + b)"], 2);
    var base = {
      sine: { name: "正弦 sin t", f: function (t) { return Math.sin(t); }, yr: 1.4 },
      rect: { name: "矩形脉冲 g₃(t)", f: function (t) { return Math.abs(t) <= 1.5 ? 1 : 0; }, yr: 1.4 },
      tri: { name: "三角形脉冲", f: function (t) { return Math.abs(t) < 1.5 ? 1 - Math.abs(t) / 1.5 : 0; }, yr: 1.4 },
      exp: { name: "双边指数 exp(−|t|)", f: function (t) { return Math.exp(-Math.abs(t)); }, yr: 1.4 }
    };
    var p1 = new Plot(cv[0], { x0: -6, x1: 6, y0: -1.5, y1: 1.5, xLabel: "t" });
    var p2 = new Plot(cv[1], { x0: -6, x1: 6, y0: -1.5, y1: 1.5, xLabel: "t" });

    var ctl = S.makeControls(body, [
      { k: "sig", label: "信号", sel: [["sine", "正弦"], ["rect", "矩形"], ["tri", "三角"], ["exp", "指数"]], val: "rect" },
      { k: "a", label: "尺度 a", min: 0.2, max: 3, step: 0.1, val: 1, fmt: function (v) { return v.toFixed(1); } },
      { k: "b", label: "平移 b", min: -4, max: 4, step: 0.5, val: 0, fmt: function (v) { return v.toFixed(1); } },
      { btn: "左右反转", onClick: function () { flip(); } },
      { btn: "重置", onClick: function () {
          ctl.a.value = 1; ctl.a._refreshVal();
          ctl.b.value = 0; ctl.b._refreshVal();
          reverted = false; draw();
      } }
    ]);
    var reverted = false;
    function flip() { reverted = !reverted; draw(); }

    var ro = S.readout(body, "");
    function aVal() { var a = ctl.num("a"); return reverted ? -a : a; }
    function draw() {
      var f = base[ctl.sig.value].f;
      p1.clear(); p1.grid(12, 6); p1.axes();
      p1.fn(f, C.grey, 2);
      var a = aVal(), b = ctl.num("b");
      p2.clear(); p2.grid(12, 6); p2.axes();
      p2.fn(function (t) { return f(a * t + b); }, C.blue, 2.4);
      ro.innerHTML = '当前变换：<span class="rd">f(' + (a === 1 ? "" : a === -1 ? "−" : a.toFixed(1) + "·") +
        "t" + (b === 0 ? "" : (b > 0 ? " + " : " − ") + Math.abs(b).toFixed(1)) + ")</span>" +
        '　·　a ' + (a < 0 ? "＜0：先反转" : "＞0：不反转") +
        (Math.abs(Math.abs(a) - 1) > 1e-9 ? ("，|" + (Math.abs(a) < 1 ? "a|＜1 波形展宽为 " + (1 / Math.abs(a)).toFixed(1) + " 倍" : "a|＞1 波形压缩为 " + Math.abs(a).toFixed(1) + " 倍")) : "") +
        (b !== 0 ? ("，b" + (a > 0 ? (b > 0 ? "＞0 实际左移" : "＜0 实际右移") : (b > 0 ? "＞0 实际右移" : "＜0 实际左移")) + " " + Math.abs(b / a).toFixed(1)) : "");
    }
    ["sig", "a", "b"].forEach(function (k) {
      ctl[k].addEventListener(ctl[k].tagName === "SELECT" ? "change" : "input", draw);
    });
    S._redraws.push(draw);
    draw();
  };

  /* ══ 2. 冲激信号 δ(t) 的形成（矩形脉冲极限）═══════════ */
  S["delta-limit"] = function (body) {
    var cv = S.canvasRow(body, ["矩形脉冲 p_τ(t)：宽 τ、高 1/τ", "脉冲宽度趋零 → 单位冲激 δ(t)"], 2);
    var p1 = new Plot(cv[0], { x0: -3, x1: 3, y0: -0.6, y1: 11, xLabel: "t" });
    var p2 = new Plot(cv[1], { x0: -3, x1: 3, y0: -0.6, y1: 3.2, xLabel: "t" });
    var ctl = S.makeControls(body, [
      { k: "tau", label: "脉宽 τ", min: 0.04, max: 2, step: 0.01, val: 1, fmt: function (v) { return v.toFixed(2); } },
      { btn: "▶ τ → 0 动画", primary: true, onClick: play },
      { btn: "重置", onClick: function () { ctl.tau.value = 1; ctl.tau._refreshVal(); draw(); } }
    ]);
    var ro = S.readout(body, "");
    var playing = false;
    function pulse(t, tau) { return Math.abs(t) < tau / 2 ? 1 / tau : 0; }
    function draw() {
      var tau = ctl.num("tau");
      p1.clear(); p1.grid(12, 6); p1.axes();
      p1.area(function (t) { return pulse(t, tau); }, -tau / 2, tau / 2, C.blue);
      p1.fn(function (t) { return pulse(t, tau); }, C.blue, 2.4);
      p1.text("高 = 1/τ = " + (1 / tau).toFixed(2), 0.15, 1 / tau - 0.7, C.text);
      /* 第二块画布：极限示意 */
      p2.clear(); p2.grid(12, 6); p2.axes();
      var ctx = p2.ctx;
      if (tau < 0.12) {
        /* 已接近 δ：画冲激箭头 */
        ctx.save();
        ctx.strokeStyle = C.orange; ctx.fillStyle = C.orange; ctx.lineWidth = 3;
        var x0 = p2.px(0), y0 = p2.py(0), y1 = p2.py(2.4);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x0 - 6, y1 + 9); ctx.lineTo(x0, y1); ctx.lineTo(x0 + 6, y1 + 9); ctx.closePath(); ctx.fill();
        ctx.font = "13px Cambria, serif";
        ctx.fillText("(1)", x0 + 9, y1 + 16);
        ctx.restore();
        p2.text("δ(t)：t≠0 处为 0，强度（面积）为 1", 0.35, 2.6, C.orange);
      } else {
        p2.area(function (t) { return pulse(t, tau); }, -tau / 2, tau / 2, C.orange);
        p2.fn(function (t) { return pulse(t, tau); }, C.orange, 2.4);
        p2.text("继续减小 τ…", 0.3, 2.6, C.text);
      }
      ro.innerHTML = "当前：宽 <span class='rd'>τ = " + tau.toFixed(2) + "</span>，高 <span class='rd'>1/τ = " + (1 / tau).toFixed(2) +
        "</span>，脉冲面积 <span class='rd'>S = τ × 1/τ = 1（恒定不变）</span>" +
        (tau < 0.12 ? '　<span class="sim-badge ok">已可视作 δ(t)</span>' : "");
    }
    function play() {
      if (playing) { playing = false; return; }
      playing = true;
      (function step() {
        if (!playing || !cv[0].isConnected) { playing = false; return; }
        var tau = parseFloat(ctl.tau.value);
        tau = Math.max(0.04, tau * 0.93);
        ctl.tau.value = tau; ctl.tau._refreshVal();
        draw();
        if (tau > 0.045) requestAnimationFrame(step);
        else playing = false;
      })();
    }
    ctl.tau.addEventListener("input", draw);
    S._redraws.push(draw);
    draw();
  };

  /* ══ 3. 系统性质判定实验 ═════════════════════════════ */
  S["system-props"] = function (body) {
    var cv = S.canvasRow(body, ["输入 x(t)", "输出 y(t)"], 2);
    var p1 = new Plot(cv[0], { x0: -6, x1: 6, y0: -1.6, y1: 1.9, xLabel: "t" });
    var p2 = new Plot(cv[1], { x0: -6, x1: 6, y0: -3.2, y1: 3.4, xLabel: "t" });

    var inputs = {
      sine: { name: "sin 2t", f: function (t) { return Math.sin(2 * t); } },
      step: { name: "ε(t)", f: function (t) { return u(t); } },
      square: { name: "对称方波", f: function (t) { return Math.sin(t) >= 0 ? 1 : -1; } },
      decay: { name: "exp(−t)·ε(t)", f: function (t) { return t >= 0 ? Math.exp(-t) : 0; } }
    };
    var systems = {
      "2x+1": {
        name: "y = 2x(t) + 1",
        props: { linear: "增量线性", ti: true, causal: true, stable: true },
        why: "不满足零输入线性（x=0 时 y=1≠0），但满足增量线性；参数恒定 → 时不变。",
        y: function (x, t) { return 2 * x(t) + 1; }
      },
      "x2": {
        name: "y = x²(t)",
        props: { linear: false, ti: true, causal: true, stable: false },
        why: "叠加性不成立：T[x₁+x₂] = (x₁+x₂)² ≠ x₁²+x₂²；方波输入时输出恒为 1（有界），但一般不保证有界（如 x=1/(1−t)）。通常按非线性处理。",
        y: function (x, t) { var v = x(t); return v * v; }
      },
      "tx": {
        name: "y = t·x(t)",
        props: { linear: true, ti: false, causal: true, stable: false },
        why: "含时变系数 t → 时变（输入延迟 1s，输出并非延迟 1s）；线性成立；t 无界增长导致不稳定。",
        y: function (x, t) { return t * x(t); }
      },
      "x2t": {
        name: "y = x(2t)",
        props: { linear: true, ti: false, causal: false, stable: true },
        why: "时间尺度压缩 → 时变；y(t) 在 t>0 时用到 x(2t)（未来的输入）→ 非因果。",
        y: function (x, t) { return x(2 * t); }
      },
      "delay": {
        name: "y = x(t − 1)",
        props: { linear: true, ti: true, causal: true, stable: true },
        why: "延迟系统：线性、时不变、因果、稳定的标准例子。",
        y: function (x, t) { return x(t - 1); }
      },
      "integ": {
        name: "y = ∫x dτ",
        props: { linear: true, ti: true, causal: true, stable: false },
        why: "积分器：线性、时不变、因果；但 ε(t) 输入时输出无界增长 → BIBO 不稳定。",
        y: function (x, t) {
          var s = 0, a = -8, n = 200, h = (t - a) / n;
          for (var i = 0; i < n; i++) s += x(a + (i + 0.5) * h) * h;
          return s;
        }
      }
    };
    var ctl = S.makeControls(body, [
      { k: "in", label: "输入", sel: [["sine", "sin 2t"], ["step", "ε(t)"], ["square", "方波"], ["decay", "exp(−t)·ε(t)"]], val: "sine" },
      { k: "sys", label: "系统", sel: Object.keys(systems).map(function (k) { return [k, systems[k].name]; }), val: "2x+1" }
    ]);
    var ro = S.readout(body, "");
    function badge(ok, label, txt) {
      var cls = ok === true ? "ok" : ok === false ? "bad" : "warn";
      return '<span class="sim-badge ' + cls + '">' + label + "：" + txt + "</span>";
    }
    function draw() {
      var x = inputs[ctl.in.value].f;
      var sys = systems[ctl.sys.value];
      var y = function (t) { return sys.y(x, t); };
      p1.clear(); p1.grid(12, 6); p1.axes(); p1.fn(x, C.blue, 2.2);
      p2.clear(); p2.grid(12, 6); p2.axes(); p2.fn(y, C.orange, 2.2);
      var pr = sys.props;
      ro.innerHTML =
        badge(pr.linear === true, "线性", pr.linear === true ? "满足" : (pr.linear === "增量线性" ? "增量线性" : "不满足")) +
        badge(pr.ti === true, "时不变", pr.ti ? "满足" : "不满足") +
        badge(pr.causal === true, "因果", pr.causal ? "满足" : "不满足") +
        badge(pr.stable === true, "稳定", pr.stable ? "满足" : "不满足") +
        "<br>判定理由：" + sys.why;
    }
    ctl.in.addEventListener("change", draw);
    ctl.sys.addEventListener("change", draw);
    S._redraws.push(draw);
    draw();
  };

  /* ══ 4. 卷积积分动态演示 ═════════════════════════════ */
  S["conv-demo"] = function (body) {
    var cv = S.canvasRow(body, [
      "翻转—平移：f₁(τ) 与 f₂(t−τ)，绿色为乘积 f₁(τ)·f₂(t−τ)",
      "卷积结果 y(t) = (f₁ * f₂)(t)，随 t 增长"
    ], 2);
    var sigs = {
      u: { name: "ε(t)", f: u },
      e1: { name: "exp(−t)·ε(t)", f: function (t) { return t >= 0 ? Math.exp(-t) : 0; } },
      e2: { name: "exp(−2t)·ε(t)", f: function (t) { return t >= 0 ? Math.exp(-2 * t) : 0; } },
      g1: { name: "g₁(t)（宽1矩形）", f: function (t) { return t >= 0 && t <= 1 ? 1 : 0; } },
      tri: { name: "三角(0~2)", f: function (t) { return t >= 0 && t <= 1 ? t : (t > 1 && t <= 2 ? 2 - t : 0); } },
      cos: { name: "cos(2t)ε(t)", f: function (t) { return t >= 0 ? Math.cos(2 * t) : 0; } }
    };
    var TMAX = 8;
    var p1 = new Plot(cv[0], { x0: -1, x1: TMAX + 1, y0: -1.4, y1: 1.6, xLabel: "τ" });
    var p2 = new Plot(cv[1], { x0: -1, x1: TMAX + 1, y0: -0.4, y1: 2.2, xLabel: "t" });

    var f1 = sigs.u.f, f2 = sigs.e1.f;
    var yFull = [];
    function computeAll() {
      yFull = [];
      var tStep = 0.02, tauStep = 0.004;
      for (var t = 0; t <= TMAX + 0.001; t += tStep) {
        var s = 0;
        for (var tau = 0; tau <= t + 1e-9; tau += tauStep) s += f1(tau) * f2(t - tau);
        yFull.push(s * tauStep);
      }
    }
    var ctl = S.makeControls(body, [
      { k: "s1", label: "f₁", sel: Object.keys(sigs).map(function (k) { return [k, sigs[k].name]; }), val: "u", onChange: recompute },
      { k: "s2", label: "f₂", sel: Object.keys(sigs).map(function (k) { return [k, sigs[k].name]; }), val: "e1", onChange: recompute },
      { k: "t", label: "t", min: 0, max: TMAX, step: 0.02, val: 2, fmt: function (v) { return v.toFixed(2); }, onChange: function () { playing = false; draw(); } },
      { btn: "▶ 播放", primary: true, onClick: togglePlay },
      { btn: "⏸ 暂停", onClick: function () { playing = false; } }
    ]);
    var ro = S.readout(body, "");
    var playing = false;
    function recompute() {
      f1 = sigs[ctl.s1.value].f;
      f2 = sigs[ctl.s2.value].f;
      computeAll();
      draw();
    }
    function yAt(t) {
      var i = t / 0.02;
      var i0 = Math.floor(i), i1 = Math.min(yFull.length - 1, i0 + 1);
      if (i0 < 0) return 0;
      if (i0 >= yFull.length) return yFull[yFull.length - 1];
      return yFull[i0] + (yFull[i1] - yFull[i0]) * (i - i0);
    }
    function draw() {
      var t = ctl.num("t");
      p1.clear(); p1.grid(12, 6); p1.axes();
      p1.fn(f1, C.blue, 2);
      p1.fn(function (tau) { return f2(t - tau); }, C.orange, 2);
      var prod = function (tau) { return f1(tau) * f2(t - tau); };
      p1.area(prod, Math.max(-1, 0), Math.min(TMAX + 1, t), C.green);
      p1.fn(prod, C.green, 1.4);
      p1.line(t, -1.4, t, 1.6, C.grey, 1, [4, 4]);
      p1.text("t = " + t.toFixed(2), Math.min(t + 0.1, TMAX - 1), -1.05, C.grey);

      p2.clear(); p2.grid(12, 6); p2.axes();
      p2.fn(function (x) { return yAt(x); }, C.grey, 1.4, [5, 4]);
      if (t > 0) {
        p2.fn(function (x) { return x <= t ? yAt(x) : NaN; }, C.accent, 2.6);
      }
      p2.dot(t, yAt(t), C.accent, 4);
      ro.innerHTML = "重叠区间内乘积曲线下的面积即卷积值：<span class='rd'>t = " + t.toFixed(2) +
        "</span>　→　<span class='rd'>y(t) = " + yAt(t).toFixed(4) + "</span>" +
        '<br><span style="color:var(--text-2)">绿色面积从 t=0 开始累积，形成下方 y(t) 曲线——这就是"翻转、平移、相乘、积分"四步。</span>';
    }
    function togglePlay() {
      if (playing) { playing = false; return; }
      playing = true;
      (function step() {
        if (!playing || !cv[0].isConnected) { playing = false; return; }
        var t = parseFloat(ctl.t.value) + 0.035;
        if (t >= TMAX) t = 0;
        ctl.t.value = t; ctl.t._refreshVal();
        draw();
        requestAnimationFrame(step);
      })();
    }
    ctl.t.addEventListener("input", function () { playing = false; draw(); });
    S._redraws.push(function () { computeAll(); draw(); });
    recompute();
  };
})();

</script>
<script>
/* ── sims-b.js ── */
/* 实验组 B：卷积和 / 傅里叶级数合成 / 时频对偶 / 抽样定理 */
(function () {
  "use strict";
  var S = window.SIG_SIMS, C = S.colors, Plot = S.Plot;
  function u(k) { return k >= 0 ? 1 : 0; }
  function Sa(x) { return Math.abs(x) < 1e-7 ? 1 : Math.sin(x) / x; }

  /* ══ 5. 卷积和（离散卷积）════════════════════════════ */
  S["conv-sum"] = function (body) {
    var cv = S.canvasRow(body, ["对位相乘：f₁(i)（蓝）与 f₂(k−i)（橙），绿色为乘积", "卷积和结果 y(k) = Σ f₁(i)·f₂(k−i)"], 2);
    var KMAX = 12;
    var seqs = {
      u: { name: "ε(k)", f: function (k) { return u(k); } },
      a8: { name: "0.8ᵏε(k)", f: function (k) { return k >= 0 ? Math.pow(0.8, k) : 0; } },
      g3: { name: "ε(k)−ε(k−3)", f: function (k) { return k >= 0 && k < 3 ? 1 : 0; } },
      imp3: { name: "δ(k)+2δ(k−1)+δ(k−2)", f: function (k) { return k === 0 ? 1 : k === 1 ? 2 : k === 2 ? 1 : 0; } },
      a5r: { name: "0.5ᵏε(k)", f: function (k) { return k >= 0 ? Math.pow(0.5, k) : 0; } }
    };
    var p1 = new Plot(cv[0], { x0: -2, x1: KMAX + 2, y0: -1.3, y1: 2.6, xLabel: "i", intX: true });
    var p2 = new Plot(cv[1], { x0: -2, x1: KMAX + 2, y0: -1.3, y1: 4.6, xLabel: "k", intX: true });
    var f1 = seqs.u.f, f2 = seqs.a8.f;

    var ctl = S.makeControls(body, [
      { k: "s1", label: "f₁", sel: Object.keys(seqs).map(function (k) { return [k, seqs[k].name]; }), val: "u", onChange: setSeqs },
      { k: "s2", label: "f₂", sel: Object.keys(seqs).map(function (k) { return [k, seqs[k].name]; }), val: "a8", onChange: setSeqs },
      { k: "k", label: "k", min: 0, max: KMAX, step: 1, val: 4, fmt: function (v) { return String(Math.round(v)); }, onChange: function () { playing = false; draw(); } },
      { btn: "▶ 播放", primary: true, onClick: togglePlay }
    ]);
    var ro = S.readout(body, "");
    var playing = false;
    function yOf(k) {
      var s = 0;
      for (var i = -6; i <= k + 6; i++) s += f1(i) * f2(k - i);
      return s;
    }
    function setSeqs() {
      f1 = seqs[ctl.s1.value].f;
      f2 = seqs[ctl.s2.value].f;
      draw();
    }
    function draw() {
      var k = Math.round(ctl.num("k"));
      p1.clear(); p1.grid(14, 6); p1.axes();
      var a = [], b = [], pr = [];
      for (var i = -2; i <= KMAX + 2; i++) {
        if (i >= 0) a.push({ x: i, y: f1(i) });
        var vi = k - i;
        if (vi >= 0 && i >= -2 && i <= KMAX + 2) b.push({ x: i, y: f2(vi) });
        if (i >= 0 && vi >= 0) {
          var pv = f1(i) * f2(vi);
          if (pv !== 0) pr.push({ x: i, y: pv });
        }
      }
      p1.stems(a, C.blue, 3);
      p1.stems(b, C.orange, 3);
      p1.stems(pr, C.green, 3.4);
      p1.line(k, -1.3, k, 2.6, C.grey, 1, [4, 4]);

      p2.clear(); p2.grid(14, 6); p2.axes();
      var full = [], part = [];
      for (var m = 0; m <= KMAX; m++) full.push({ x: m, y: yOf(m) });
      for (var m2 = 0; m2 <= k; m2++) part.push({ x: m2, y: yOf(m2) });
      p2.stems(full, C.grey, 2);
      p2.stems(part, C.accent, 3.6);

      var terms = [];
      for (var i2 = 0; i2 <= k; i2++) {
        var v = f1(i2) * f2(k - i2);
        if (Math.abs(v) > 1e-9) terms.push(f1(i2).toFixed(2).replace(/\.?0+$/, "") + "×" + f2(k - i2).toFixed(2).replace(/\.?0+$/, ""));
      }
      ro.innerHTML = "当前 <span class='rd'>k = " + k + "</span>：y(" + k + ") = " +
        (terms.length ? terms.join(" + ") : "0") +
        " = <span class='rd'>" + yOf(k).toFixed(4) + "</span>" +
        '<br><span style="color:var(--text-2)">橙色序列是 f₂ 反转后再右移 k 得到的 f₂(k−i)；两列茎线重叠处的乘积（绿色）求和即得 y(k)。</span>';
    }
    function togglePlay() {
      if (playing) { playing = false; return; }
      playing = true;
      (function step() {
        if (!playing || !cv[0].isConnected) { playing = false; return; }
        var k = Math.round(parseFloat(ctl.k.value)) + 1;
        if (k > KMAX) k = 0;
        ctl.k.value = k; ctl.k._refreshVal();
        draw();
        setTimeout(step, 420);
      })();
    }
    ctl.k.addEventListener("input", function () { playing = false; draw(); });
    S._redraws.push(draw);
    setSeqs();
  };

  /* ══ 6. 傅里叶级数谐波合成（吉布斯现象）══════════════ */
  S["fs-synth"] = function (body) {
    var cv = S.canvasRow(body, ["谐波合成：灰色为目标周期信号，蓝色为部分和 sₙ(t)", "幅度谱 |cₙ|：蓝色为当前参与合成的谐波分量"], 2);
    var modes = {
      square: {
        name: "对称方波",
        target: function (t) { var r = ((t + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return r >= 0 ? 1 : -1; },
        c: function (n) { return n % 2 === 1 ? 4 / (Math.PI * n) : 0; }
      },
      saw: {
        name: "锯齿波",
        target: function (t) { var r = ((t + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return -r / (Math.PI / 2); },
        c: function (n) { return 2 / (Math.PI * n) * (n % 2 === 1 ? 1 : -1); }
      },
      tri: {
        name: "三角波",
        target: function (t) {
          var r = ((t + Math.PI / 2) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI / 2;
          var a = Math.abs(r);
          return a <= Math.PI / 2 ? a / (Math.PI / 4) : (Math.PI - a) / (Math.PI / 4);
        },
        c: function (n) { return n % 2 === 1 ? 8 / (Math.PI * Math.PI * n * n) * (n % 4 === 1 ? 1 : -1) : 0; }
      }
    };
    var p1 = new Plot(cv[0], { x0: -Math.PI, x1: 3 * Math.PI, y0: -1.9, y1: 1.9, xLabel: "t" });
    var p2 = new Plot(cv[1], { x0: 0, x1: 16.5, y0: -0.12, y1: 1.45, xLabel: "n（谐波次数）", intX: true });
    var ctl = S.makeControls(body, [
      { k: "mode", label: "目标波形", sel: [["square", "对称方波"], ["saw", "锯齿波"], ["tri", "三角波"]], val: "square", onChange: draw },
      { k: "N", label: "谐波数 N", min: 1, max: 60, step: 1, val: 3, fmt: function (v) { return String(Math.round(v)); }, onChange: function () { playing = false; draw(); } },
      { btn: "▶ 逐个叠加谐波", primary: true, onClick: togglePlay }
    ]);
    var ro = S.readout(body, "");
    var playing = false;
    function partial(t, mode, N) {
      var s = 0;
      for (var n = 1; n <= N; n++) s += modes[mode].c(n) * Math.sin(n * t);
      return s;
    }
    function draw() {
      var mode = ctl.mode.value, N = Math.round(ctl.num("N"));
      p1.clear(); p1.grid(14, 6); p1.axes();
      p1.fn(function (t) { return modes[mode].target(t); }, C.grey, 1.6, [6, 4]);
      p1.fn(function (t) { return partial(t, mode, N); }, C.blue, 2.2);
      p2.clear(); p2.grid(14, 6); p2.axes();
      var bars = [];
      for (var n = 1; n <= 15; n++) if (modes[mode].c(n) !== 0) bars.push({ x: n, y: modes[mode].c(n) });
      p2.stems(bars.map(function (b2) { return { x: b2.x, y: 0 }; }), "transparent", 0.1);
      bars.forEach(function (b3) {
        var col = b3.x <= N ? C.blue : C.grey;
        p2.line(b3.x, 0, b3.x, b3.y, col, 3);
        p2.dot(b3.x, b3.y, col, 3.6);
      });
      ro.innerHTML = "当前叠加到第 <span class='rd'>N = " + N + "</span> 次谐波。" +
        (mode === "square" && N >= 10 ? '　<span class="sim-badge warn">吉布斯现象：跳变边沿仍有 ≈9% 的过冲，不随 N 增大而消失</span>' : "") +
        (mode === "tri" && N >= 3 ? '　<span class="sim-badge ok">三角波谱按 1/n² 衰减，3~5 次谐波已非常接近</span>' : "") +
        '<br><span style="color:var(--text-2)">频谱特点是离散（只含基频整数倍）、谐波幅度总趋势收敛——N 越大合成波形越接近目标。</span>';
    }
    function togglePlay() {
      if (playing) { playing = false; return; }
      playing = true;
      (function step() {
        if (!playing || !cv[0].isConnected) { playing = false; return; }
        var N = Math.round(parseFloat(ctl.N.value)) + 1;
        if (N > 60) N = 1;
        ctl.N.value = N; ctl.N._refreshVal();
        draw();
        setTimeout(step, 330);
      })();
    }
    ctl.N.addEventListener("input", function () { playing = false; draw(); });
    S._redraws.push(draw);
    draw();
  };

  /* ══ 7. 时频对偶：脉宽与带宽成反比 ═══════════════════ */
  S["ft-duality"] = function (body) {
    var cv = S.canvasRow(body, ["时域波形", "频谱 |F(jω)|"], 2);
    var p1 = new Plot(cv[0], { x0: -5, x1: 5, y0: -0.5, y1: 1.8, xLabel: "t" });
    var p2 = new Plot(cv[1], { x0: -25, x1: 25, y0: -0.5, y1: 3.2, xLabel: "ω" });
    var ctl = S.makeControls(body, [
      { k: "mode", label: "信号", sel: [["rect", "矩形脉冲 g_τ(t)"], ["sinc", "抽样函数 Sa(ω_c·t)"]], val: "rect", onChange: function () { playing = false; draw(); } },
      { k: "w", label: "τ / ω_c", min: 0.5, max: 6, step: 0.1, val: 3, fmt: function (v) { return v.toFixed(1); }, onChange: function () { playing = false; draw(); } }
    ]);
    var ro = S.readout(body, "");
    function draw() {
      var w = ctl.num("w");
      if (ctl.mode.value === "rect") {
        p1.clear(); p1.grid(12, 5); p1.axes();
        p1.area(function (t) { return Math.abs(t) <= w / 2 ? 1 : 0; }, -w / 2, w / 2, C.blue);
        p1.fn(function (t) { return Math.abs(t) <= w / 2 ? 1 : 0; }, C.blue, 2.4);
        p1.text("τ = " + w.toFixed(1), 0.3, 1.25, C.text);
        p2.clear(); p2.grid(12, 5); p2.axes();
        p2.fn(function (om) { return w * Sa(om * w / 2); }, C.orange, 2.2);
        var zc = 2 * Math.PI / w;
        [-zc, zc].forEach(function (z) { p2.line(z, -0.5, z, 3.2, C.grey, 1.2, [4, 4]); });
        p2.text("±2π/τ", zc + 0.4, 2.7, C.grey);
        ro.innerHTML = "时域：宽 <span class='rd'>τ = " + w.toFixed(1) + "</span>　→　频谱 <span class='rd'>τ·Sa(ωτ/2)</span>，第一零点（主瓣边界）<span class='rd'>2π/τ = " + (2 * Math.PI / w).toFixed(2) + " rad/s</span>。" +
          '<span class="sim-badge ok">时宽 × 带宽 ≈ 常数：τ 减小 → 频谱展宽（反比关系）</span>';
      } else {
        p1.clear(); p1.grid(12, 5); p1.axes();
        p1.fn(function (t) { return Sa(w * t); }, C.blue, 2.4);
        p1.text("主瓣半宽 π/ω_c = " + (Math.PI / w).toFixed(2), 0.4, 1.25, C.text);
        p2.clear(); p2.grid(12, 5); p2.axes();
        var h = Math.PI / w;
        p2.area(function (om) { return Math.abs(om) <= w ? h : 0; }, -w, w, C.orange);
        p2.fn(function (om) { return Math.abs(om) <= w ? h : 0; }, C.orange, 2.4);
        p2.text("高 π/ω_c = " + h.toFixed(2), w / 2 + 0.5, h * 0.85, C.text);
        p2.line(-w, -0.5, -w, h, C.grey, 1.2, [4, 4]);
        p2.line(w, -0.5, w, h, C.grey, 1.2, [4, 4]);
        ro.innerHTML = "对偶情形：时域 <span class='rd'>Sa(ω_c t)</span>（主瓣宽 2π/ω_c）　↔　频域为宽 <span class='rd'>2ω_c = " + (2 * w).toFixed(1) + "</span> 的矩形谱（理想低通）。" +
          '<span class="sim-badge ok">时域越窄 ↔ 频域越宽，两个域不能同时变窄</span>';
      }
    }
    S._redraws.push(draw);
    draw();
  };

  /* ══ 8. 抽样定理与混叠 ═══════════════════════════════ */
  S["sampling"] = function (body) {
    var cv = S.canvasRow(body, [
      "时域：x(t)（灰）、样值（红点）、内插恢复 x_r(t)（蓝）",
      "频域：基带频谱与以 f_s 为间隔的周期延拓副本（红区为混叠区）"
    ], 2);
    var FM = 2; /* 最高频率 2 Hz */
    function x(t) { return Math.cos(2 * Math.PI * t) + 0.5 * Math.cos(4 * Math.PI * t); }
    var p1 = new Plot(cv[0], { x0: 0, x1: 2, y0: -2.1, y1: 2.3, xLabel: "t / s" });
    var p2 = new Plot(cv[1], { x0: -14, x1: 14, y0: -0.25, y1: 1.7, xLabel: "f / Hz" });
    var ctl = S.makeControls(body, [
      { k: "fs", label: "抽样频率 f_s", min: 2.5, max: 12, step: 0.1, val: 8, fmt: function (v) { return v.toFixed(1) + "Hz"; }, onChange: draw },
      { btn: "▶ fs 动画（由高到低）", primary: true, onClick: play }
    ]);
    var ro = S.readout(body, "");
    var playing = false;
    function recon(t, fs) {
      var T = 1 / fs, s = 0;
      for (var n = -30; n <= 40; n++) s += x(n * T) * Sa(Math.PI * (t - n * T) / T);
      return s;
    }
    function specLine(f, h, color, alpha) {
      p2.line(f, 0, f, h, color, 2.4);
      p2.dot(f, h, color, 2.6);
    }
    function draw() {
      var fs = ctl.num("fs");
      p1.clear(); p1.grid(10, 5); p1.axes();
      p1.fn(x, C.grey, 1.6);
      var T = 1 / fs, samples = [];
      for (var t = 0; t <= 2 + 1e-9; t += T) {
        samples.push({ x: t, y: x(t) });
        p1.line(t, 0, t, x(t), C.red, 1.4);
        p1.dot(t, x(t), C.red, 3.2);
      }
      p1.fn(function (t) { return recon(t, fs); }, C.blue, 2);
      var err = 0;
      for (var e = 0; e <= 2; e += 0.01) err = Math.max(err, Math.abs(x(e) - recon(e, fs)));

      p2.clear(); p2.grid(14, 5); p2.axes();
      /* 混叠区 */
      if (fs < 2 * FM) {
        p2.area(function () { return 1.7; }, fs - FM, FM, C.red, 0.25);
        p2.area(function () { return 1.7; }, -FM, -(fs - FM), C.red, 0.25);
      }
      for (var k = -2; k <= 2; k++) {
        var base = k * fs;
        if (Math.abs(base) > 13.5) continue;
        var col = k === 0 ? C.accent : C.grey;
        specLine(base + 1, 1, col);
        specLine(base - 1, 1, col);
        specLine(base + FM, 0.5, col);
        specLine(base - FM, 0.5, col);
      }
      p2.line(2 * FM, -0.25, 2 * FM, 1.7, C.orange, 1.2, [4, 3]);
      p2.text("2f_m", 2 * FM + 0.3, 1.5, C.orange);
      var ok = fs >= 2 * FM;
      ro.innerHTML = (ok
        ? '<span class="sim-badge ok">f_s = ' + fs.toFixed(1) + ' Hz ≥ 2f_m = 4 Hz：满足抽样定理，恢复曲线与原信号重合（误差 ' + err.toFixed(3) + '）</span>'
        : '<span class="sim-badge bad">f_s = ' + fs.toFixed(1) + ' Hz ＜ 2f_m = 4 Hz：发生混叠！恢复信号失真（误差 ' + err.toFixed(3) + '）</span>') +
        '<br><span style="color:var(--text-2)">下方频谱中，抽样使基带频谱以 f_s 为间隔复制；当副本与基带重叠（红区）时无法用低通滤波分离，即混叠。降低 f_s 观察恢复曲线的畸变。</span>';
    }
    function play() {
      if (playing) { playing = false; return; }
      playing = true;
      (function step() {
        if (!playing || !cv[0].isConnected) { playing = false; return; }
        var fs = parseFloat(ctl.fs.value) - 0.15;
        if (fs < 2.5) { playing = false; return; }
        ctl.fs.value = fs; ctl.fs._refreshVal();
        draw();
        setTimeout(step, 120);
      })();
    }
    ctl.fs.addEventListener("input", draw);
    S._redraws.push(draw);
    draw();
  };
})();

</script>
<script>
/* ── sims-c.js ── */
/* 实验组 C：幅度调制 / 理想低通滤波 / s 平面极点 / z 平面极点 */
(function () {
  "use strict";
  var S = window.SIG_SIMS, C = S.colors, Plot = S.Plot;
  function u(t) { return t >= 0 ? 1 : 0; }
  function Sa(x) { return Math.abs(x) < 1e-7 ? 1 : Math.sin(x) / x; }

  /* ══ 9. 幅度调制（AM）与频谱搬移 ═════════════════════ */
  S["am-mod"] = function (body) {
    var cv = S.canvasRow(body, ["时域：已调信号 s(t) = [1 + k·m(t)]·cos(2πf_c t)（橙虚线为包络）", "频谱：载波 f_c 与上、下边带 f_c ± f_m"], 2);
    var FM = 1; /* message 1 Hz */
    var p1 = new Plot(cv[0], { x0: 0, x1: 1, y0: -2.3, y1: 2.3, xLabel: "t / s" });
    var p2 = new Plot(cv[1], { x0: -2, x1: 15, y0: -0.2, y1: 1.4, xLabel: "f / Hz" });
    var ctl = S.makeControls(body, [
      { k: "fc", label: "载频 f_c", min: 3, max: 12, step: 0.5, val: 6, fmt: function (v) { return v.toFixed(1) + "Hz"; }, onChange: draw },
      { k: "k", label: "调幅度 k", min: 0.2, max: 1, step: 0.05, val: 0.6, fmt: function (v) { return v.toFixed(2); }, onChange: draw }
    ]);
    var ro = S.readout(body, "");
    function draw() {
      var fc = ctl.num("fc"), k = ctl.num("k");
      var m = function (t) { return Math.cos(2 * Math.PI * FM * t); };
      var env = function (t) { return 1 + k * m(t); };
      p1.clear(); p1.grid(10, 5); p1.axes();
      p1.fn(function (t) { return env(t); }, C.orange, 1.6, [5, 4]);
      p1.fn(function (t) { return -env(t); }, C.orange, 1.6, [5, 4]);
      p1.fn(function (t) { return env(t) * Math.cos(2 * Math.PI * fc * t); }, C.blue, 1.4);
      p1.fn(m, C.grey, 1.2, [2, 3]);
      p1.text("包络 = ±[1 + k·m(t)]", 0.52, 2.0, C.orange);

      p2.clear(); p2.grid(14, 5); p2.axes();
      function line1(f, h, color) { p2.line(f, 0, f, h, color, 2.4); p2.dot(f, h, color, 2.6); }
      line1(FM, 0.6, C.grey); line1(-FM, 0.6, C.grey);
      line1(fc, 1, C.accent); line1(-fc, 1, C.accent);
      line1(fc + FM, k / 2, C.blue); line1(fc - FM, k / 2, C.blue);
      line1(-fc + FM, k / 2, C.blue); line1(-fc - FM, k / 2, C.blue);
      p2.text("f_m", FM + 0.25, 0.72, C.grey);
      p2.text("f_c", fc + 0.25, 1.12, C.accent);
      p2.text("f_c±f_m", fc + FM + 0.3, k / 2 + 0.16, C.blue);
      p2.line(fc - FM, 1.35, fc + FM, 1.35, C.grey, 1.2, [4, 3]);
      p2.text("带宽 2f_m", fc - 0.6, 1.42, C.grey);
      ro.innerHTML = "频谱分量：载波 <span class='rd'>±f_c = ±" + fc.toFixed(1) + " Hz</span>（幅度 1），上、下边带 <span class='rd'>f_c ± f_m = " +
        (fc - FM).toFixed(1) + " / " + (fc + FM).toFixed(1) + " Hz</span>（幅度 k/2 = " + (k / 2).toFixed(2) + "）。" +
        '<span class="sim-badge ok">调制 = 频谱搬移：基带 1 Hz 被搬到 ±f_c 附近，信号带宽变为 2f_m = 2 Hz</span>' +
        '<br><span style="color:var(--text-2)">接收端再乘一次 cos(2πf_c t)（同步解调），频谱搬回原点，经低通即恢复 m(t)。增大 f_c 观察载波变密、边带远离载频。</span>';
    }
    S._redraws.push(draw);
    draw();
  };

  /* ══ 10. 理想低通滤波器 ══════════════════════════════ */
  S["filter-lp"] = function (body) {
    var cv = S.canvasRow(body, [
      "频率响应 |H(jf)|：截止频率 f_c（竖直虚线为输入信号的三个频率分量）",
      "时域：输入 x(t)（灰）与滤波输出 y(t)（蓝，含时延 t_d）"
    ], 2);
    var FREQS = [0.8, 2.2, 4.0];
    var AMPS = [1, 0.7, 0.5];
    var COLS = [C.green, C.orange, C.purple];
    var TD = 0.12;
    var p1 = new Plot(cv[0], { x0: 0, x1: 5.5, y0: -0.15, y1: 1.35, xLabel: "f / Hz" });
    var p2 = new Plot(cv[1], { x0: 0, x1: 2, y0: -2.6, y1: 2.6, xLabel: "t / s" });
    var ctl = S.makeControls(body, [
      { k: "fc", label: "截止频率 f_c", min: 0.5, max: 5, step: 0.05, val: 1.5, fmt: function (v) { return v.toFixed(2) + "Hz"; }, onChange: draw }
    ]);
    var ro = S.readout(body, "");
    function x(t) {
      var s = 0;
      for (var i = 0; i < 3; i++) s += AMPS[i] * Math.cos(2 * Math.PI * FREQS[i] * t);
      return s;
    }
    function draw() {
      var fc = ctl.num("fc");
      p1.clear(); p1.grid(11, 5); p1.axes();
      p1.area(function (f) { return f <= fc ? 1 : 0; }, 0, Math.min(fc, 5.5), C.accent, 0.14);
      p1.fn(function (f) { return f <= fc ? 1 : 0; }, C.accent, 2.6);
      for (var i = 0; i < 3; i++) {
        var pass = FREQS[i] <= fc;
        p1.line(FREQS[i], -0.15, FREQS[i], 1.28, COLS[i], 1.2, [4, 3]);
        p1.dot(FREQS[i], 1.14, pass ? COLS[i] : C.grey, 4.2);
        p1.text(FREQS[i] + "Hz", FREQS[i] - 0.42, (pass ? 1.24 : -0.03), pass ? COLS[i] : C.grey, "10.5px Consolas, monospace");
      }
      p1.text("f_c = " + fc.toFixed(2), fc + 0.08, 0.45, C.accent);

      p2.clear(); p2.grid(10, 5); p2.axes();
      p2.fn(x, C.grey, 1.6);
      var terms = [];
      for (var j = 0; j < 3; j++) {
        if (FREQS[j] <= fc) terms.push({ f: FREQS[j], A: AMPS[j], col: COLS[j] });
      }
      p2.fn(function (t) {
        var s = 0;
        terms.forEach(function (tm) { s += tm.A * Math.cos(2 * Math.PI * tm.f * (t - TD)); });
        return s;
      }, C.blue, 2.2);
      p2.line(TD, -2.6, TD, 2.6, C.grey, 1, [2, 3]);
      p2.text("t_d", TD + 0.02, 2.3, C.grey);
      var keep = terms.map(function (tm) { return tm.A + "·cos(2π·" + tm.f + "·t)"; }).join(" + ");
      ro.innerHTML = "输入含 <span class='rd'>0.8 / 2.2 / 4.0 Hz</span> 三个分量。当前 f_c = " + fc.toFixed(2) + " Hz，通过分量：<span class='rd'>" +
        (keep || "（无——输出为零）") + "</span>" +
        (terms.length === 0 ? '　<span class="sim-badge bad">全被抑制</span>' :
         terms.length === 3 ? '　<span class="sim-badge bad">f_c 过大，全部通过，滤波失效</span>' :
         '　<span class="sim-badge ok">正确滤除高频、保留低频</span>') +
        '<br><span style="color:var(--text-2)">拖动 f_c 依次跨过 4.0、2.2、0.8 Hz，观察输出波形逐次简化——这正是 |H(jω)| 对各频率分量"加权"的过程。</span>';
    }
    S._redraws.push(draw);
    draw();
  };

  /* ══ 11. s 平面极点与冲激响应 h(t) ═══════════════════ */
  S["s-pole"] = function (body) {
    var cv = S.canvasRow(body, [
      "s 平面：左半平面（绿）稳定；点击或拖动放置极点",
      "对应冲激响应 h(t)"
    ], 2);
    var p1 = new Plot(cv[0], { x0: -4.4, x1: 4.4, y0: -3.4, y1: 3.4, xLabel: "σ", yLabel: "jω" });
    var p2 = new Plot(cv[1], { x0: 0, x1: 6, y0: -3.4, y1: 3.4, xLabel: "t" });
    var mode = "cx"; /* cx 共轭对 / real 两实极点 */
    var cx = { s: -1, w: 3 };
    var real = { p1: -1, p2: -3 };
    var drag = false;

    var ctl = S.makeControls(body, [
      { k: "mode", label: "极点类型", sel: [["cx", "共轭复极点对 σ±jω"], ["real", "两个实极点"]], val: "cx", onChange: function () { mode = ctl.mode.value; draw(); } },
      { btn: "重置位置", onClick: function () { cx = { s: -1, w: 3 }; real = { p1: -1, p2: -3 }; draw(); } }
    ]);
    var ro = S.readout(body, "");

    function hOf() {
      if (mode === "cx") {
        var s = cx.s, w = cx.w;
        if (Math.abs(w) < 0.12) return { f: function (t) { return t * Math.exp(s * t); }, desc: "h(t) = t·exp(σt)·ε(t)（二重实极点）" };
        return { f: function (t) { return Math.exp(s * t) * Math.sin(w * t) / w; }, desc: "h(t) = exp(σt)·sin(ωt)/ω · ε(t)（衰减/增幅振荡）" };
      }
      var a = real.p1, b = real.p2;
      if (Math.abs(a - b) < 0.08) return { f: function (t) { return t * Math.exp(a * t) * u(t); }, desc: "h(t) = t·exp(pt)·ε(t)（二重实极点）" };
      return { f: function (t) { return (Math.exp(a * t) - Math.exp(b * t)) / (a - b) * u(t); }, desc: "h(t) = (exp(p₁t) − exp(p₂t))/(p₁−p₂) · ε(t)" };
    }
    function draw() {
      /* 左图：s 平面 */
      p1.clear(); p1.grid(11, 7); p1.axes();
      var ctx = p1.ctx;
      var x0px = p1.px(0);
      ctx.save();
      ctx.globalAlpha = 0.10; ctx.fillStyle = C.green;
      ctx.fillRect(p1.padL, p1.padT, x0px - p1.padL, p1.H - p1.padT - p1.padB);
      ctx.fillStyle = C.red;
      ctx.fillRect(x0px, p1.padT, p1.W - p1.padR - x0px, p1.H - p1.padT - p1.padB);
      ctx.restore();
      p1.text("稳定区", -4.1, 3.0, C.green, "11.5px Microsoft YaHei");
      p1.text("不稳定区", 2.3, 3.0, C.red, "11.5px Microsoft YaHei");
      function mark(x, y, label) {
        ctx.save();
        ctx.strokeStyle = C.purple; ctx.lineWidth = 2.6;
        var px = p1.px(x), py = p1.py(y), r = 6;
        ctx.beginPath();
        ctx.moveTo(px - r, py - r); ctx.lineTo(px + r, py + r);
        ctx.moveTo(px - r, py + r); ctx.lineTo(px + r, py - r);
        ctx.stroke();
        ctx.fillStyle = C.purple; ctx.font = "11.5px Cambria, serif";
        ctx.fillText(label, px + 9, py + 4);
        ctx.restore();
      }
      var poles;
      if (mode === "cx") {
        poles = [[cx.s, cx.w, "σ+jω"], [cx.s, -cx.w, "σ−jω"]];
      } else {
        poles = [[real.p1, 0, "p₁"], [real.p2, 0, "p₂"]];
      }
      poles.forEach(function (pp) { mark(pp[0], pp[1], pp[2]); });

      /* 右图：h(t) */
      p2.clear(); p2.grid(10, 6); p2.axes();
      var h = hOf();
      p2.fn(h.f, C.blue, 2.2);
      if (mode === "cx" && Math.abs(cx.w) >= 0.12) {
        p2.fn(function (t) { return Math.exp(cx.s * t); }, C.grey, 1.1, [4, 4]);
        p2.fn(function (t) { return -Math.exp(cx.s * t); }, C.grey, 1.1, [4, 4]);
        p2.text("包络 ±exp(σt)", 3.4, Math.exp(cx.s * 3.4) + 0.35, C.grey);
      }
      /* 稳定性判定 */
      var maxRe;
      if (mode === "cx") maxRe = cx.s;
      else maxRe = Math.max(real.p1, real.p2);
      var badge;
      if (maxRe < -0.06) badge = '<span class="sim-badge ok">极点在左半平面：h(t) 衰减 → 系统稳定</span>';
      else if (maxRe > 0.06) badge = '<span class="sim-badge bad">极点在右半平面：h(t) 增长 → 系统不稳定</span>';
      else badge = '<span class="sim-badge warn">极点在虚轴上：等幅（或线性增长）→ 临界稳定</span>';
      function term(p) {
        return "(s " + (p < 0 ? "+ " : "− ") + Math.abs(p).toFixed(2) + ")";
      }
      var hs = mode === "cx"
        ? "H(s) = 1 / [" + term(cx.s) + "² + " + (cx.w * cx.w).toFixed(2) + "]"
        : "H(s) = 1 / [" + term(real.p1) + term(real.p2) + "]";
      ro.innerHTML = "<span class='rd'>" + hs + "</span>　" + badge + "<br>" + h.desc +
        '<br><span style="color:var(--text-2)">极点实部决定增幅/衰减快慢，虚部决定振荡频率；把极点拖到右半平面或虚轴上观察 h(t) 的变化。</span>';
    }
    function toPlot(e) {
      var rect = cv[0].getBoundingClientRect();
      var dprW = p1.W / rect.width;
      var px = (e.clientX - rect.left) * dprW;
      var py = (e.clientY - rect.top) * (p1.H / rect.height);
      var pt = p1.fromPixels(px, py);
      return { x: Math.max(-4.2, Math.min(4.2, pt.x)), y: Math.max(-3.3, Math.min(3.3, pt.y)) };
    }
    function apply(pt) {
      if (mode === "cx") { cx.s = pt.x; cx.w = pt.y; }
      else { real.p1 = Math.max(-4.2, Math.min(4.2, pt.x - 0.7)); real.p2 = Math.min(4.2, Math.max(-4.2, pt.x + 0.7)); }
      draw();
    }
    cv[0].addEventListener("pointerdown", function (e) { drag = true; cv[0].setPointerCapture(e.pointerId); apply(toPlot(e)); });
    cv[0].addEventListener("pointermove", function (e) { if (drag) apply(toPlot(e)); });
    cv[0].addEventListener("pointerup", function () { drag = false; });
    S._redraws.push(draw);
    draw();
  };

  /* ══ 12. z 平面极点与单位序列响应 h(k) ═══════════════ */
  S["z-pole"] = function (body) {
    var cv = S.canvasRow(body, [
      "z 平面：单位圆内（绿）稳定；点击或拖动放置极点",
      "对应单位序列响应 h(k)"
    ], 2);
    var p1 = new Plot(cv[0], { x0: -1.8, x1: 1.8, y0: -1.45, y1: 1.45, xLabel: "Re(z)", yLabel: "Im(z)" });
    var p2 = new Plot(cv[1], { x0: 0, x1: 26, y0: -2.4, y1: 2.4, xLabel: "k", intX: true });
    var mode = "cx";
    var cx = { rho: 0.8, beta: Math.PI / 5 };
    var real = { p1: 0.6, p2: -0.4 };
    var drag = false;

    var ctl = S.makeControls(body, [
      { k: "mode", label: "极点类型", sel: [["cx", "共轭复极点对 ρ·exp(±jβ)"], ["real", "两个实极点"]], val: "cx", onChange: function () { mode = ctl.mode.value; draw(); } },
      { btn: "重置位置", onClick: function () { cx = { rho: 0.8, beta: Math.PI / 5 }; real = { p1: 0.6, p2: -0.4 }; draw(); } }
    ]);
    var ro = S.readout(body, "");

    function hOf() {
      if (mode === "cx") {
        var r = cx.rho, b = cx.beta;
        if (b < 0.1) return { f: function (k) { return (k + 1) * Math.pow(r, k); }, desc: "h(k) = (k+1)·ρᵏ·ε(k)（正实轴二重极点）" };
        return { f: function (k) { return Math.pow(r, k) * Math.cos(b * k); }, desc: "h(k) = ρᵏ·cos(βk)·ε(k)（衰减/增幅振荡）" };
      }
      var a = real.p1, b2 = real.p2;
      if (Math.abs(a - b2) < 0.06) return { f: function (k) { return (k + 1) * Math.pow(a, k); }, desc: "h(k) = (k+1)·pᵏ·ε(k)" };
      return { f: function (k) { return (Math.pow(a, k + 1) - Math.pow(b2, k + 1)) / (a - b2); }, desc: "h(k) = (p₁ᵏ⁺¹ − p₂ᵏ⁺¹)/(p₁−p₂) · ε(k)" };
    }
    function draw() {
      p1.clear(); p1.grid(12, 7); p1.axes();
      var ctx = p1.ctx;
      /* 单位圆内外着色 */
      ctx.save();
      var rpx = p1.px(1) - p1.px(0);
      ctx.globalAlpha = 0.10; ctx.fillStyle = C.red;
      ctx.fillRect(p1.padL, p1.padT, p1.W - p1.padL - p1.padR, p1.H - p1.padT - p1.padB);
      ctx.fillStyle = C.green;
      ctx.beginPath();
      ctx.arc(p1.px(0), p1.py(0), rpx, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = C.accent; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.arc(p1.px(0), p1.py(0), rpx, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      p1.text("|z| = 1", p1.px2x ? 0 : 0, 0, C.accent, "11px Microsoft YaHei");
      p1.text("稳定区", -1.62, 1.22, C.green, "11.5px Microsoft YaHei");
      p1.text("不稳定区", 0.95, 1.22, C.red, "11.5px Microsoft YaHei");
      function mark(x, y, label) {
        ctx.save();
        ctx.strokeStyle = C.purple; ctx.lineWidth = 2.6;
        var px = p1.px(x), py = p1.py(y), r = 6;
        ctx.beginPath();
        ctx.moveTo(px - r, py - r); ctx.lineTo(px + r, py + r);
        ctx.moveTo(px - r, py + r); ctx.lineTo(px + r, py - r);
        ctx.stroke();
        ctx.fillStyle = C.purple; ctx.font = "11.5px Cambria, serif";
        ctx.fillText(label, px + 9, py + 4);
        ctx.restore();
      }
      var poles;
      if (mode === "cx") {
        poles = [[cx.rho * Math.cos(cx.beta), cx.rho * Math.sin(cx.beta), "ρ·exp(jβ)"],
                 [cx.rho * Math.cos(cx.beta), -cx.rho * Math.sin(cx.beta), "ρ·exp(−jβ)"]];
      } else {
        poles = [[real.p1, 0, "p₁"], [real.p2, 0, "p₂"]];
      }
      poles.forEach(function (pp) { mark(pp[0], pp[1], pp[2]); });

      /* 右图 h(k) */
      p2.clear(); p2.grid(13, 6); p2.axes();
      var h = hOf();
      var pts = [];
      for (var k = 0; k <= 26; k++) pts.push({ x: k, y: h.f(k) });
      p2.stems(pts, C.blue, 3);
      if (mode === "cx" && cx.beta >= 0.1) {
        var env = [];
        for (var k2 = 0; k2 <= 26; k2 += 0.5) env.push({ x: k2, y: Math.pow(cx.rho, k2) });
        p2.fn(function (t) { return Math.pow(cx.rho, t); }, C.grey, 1.1, [4, 4]);
        p2.fn(function (t) { return -Math.pow(cx.rho, t); }, C.grey, 1.1, [4, 4]);
        p2.text("包络 ±ρᵏ", 18, 1.9, C.grey);
      }
      var maxR = mode === "cx" ? cx.rho : Math.max(Math.abs(real.p1), Math.abs(real.p2));
      var badge;
      if (maxR < 0.95) badge = '<span class="sim-badge ok">极点在单位圆内：h(k) 衰减 → 系统稳定</span>';
      else if (maxR > 1.05) badge = '<span class="sim-badge bad">极点在单位圆外：h(k) 增长 → 系统不稳定</span>';
      else badge = '<span class="sim-badge warn">极点在单位圆上：等幅（或线性增长）→ 临界稳定</span>';
      function zterm(p) {
        return "(z " + (p < 0 ? "+ " : "− ") + Math.abs(p).toFixed(2) + ")";
      }
      var hz = mode === "cx"
        ? "H(z) = z² / [z² − " + (2 * cx.rho * Math.cos(cx.beta)).toFixed(2) + "z + " + (cx.rho * cx.rho).toFixed(2) + "]"
        : "H(z) = z² / [" + zterm(real.p1) + zterm(real.p2) + "]";
      ro.innerHTML = "<span class='rd'>" + hz + "</span>　" + badge + "<br>" + h.desc +
        '<br><span style="color:var(--text-2)">极点模 ρ 决定衰减/增长速度，辐角 β 决定振荡频率（周期约 2π/β）；把极点拖出单位圆观察 h(k) 发散。</span>';
    }
    function toPlot(e) {
      var rect = cv[0].getBoundingClientRect();
      var px = (e.clientX - rect.left) * (p1.W / rect.width);
      var py = (e.clientY - rect.top) * (p1.H / rect.height);
      var pt = p1.fromPixels(px, py);
      return { x: Math.max(-1.75, Math.min(1.75, pt.x)), y: Math.max(-1.4, Math.min(1.4, pt.y)) };
    }
    function apply(pt) {
      if (mode === "cx") {
        cx.rho = Math.max(0.1, Math.min(1.7, Math.sqrt(pt.x * pt.x + pt.y * pt.y)));
        var b = Math.atan2(Math.abs(pt.y), Math.abs(pt.x));
        cx.beta = Math.abs(pt.y) < 0.1 ? 0 : Math.max(0.1, b);
      } else {
        real.p1 = Math.max(-1.7, Math.min(1.7, pt.x - 0.45));
        real.p2 = Math.min(1.7, Math.max(-1.7, pt.x + 0.45));
      }
      draw();
    }
    cv[0].addEventListener("pointerdown", function (e) { drag = true; cv[0].setPointerCapture(e.pointerId); apply(toPlot(e)); });
    cv[0].addEventListener("pointermove", function (e) { if (drag) apply(toPlot(e)); });
    cv[0].addEventListener("pointerup", function () { drag = false; });
    S._redraws.push(draw);
    draw();
  };
})();

</script>
<script>
/* ── quiz-data.js ── */
/* 题库（第 1 部分）：第 1 章 + 第 8 章
   结构：QUIZ_BANK[章id] = [ { sec: 小节标题, items: [单选, 填空, 判断] }, … ]

   exp 为详细解析；标记：^{上标} _{下标} **加粗** */
(function () {
  "use strict";
  window.QUIZ_BANK = window.QUIZ_BANK || {};

  window.QUIZ_BANK.c1 = [
    { sec: "1.1  信号的概念与分类", items: [
      { type: "choice", q: "序列 f(k) = sin(πk/6) 的周期 N 为", opts: ["6", "12", "6π", "不是周期序列"], ans: 1,
        exp: "β = π/6，由周期条件 Nβ = 2πn 得 N = 12n/6 = 2n，取 n = 1 得最小周期 N = 12。判断口诀：先算 2π/β，是有理数才有周期，其分子（约分后）即周期。" },
      { type: "blank", q: "序列 f(k) = sin(0.25πk) 的周期 N = ？（填整数）", answers: ["8"], 
        exp: "β = 0.25π = π/4，2π/β = 8 为整数，故 N = 8。验证：Nβ = 8×π/4 = 2π ✓，即 sin(π(k+8)/4) = sin(πk/4 + 2π) = sin(πk/4)。" },
      { type: "judge", q: "所有离散正弦序列 sin(βk) 都存在周期 N。", ans: false,
        exp: "错误。仅当 2π/β 为有理数时才能找到整数 N 使 Nβ = 2πn 成立。例如 sin(k/4) 中 2π/(1/4) = 8π 是无理数，不存在周期——这是本章最易错的概念：连续正弦必有周期，离散正弦不一定。" }
    ]},
    { sec: "1.2  典型连续信号", items: [
      { type: "choice", q: "关于抽样函数 Sa(t) = sin t / t，下列说法正确的是", opts: ["Sa(π) = 1", "Sa(t) 是奇函数", "Sa(nπ) = 0（n 为非零整数）", "Sa(t) 随 |t| 增大而增大"], ans: 2,
        exp: "Sa 函数要点：Sa(0) = 1（极限定义），在 t = ±π, ±2π, … 处为零，是偶函数，且随 |t| 增大振荡衰减趋于 0。全轴积分 ∫Sa(t)dt = π。这三条结论在第 4、5 章频谱分析与抽样定理中反复使用。" },
      { type: "blank", q: "积分 ∫_{−∞}^{+∞} Sa(t) dt = ？（填一个常数，可填 π 或 3.14）", answers: ["π", "3.14", "3.1416"],
        exp: "Sa 函数在整个时间轴上的积分为 π（半轴 0 到 +∞ 为 π/2）。记住方法：Sa 频谱是矩形——时域 Sa(t) 与频域宽 2、高 π 的矩形谱是一对傅里叶变换，矩形面积 2π 对应 F(0) = ∫f(t)dt，故积分为 π。" },
      { type: "judge", q: "复指数信号 e^{st}（s = σ + jω）当 σ < 0 时，其实部是衰减的正弦振荡。", ans: true,
        exp: "正确。由欧拉公式 e^{st} = e^{σt}(cos ωt + j sin ωt)：σ < 0 时 e^{σt} 衰减，实部为衰减余弦、虚部为衰减正弦；σ > 0 增幅；σ = 0 等幅。σ 决定包络、ω 决定振荡频率，这正是第 6 章极点实部、虚部意义的雏形。" }
    ]},
    { sec: "1.3  单位阶跃信号与单位冲激信号", items: [
      { type: "choice", q: "积分 ∫_{−∞}^{+∞} f(t)·δ(t − t_{0}) dt 的值为", opts: ["f(0)", "f(t_{0})", "f′(t_{0})", "∫f(t)dt"], ans: 1,
        exp: "这是 δ(t) 筛选性质（取样特性）的标准形式：冲激位于 t_{0} 处，把被积函数在该点的值\u201c筛\u201d出来，积分值 = f(t_{0})。乘积形式为 f(t)δ(t−t_{0}) = f(t_{0})δ(t−t_{0})，二者是一回事。" },
      { type: "blank", q: "计算 ∫_{−∞}^{+∞} (t² + 2t + 1)·δ(t − 1) dt = ？（填数值）", answers: ["4"],
        exp: "筛选性质：冲激在 t_{0} = 1 处取被积函数的值，g(t) = t² + 2t + 1，g(1) = 1 + 2 + 1 = 4。步骤就一步：定位冲激位置 → 代入该点函数值，不要去做积分运算。" },
      { type: "judge", q: "δ(at) = δ(t)/|a|（a ≠ 0）。", ans: true,
        exp: "正确。这是冲激函数的尺度特性：时间压缩 a 倍，强度变为 1/|a|。可用面积验证：δ(at) 面积 = ∫δ(at)dt = (1/|a|)∫δ(u)du = 1/|a|。偶函数性与该性质结合可得 δ(−2t + 2) = δ(t−1)/2 这类常用化简。" }
    ]},
    { sec: "1.4  信号的基本运算", items: [
      { type: "choice", q: "由 f(t) 得到 f(−2t + 4)，涉及的运算组合是", opts: ["平移、压缩、反转", "反转、展宽、平移", "压缩、平移", "微分、平移"], ans: 0,
        exp: "按\u201c先平移、再压缩、最后反转\u201d：f(t) 左移 4 → f(t+4)，横坐标压缩 2 倍 → f(2t+4)，再反转 → f(−2t+4)。a = −2 < 0 必含反转，|a| = 2 > 1 必含压缩（不是展宽）。" },
      { type: "blank", q: "f(t) 是宽度为 3 的矩形脉冲，则 f(2t + 2) 的宽度为 ？（填数值）", answers: ["1.5", "3/2"],
        exp: "尺度变换 a = 2：波形宽度变为原来的 1/|a| = 1/2，即 3 × 0.5 = 1.5。平移（+2）只改变位置不改变宽度。核心结论：f(at) 宽度变为 1/|a| 倍，高度不变。" },
      { type: "judge", q: "f(t − t_{0})（t_{0} > 0）表示将 f(t) 的波形向左平移。", ans: false,
        exp: "错误。括号内\u201c减 t_{0}\u201d对应自变量增大才能取到原波形，即波形整体右移（延迟）t_{0}。记法：f(t − t_{0}) 中取 t = t_{0} 才是原来的 t = 0 点，原点向右移动 → 右移。f(t + t_{0}) 才是左移（超前）。" }
    ]},
    { sec: "1.5  系统的性质与判断", items: [
      { type: "choice", q: "系统 y(t) = f(2t) 的性质是", opts: ["线性、时不变、因果", "线性、时变、非因果", "非线性、时不变、因果", "线性、时变、因果"], ans: 1,
        exp: "时间压缩破坏时不变：T[f(t−t_{0})] = f(2t−t_{0})，而 y(t−t_{0}) = f(2t−2t_{0})，两者不等 → 时变。t > 0 时 y(t) 用到 f(2t)（t 的两倍，即未来输入）→ 非因果。线性显然满足。" },
      { type: "blank", q: "系统 y(t) = 2f(t) + 1，当输入为 ε(t) 时，y(5) = ？（填数值）", answers: ["3"],
        exp: "ε(5) = 1（t > 0 时阶跃取 1），故 y(5) = 2×1 + 1 = 3。此系统是\u201c增量线性\u201d：零输入时输出为 1，不满足纯线性，但零状态部分线性。" },
      { type: "judge", q: "含初始状态的系统若满足分解性（全响应 = 零输入 + 零状态）且零状态响应满足线性，则称为增量线性系统。", ans: true,
        exp: "正确。判断含初始条件系统的口诀：先看能否分解为零输入 + 零状态（分解性），再看零状态部分是否满足齐次性与叠加性。两者都满足即为增量线性系统——教材中\u201c线性系统\u201d多指此含义。" }
    ]},
    { sec: "1.6  LTI 系统分析方法概述", items: [
      { type: "choice", q: "\u201c时域卷积\u201d在各变换域中对应", opts: ["相除", "相乘", "相加", "卷积"], ans: 1,
        exp: "卷积定理是全课程的脊柱：f₁ * f₂ ↔ F₁·F₂（傅里叶/拉普拉斯/z 变换均成立）。它把时域中难算的卷积变成变换域中简单的乘法，这就是\u201c把微分方程变代数方程、把卷积变乘积\u201d的变换域分析思想。" },
      { type: "blank", q: "两子系统级联，冲激响应分别为 h₁(t)、h₂(t)，则总冲激响应 h = ？（填运算名称，两个汉字）", answers: ["卷积"],
        exp: "级联系统总冲激响应等于各子系统冲激响应的卷积：h = h₁ * h₂；并联则为相加 h = h₁ + h₂。依据正是卷积的结合律与分配律，对应频域 H = H₁H₂ 与 H = H₁ + H₂。" },
      { type: "judge", q: "指数增长信号 e^{2t} 的频谱可用傅里叶变换直接求出。", ans: false,
        exp: "错误。傅里叶变换存在的充分条件是绝对可积，e^{2t} 发散不满足。需要引入衰减因子 e^{−σt}，即用拉普拉斯变换（σ > 2 时收敛）处理——这正是拉氏变换扩大适用范围的意义。" }
    ]}
  ];

  window.QUIZ_BANK.c8 = [
    { sec: "8.1  状态变量与状态方程", items: [
      { type: "choice", q: "n 阶线性时不变系统所需状态变量的最少数目为", opts: ["1 个", "n 个", "n + 1 个", "任意多个"], ans: 1,
        exp: "状态变量是能完全描述系统动态行为的最少变量组，n 阶系统恰需 n 个独立状态变量。少则信息不完备，多则不必要。注意选取不唯一（可作坐标变换），但个数固定为 n。" },
      { type: "blank", q: "描述一个三阶系统至少需要 ？ 个状态变量。（填整数）", answers: ["3"],
        exp: "阶数 = 状态变量个数 = 独立储能元件数（电路中即独立电容电压与电感电流总数，经化简后）。三阶系统需要 3 个，对应状态方程 x′ = Ax + Bf 中 A 为 3×3 矩阵。" },
      { type: "judge", q: "同一系统的状态变量选取是唯一的。", ans: false,
        exp: "错误。状态变量选取不唯一：直接形式、级联、并联模拟得到不同的 A、B、C、D；电路中也可选不同的变量组。它们通过线性变换（坐标变换）相互联系，且最少维数与输入输出关系（传递函数）不变。" }
    ]},
    { sec: "8.2  状态方程的建立", items: [
      { type: "choice", q: "由电路直接列写状态方程时，通常选状态变量为", opts: ["电阻电压与电容电流", "独立的电容电压与电感电流", "全部支路电流", "节点电位"], ans: 1,
        exp: "电容电压与电感电流直接反映系统储能，其一阶导数恰可用 KCL/KVL 表达（C·du_C/dt = i_C，L·di_L/dt = u_L），天然适合构造一阶微分方程组，故为标准选择。" },
      { type: "blank", q: "系统 y″ + 5y′ + 6y = f(t)，选 x₁ = y、x₂ = y′，则 x₁′ = ？（填 x₂ 或 y′）", answers: ["x₂", "y′", "x2"],
        exp: "由定义 x₁ = y，两边求导得 x₁′ = y′ = x₂。这是列写状态方程的第一步（每个状态变量的导数用状态与输入表示）；第二步由原方程得 x₂′ = y″ = −6x₁ − 5x₂ + f。" },
      { type: "judge", q: "由系统函数 H(s) 的直接形式（卡尔曼型）模拟框图列写状态方程时，通常取各积分器的输出作为状态变量。", ans: true,
        exp: "正确。n 阶 H(s) 的直接形式模拟含 n 个级联积分器，取积分器输出为 x₁…xₙ 后，积分器输入端即 xᵢ′，沿框图可直接读出状态方程，规则且不易出错。级联、并联形式同样取积分器输出，结果不同但等价。" }
    ]},
    { sec: "8.3  状态方程的求解", items: [
      { type: "choice", q: "状态转移矩阵 φ(t) 等于", opts: ["L^{−1}[(sI − A)^{−1}]", "(sI − A)^{−1}", "A 的转置", "e^{At} 的积分"], ans: 0,
        exp: "φ(t) = L^{−1}[(sI − A)^{−1}] = e^{At}。它刻画状态从初始值出发的自由演化，满足 φ(0) = I。时域解 x(t) = φ(t)x(0−) + φ(t)*Bf(t)，两项分别为零输入与零状态分量。" },
      { type: "blank", q: "系统 y″ + 5y′ + 6y = f 的状态矩阵 A 的特征根之一为 −2，另一个为 ？（填数值，含负号）", answers: ["-3", "−3", "- 3"],
        exp: "特征方程 |λI − A| = λ² + 5λ + 6 = (λ+2)(λ+3) = 0，特征根 −2 与 −3，与微分方程特征根完全一致——A 的特征值就是系统的特征根（H(s) 的极点），决定各状态分量的固有模式。" },
      { type: "judge", q: "矩阵 A 的特征值就是系统函数 H(s) 的极点，因此 A 的特征值全在左半平面仍是系统稳定的判据。", ans: true,
        exp: "正确。H(s) = C(sI − A)^{−1}B + D 的极点来自 |sI − A| = 0 的根（除非与零点对消）。特征值全在左半平面 ⇔ 各模式 e^{λt} 衰减 ⇔ 系统稳定，与传递函数判据一致。" }
    ]}
  ];
})();

<script>
