<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="信号与系统互动学习工具：详细知识点讲解、例题精析与动态图形实验（卷积、傅里叶、抽样、极点响应等）">
<title>信号与系统学习工具</title>
<style>
/* 信号与系统学习工具 —— 样式（与知识汇编文档同一深青色系） */
:root {
  --primary: #13293d;
  --accent: #1b6b7a;
  --accent-2: #2e8fa3;
  --surface: #edf3f5;
  --line: #c8dde2;
  --bg: #f4f7f9;
  --card: #ffffff;
  --text: #1c2733;
  --text-2: #5a6b78;
  --link: #1b6b7a;
  --ok: #1f8a4c;
  --warn: #b3541e;
  --danger: #b3261e;
  --sim-bg: #ffffff;
  --shadow: 0 2px 10px rgba(19, 41, 61, .08);
  --radius: 10px;
  --article-font: 16.5px;
}
body.dark {
  --bg: #0f1620;
  --card: #17222e;
  --surface: #1c2a37;
  --line: #2c4152;
  --text: #dce6ee;
  --text-2: #8ba0b0;
  --link: #58c0d6;
  --primary: #dce6ee;
  --sim-bg: #101a24;
  --shadow: 0 2px 10px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  font-size: var(--article-font);
  background: var(--bg);
  color: var(--text);
  transition: background .25s, color .25s;
}

/* ── 顶栏 ─────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 14px;
  background: var(--primary);
  color: #fff;
  box-shadow: var(--shadow);
}
body.dark .topbar { background: #101a26; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: #fff; white-space: nowrap; }
.brand-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, #1b6b7a, #37dcf2);
  color: #06232b; font-weight: 700; font-size: 18px; font-family: Georgia, serif;
}
.brand-text { font-size: 15.5px; font-weight: 600; letter-spacing: .5px; }
.search-box { position: relative; flex: 1; max-width: 430px; }
.search-box input {
  width: 100%; padding: 7px 12px;
  border: 0; border-radius: 18px; outline: none;
  background: rgba(255, 255, 255, .14); color: #fff; font-size: 13.5px;
}
.search-box input::placeholder { color: rgba(255, 255, 255, .55); }
.search-results {
  position: absolute; top: 40px; left: 0; right: 0;
  max-height: 55vh; overflow: auto;
  background: var(--card); color: var(--text);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 6px;
}
.search-results .sr-item {
  display: block; padding: 7px 10px; border-radius: 7px;
  cursor: pointer; font-size: 13.5px; line-height: 1.45;
}
.search-results .sr-item:hover { background: var(--surface); }
.search-results .sr-item .sr-ch { color: var(--accent); font-weight: 600; margin-right: 6px; }
.search-results .sr-item .sr-snippet { color: var(--text-2); }
.search-results .sr-empty { padding: 10px; color: var(--text-2); font-size: 13px; text-align: center; }
.topbar-actions { display: flex; gap: 6px; }
.icon-btn {
  border: 0; border-radius: 8px; cursor: pointer;
  background: rgba(255, 255, 255, .12); color: #fff;
  padding: 6px 11px; font-size: 13.5px; line-height: 1.2;
}
.icon-btn:hover { background: rgba(255, 255, 255, .24); }
.quiz-btn { background: rgba(55, 220, 242, .2); color: #bdf1fa; }
.quiz-btn:hover { background: rgba(55, 220, 242, .38); }

/* ── 布局 ─────────────────────────────── */
.layout { display: flex; min-height: calc(100vh - 46px); }
.sidebar {
  width: 262px; flex: 0 0 262px;
  background: var(--card); border-right: 1px solid var(--line);
  padding: 14px 12px 20px;
  position: sticky; top: 46px; height: calc(100vh - 46px);
  overflow-y: auto;
}
.side-meta { margin-bottom: 10px; }
.side-title { font-size: 12.5px; color: var(--text-2); letter-spacing: 1px; margin-bottom: 8px; }
.side-progress-text { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.side-progress-track { height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; }
#progressBar { height: 100%; width: 0; background: linear-gradient(90deg, #1b6b7a, #37dcf2); transition: width .4s; }
.nav-tree .nav-group { margin-bottom: 4px; }
.nav-tree .nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  color: var(--text); font-size: 13.8px; text-decoration: none;
}
.nav-tree .nav-item:hover { background: var(--surface); }
.nav-tree .nav-item.active { background: var(--accent); color: #fff; }
.nav-tree .nav-item .ni-no {
  flex: 0 0 22px; height: 22px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--accent); font-size: 11.5px; font-weight: 700;
}
.nav-tree .nav-item.active .ni-no { background: rgba(255, 255, 255, .22); color: #fff; }
.nav-tree .nav-item .ni-check { margin-left: auto; font-size: 12px; color: var(--ok); }
.nav-tree .nav-item.active .ni-check { color: #c9f2d9; }
.side-footer { margin-top: 16px; font-size: 11.5px; color: var(--text-2); text-align: center; }
.backdrop { display: none; }

.main { flex: 1; min-width: 0; padding: 26px 30px 60px; }
.article { max-width: 880px; margin: 0 auto; }

/* ── 正文排版 ─────────────────────────── */
.chapter-head { margin-bottom: 18px; }
.chapter-head .ch-label { font-size: 13px; letter-spacing: 2px; color: var(--accent); font-weight: 700; }
.chapter-head h1 { margin: 6px 0 0; font-size: 27px; color: var(--primary); letter-spacing: 1px; }
.article h3 {
  margin: 34px 0 12px; padding-bottom: 8px;
  font-size: 19.5px; color: var(--accent);
  border-bottom: 2px solid var(--line);
}
.article h3 .h3-no { color: var(--accent-2); margin-right: 6px; }
.article p { line-height: 1.95; margin: 10px 0; text-align: justify; }
.article p sup, .article p sub, .formula sup, .formula sub, .ex-box sup, .ex-box sub, .kp-box sup, .kp-box sub, .tbl-wrap sup, .tbl-wrap sub { font-size: .72em; }
.article strong { color: var(--primary); }
body.dark .article strong { color: #a8e6f2; }

.formula {
  margin: 14px auto; padding: 10px 18px;
  text-align: center; font-size: 1.12em;
  font-family: Cambria, "Times New Roman", "SimSun", serif;
  background: var(--surface); border-radius: var(--radius);
  overflow-x: auto; line-height: 1.7;
}
.kp-box {
  margin: 16px 0; padding: 11px 14px 11px 16px;
  background: var(--surface);
  border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0;
  line-height: 1.9; font-size: .98em;
}
.kp-box .kp-tag { font-weight: 700; color: var(--accent); margin-right: 6px; }

.tbl-wrap { margin: 16px 0; }
.tbl-cap { text-align: center; font-size: 13.5px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
.tbl-scroll { overflow-x: auto; }
.article table { width: 100%; border-collapse: collapse; font-size: .92em; }
.article th {
  background: var(--accent); color: #fff; font-weight: 600;
  padding: 7px 9px; border: 1px solid var(--accent);
}
.article td { padding: 6px 9px; border: 1px solid var(--line); line-height: 1.65; }
.article tr:nth-child(even) td { background: var(--surface); }

/* ── 例题 ─────────────────────────────── */
.ex-box {
  margin: 20px 0; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow); overflow: hidden;
}
.ex-title {
  padding: 9px 14px; font-weight: 700; color: var(--primary);
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.ex-title .ex-tag {
  display: inline-block; margin-right: 8px; padding: 1px 8px;
  background: var(--accent); color: #fff; border-radius: 6px; font-size: 12px;
}
.ex-problem { padding: 4px 14px; }
.ex-problem p { margin: 8px 0; }
.ex-toggle {
  margin: 4px 14px 12px; padding: 6px 16px;
  border: 1px solid var(--accent); background: transparent; color: var(--accent);
  border-radius: 18px; cursor: pointer; font-size: 13px;
}
.ex-toggle:hover { background: var(--surface); }
.ex-solution {
  display: none; padding: 2px 14px 12px;
  border-top: 1px dashed var(--line);
}
.ex-solution.open { display: block; }
.ex-solution .formula { background: var(--bg); }

/* ── 交互实验（sim 卡片）──────────────── */
.sim {
  margin: 22px 0; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow); overflow: hidden;
}
.sim-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: linear-gradient(135deg, #13293d, #1b4a5e);
  color: #fff;
}
.sim-head .sim-icon { font-size: 18px; }
.sim-head .sim-cap { font-weight: 600; font-size: 14.5px; letter-spacing: .5px; }
.sim-head .sim-live {
  margin-left: auto; font-size: 11.5px; color: #9fe8f5;
  border: 1px solid rgba(159, 232, 245, .5); padding: 1px 8px; border-radius: 10px;
}
.sim-note { padding: 8px 14px 0; font-size: 13px; color: var(--text-2); line-height: 1.7; }
.sim-body { padding: 10px 14px 14px; }
.sim-canvas-row { display: flex; flex-wrap: wrap; gap: 12px; }
.sim-canvas-box { flex: 1 1 320px; min-width: 280px; }
.sim-canvas-box .cv-title { font-size: 12.5px; color: var(--text-2); margin: 6px 0 4px; }
.sim canvas { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--sim-bg); touch-action: none; display: block; }
.sim-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 10px; align-items: center; }
.sim-controls label { font-size: 13px; color: var(--text-2); display: inline-flex; align-items: center; gap: 7px; }
.sim-controls input[type="range"] { width: 130px; accent-color: var(--accent); }
.sim-controls .val { min-width: 44px; font-family: Consolas, monospace; color: var(--accent); font-weight: 700; font-size: 13px; }
.sim-controls select, .sim-controls button {
  padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 13px; cursor: pointer;
}
.sim-controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.sim-controls button:hover { border-color: var(--accent); }
.sim-readout { margin-top: 8px; font-size: 13px; color: var(--text); line-height: 1.8; }
.sim-readout .rd { font-family: Cambria, "Times New Roman", serif; }
.sim-badge {
  display: inline-block; margin: 2px 6px 2px 0; padding: 1px 10px;
  border-radius: 11px; font-size: 12px; font-weight: 600;
}
.sim-badge.ok { background: rgba(31, 138, 76, .14); color: var(--ok); }
.sim-badge.bad { background: rgba(179, 38, 30, .13); color: var(--danger); }
.sim-badge.warn { background: rgba(179, 84, 30, .13); color: var(--warn); }

/* ── 章末导航 ─────────────────────────── */
.chapter-nav { max-width: 880px; margin: 34px auto 0; display: flex; gap: 12px; }
.chapter-nav a {
  flex: 1; padding: 11px 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--card);
  text-decoration: none; color: var(--text); font-size: 13.5px;
}
.chapter-nav a:hover { border-color: var(--accent); }
.chapter-nav .cn-next { text-align: right; }
.chapter-nav .cn-label { display: block; font-size: 11.5px; color: var(--text-2); margin-bottom: 2px; }

/* ── 自测（quiz）──────────────────────── */
.quiz-view {
  position: fixed; inset: 0; z-index: 90; overflow: auto;
  background: var(--bg); padding: 30px 16px;
}
.quiz-shell { max-width: 720px; margin: 0 auto; }
.quiz-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.quiz-head h2 { margin: 0; font-size: 21px; color: var(--primary); flex: 1; }
.quiz-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.quiz-q { font-size: 15.5px; line-height: 1.8; margin-bottom: 12px; }
.quiz-q .q-no { color: var(--accent); font-weight: 700; margin-right: 6px; }
.q-type {
  display: inline-block; margin-right: 8px; padding: 0 8px;
  border-radius: 9px; font-size: 11.5px; font-weight: 600; vertical-align: 1px;
}
.q-type-choice { background: rgba(27, 107, 122, .13); color: var(--accent); }
.q-type-blank { background: rgba(125, 58, 193, .12); color: #7d3ac1; }
.q-type-judge { background: rgba(179, 84, 30, .12); color: #b3541e; }
.quiz-sec-bar {
  margin: 16px 0 8px; padding: 7px 12px;
  background: var(--surface); border-left: 4px solid var(--accent);
  border-radius: 0 7px 7px 0; font-weight: 700; font-size: 14px; color: var(--primary);
}
.quiz-judge-row { display: flex; gap: 10px; }
.quiz-judge { flex: 0 0 130px; }
.quiz-blank-row { display: flex; gap: 10px; margin: 6px 0; }
.quiz-input {
  flex: 1; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  font-size: 14px; outline: none;
}
.quiz-input:focus { border-color: var(--accent); }
.quiz-submit {
  padding: 8px 18px; border-radius: 8px; border: 1px solid var(--accent);
  background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
}
.quiz-submit:disabled { cursor: default; }
.quiz-opt {
  display: block; width: 100%; text-align: left; margin: 7px 0;
  padding: 9px 13px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; line-height: 1.6;
}
.quiz-opt:hover { border-color: var(--accent); }
.quiz-opt.correct { border-color: var(--ok); background: rgba(31, 138, 76, .1); }
.quiz-opt.wrong { border-color: var(--danger); background: rgba(179, 38, 30, .09); }
.quiz-opt:disabled { cursor: default; }
.quiz-exp {
  margin-top: 10px; padding: 9px 13px; border-radius: 8px;
  background: var(--surface); font-size: 13.5px; line-height: 1.8; display: none;
}
.quiz-exp.show { display: block; }
.quiz-score { font-size: 15px; font-weight: 700; color: var(--accent); padding: 12px 0; }

/* ── 响应式 ───────────────────────────── */
@media (max-width: 920px) {
  .sidebar {
    position: fixed; z-index: 80; left: 0; top: 46px;
    transform: translateX(-105%); transition: transform .25s;
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .backdrop.show { display: block; position: fixed; inset: 0; top: 46px; background: rgba(0,0,0,.35); z-index: 70; }
  .main { padding: 18px 14px 50px; }
  .search-box { max-width: none; }
  .brand-text { display: none; }
}

</style>
</head>

<script>
/* ── content1.js ── */
/* 内容数据 第 1 部分：前言 + 第 1 章 + 第 8 章 + 附录
   块类型：p 段落 / h3 小节 / f 公式 / kp 要点 / tbl 表格 / ex 例题 / sim 交互实验 / quiz 自测占位
   标记：**加粗**，^{上标}，_{下标} */
(function () {
  "use strict";
  window.DOC_CONTENT = window.DOC_CONTENT || {};
  window.DOC_CONTENT.chapters = window.DOC_CONTENT.chapters || [];

  window.DOC_CONTENT.chapters.push(
  /* ═══════════ 前言 ═══════════ */
  {
    id: "pre", label: "前言 · 使用指南", blocks: [
      { t: "p", x: "本工具系统整理了高等学校《信号与系统》课程的核心内容，体系与国内主流教材（吴大正《信号与线性系统分析》、郑君里《信号与系统》等）一致，共分八章：信号与系统概述、连续/离散时间系统的时域分析、频域分析（傅里叶变换）及其应用、复频域分析（拉普拉斯变换）、z 域分析与状态变量分析。" },
      { t: "p", x: "与普通复习资料不同，本工具内置 **12 个可交互的动态图形实验**：可以亲手拖动滑块完成信号的平移反转与尺度变换、观察矩形脉冲如何演变为冲激信号、动态演示卷积的翻转—平移—相乘—积分全过程、谐波逐个叠加合成方波（吉布斯现象）、调节抽样频率亲眼看到混叠的发生、点击 s/z 平面任意位置观察极点与系统响应的实时联动。**看懂动态过程，公式才真正属于你。**" },
      { t: "h3", x: "符号约定" },
      { t: "p", x: "f(t) 表示连续时间信号，f(k) 表示离散序列；ε(t)、ε(k) 为单位阶跃信号与序列（部分教材记作 u(t)、u(k)）；δ(t)、δ(k) 为单位冲激信号与单位序列；h(t)、h(k) 为冲激响应（单位序列响应）；\u201c*\u201d表示卷积；\u201c↔\u201d表示变换对；s = σ + jω 为复频率；j 为虚数单位；0−、0+ 分别表示 t = 0 的左、右极限。" },
      { t: "h3", x: "使用建议" },
      { t: "p", x: "（1）按章节顺序学习，每章先读概念讲解，再操作配套实验，最后做例题与自测；（2）例题默认隐藏解析，先自己动笔再点开对照；（3）右上角可切换明暗主题、调节字号，学习进度自动保存在本机；（4）每章末尾有\u201c本章自测\u201d，答错时认真阅读解析。" },
      { t: "kp", x: "全书主线：时域分析（卷积）→ 频域分析（傅里叶变换）→ 复频域分析（拉普拉斯变换）→ z 域分析 → 状态空间分析。四种变换域方法的共同思想：把时域中难解的卷积与微分方程，转化为变换域中的代数运算，解出后再变换回来。" }

      { t: "f", x: "y(t) = y_{h}(t) + y_{p}(t)" },
      { t: "p", x: "特解的设法：特解取与激励形式相似的函数，代入原方程后用待定系数法确定其中的常数。特别注意：若激励中的指数项恰好与某个特征根对应（例如激励为 e^{αt} 而 α 正是特征根），齐次解中已含同类项，须将特解乘以 t（α 为 r 重根时乘以 t^{r}）后再试探。常见激励对应的特解形式见表 2-2。" },
      { t: "tbl", cap: "表2-2  常见激励及其对应的特解形式", head: ["激励 f(t)", "特解 y_{p}(t) 的形式"], rows: [
        ["常数 K", "P（常数）"],
        ["t^{m}", "P_{m}t^{m} + P_{m−1}t^{m−1} + … + P_{1}t + P_{0}"],
        ["e^{αt}（α 不是特征根）", "P e^{αt}"],
        ["e^{αt}（α 为单特征根）", "P t e^{αt}"],
        ["e^{αt}（α 为 r 重特征根）", "P t^{r} e^{αt}"],
        ["cos ωt 或 sin ωt", "P_{1}cos ωt + P_{2}sin ωt"]
      ], widths: [46, 54] },
      { t: "p", x: "确定齐次解中的待定常数要用初始条件，这里必须区分“两个 0”：0_{−} 是激励接入前一瞬间的**初始状态**，反映系统历史储能，与本次激励无关；0_{+} 是激励接入后一瞬间的**初始条件**。经典法求全解用的是 0_{+} 条件，而题设通常给出 0_{−} 状态，因此必须判断 0_{−} 到 0_{+} 是否发生跳变。" },
      { t: "p", x: "**δ 函数匹配（冲激函数平衡）思想**：把 y(t) 及其各阶导数中可能出现的 δ(t)、δ′(t) 等奇异项代入方程左端，与右端的奇异项逐项配平。若方程右端不含 δ 及其导数，则响应各阶导数在 t = 0 连续，0_{+} 值与 0_{−} 值相等，不跳变；若右端含 δ 或其导数，则 y(t) 的低阶导数将发生跳变。" },
      { t: "p", x: "举例：设 y″(t) + 2y′(t) + y(t) = f′(t)，f(t) = δ(t)。右端含 δ′(t)，为使其平衡，y″(t) 中须含系数为 1 的 δ′(t)，从而 y′(t) 中含 δ(t)、y(t) 中含 ε(t)。设 y″(t) 中 δ(t) 的系数为 c，由 δ 项平衡 c + 2 = 0 得 c = −2。于是 y′(t) 中 δ(t) 的强度为 1，即 y(0_{+}) − y(0_{−}) = 1；y″(t) 中 δ(t) 的强度为 −2，即 y′(0_{+}) − y′(0_{−}) = −2。反之，若 f(t) = ε(t) 且方程右端只有 f(t) 本身，右端不含 δ，响应各阶导数连续，初始状态不发生跳变。" },
      { t: "h3", x: "2.3  零输入响应与零状态响应" },
      { t: "p", x: "LTI 系统的全响应按**成因**可分解为两部分：仅由初始状态（储能）引起的**零输入响应** y_{zi}(t)（此时激励为零）；仅由激励引起的**零状态响应** y_{zs}(t)（此时初始状态为零）。由系统的线性性质：" },
      { t: "f", x: "y(t) = y_{zi}(t) + y_{zs}(t)" },
      { t: "p", x: "**零输入响应的求法**：令 f(t) = 0，方程成为齐次方程，y_{zi}(t) 取齐次解形式（表 2-1），待定常数由 0_{−} 初始状态确定——由于没有激励，状态不发生跳变，0_{+} 值与 0_{−} 值相同。完整数值过程见例 2-1。" },
      { t: "f", x: "y_{zi}(t) = C_{1}e^{λ_{1}t} + C_{2}e^{λ_{2}t} + … + C_{n}e^{λ_{n}t}（单特征根情形）" },
      { t: "p", x: "**零状态响应的求法**：令初始状态全为零，先分别求出方程的齐次解与特解，再由零状态条件（各 0_{−} 值为零）确定常数。可见零状态响应一般**既含齐次解分量，又含特解分量**。更系统、更简便的方法是 2.4—2.6 节的冲激响应—卷积法。" },
      { t: "p", x: "与“自由响应 + 强迫响应”分解的关系：齐次解又称为**自由响应**（模式由特征根决定），特解称为**强迫响应**（模式由激励决定）。两种分解的对应关系为：自由响应 = 零输入响应 + 零状态响应中的齐次分量；强迫响应 = 零状态响应中的特解分量。" },
      { t: "kp", x: "零输入响应与零状态响应按响应的成因分解，自由响应与强迫响应按响应的模式分解，二者不能混淆：零输入响应必然全部是自由分量，但自由响应并不等于零输入响应——零状态响应中也含有自由分量；零输入响应只由初始状态决定，零状态响应只由激励决定。全响应可同时作两种分解，这正是 LTI 系统线性特征的体现。" },
      { t: "ex", title: "例2-1  求零输入响应", problem: [
        { t: "p", x: "已知二阶 LTI 连续系统 y″(t) + 3y′(t) + 2y(t) = f(t)，初始状态 y(0_{−}) = 1，y′(0_{−}) = 2。求零输入响应 y_{zi}(t)。" }
      ], solution: [
        { t: "p", x: "解：零输入响应是激励置零后仅由初始状态引起的响应，满足齐次方程 y″ + 3y′ + 2y = 0，解为齐次解形式；由于无激励，状态不跳变，待定常数直接用 0_{−} 初始状态确定。" },
        { t: "f", x: "特征方程：p^{2} + 3p + 2 = 0，即 (p + 1)(p + 2) = 0" },
        { t: "p", x: "两个单实根 λ_{1} = −1、λ_{2} = −2，故设 y_{zi}(t) = C_{1}e^{−t} + C_{2}e^{−2t}（t ≥ 0）。" },
        { t: "p", x: "代入初始条件：t = 0 时 C_{1} + C_{2} = 1；求导得 y_{zi}′(t) = −C_{1}e^{−t} − 2C_{2}e^{−2t}，t = 0 时 −C_{1} − 2C_{2} = 2，即 C_{1} + 2C_{2} = −2。" },
        { t: "p", x: "两式相减得 C_{2} = −3；代回第一式得 C_{1} = 1 − C_{2} = 4。" },
        { t: "f", x: "y_{zi}(t) = (4e^{−t} − 3e^{−2t})ε(t)" },
        { t: "p", x: "检验：y_{zi}(0) = 4 − 3 = 1，与 y(0_{−}) = 1 一致；y_{zi}′(0) = −4 + 6 = 2，与 y′(0_{−}) = 2 一致，结果正确。" }
      ] },
      { t: "h3", x: "2.4  冲激响应与阶跃响应" },
      { t: "p", x: "**冲激响应** h(t)：系统初始状态为零时，仅由单位冲激函数 δ(t) 激励产生的响应。h(t) 是 LTI 系统的“时域身份证”：一旦知道 h(t)，任意激励下的零状态响应都可由卷积求出（见 2.6 节）。" },
      { t: "f", x: "h(t) = y_{zs}(t)|_{f(t) = δ(t)}" },
      { t: "p", x: "**阶跃响应** g(t)：初始状态为零时，仅由单位阶跃函数 ε(t) 激励产生的响应。由于 δ(t) 是 ε(t) 的导数，利用 LTI 系统的微积分特性，两者通过求导、积分互相联系，知道其一即可得另一个：" },
      { t: "f", x: "h(t) = dg(t)/dt，　g(t) = ∫_{−∞}^{t} h(τ)dτ" },
      { t: "p", x: "**由传输算子 H(p) 求 h(t)**：将 H(p) 展开为部分分式，逐项查表 2-3 即可写出 h(t)。若 m ≥ n（H(p) 为假分式），先用长除法分离出常数项（对应 δ(t)）或 p 的正幂项（对应 δ(t) 的导数），再对余下的真分式作部分分式展开。" },
      { t: "tbl", cap: "表2-3  常用 H(p) 部分分式与 h(t) 的对应关系", head: ["传输算子 H(p)", "冲激响应 h(t)"], rows: [
        ["K/(p − a)", "K e^{at}ε(t)"],
        ["K/(p − a)^{2}", "K t e^{at}ε(t)"],
        ["K/(p − a)^{r}", "K t^{r−1}/(r − 1)! · e^{at}ε(t)"],
        ["K p/(p − a)", "K δ(t) + K a e^{at}ε(t)"],
        ["K p/(p^{2} + ω_{0}^{2})", "K cos ω_{0}t · ε(t)"],
        ["K ω_{0}/(p^{2} + ω_{0}^{2})", "K sin ω_{0}t · ε(t)"]
      ], widths: [40, 60] },
      { t: "p", x: "说明：分母 p^{2} + ω_{0}^{2} 对应一对纯虚根 ±jω_{0}；一般共轭复根 α ± jβ 的二次因子 (p − α)^{2} + β^{2} 可化为表 2-3 后两行的形式，展开合并后即得 e^{αt}(A cos βt + B sin βt)ε(t) 型的衰减（或增长）振荡响应。" },
      { t: "h3", x: "2.5  卷积积分" },
      { t: "p", x: "把激励 f(t) 分解为一系列不同强度、不同时刻的冲激：f(t) = ∫_{−∞}^{+∞} f(τ)δ(t − τ)dτ，每个冲激 f(τ)dτ × δ(t − τ) 的零状态响应为 f(τ)dτ × h(t − τ)，全部叠加（积分）即得零状态响应——这就是**卷积积分**：" },
      { t: "f", x: "y_{zs}(t) = f(t) * h(t) = ∫_{−∞}^{+∞} f(τ)h(t − τ)dτ" },
      { t: "p", x: "**图解法四步**：① 换元——把两信号的自变量换为 τ，得 f(τ)、h(τ)；② 翻转——将 h(τ) 关于纵轴翻转得 h(−τ)；③ 平移——将 h(−τ) 沿 τ 轴平移 t 得 h(t − τ)，t > 0 时右移、t < 0 时左移；④ 相乘积分——对给定的 t，求乘积 f(τ)h(t − τ) 曲线下的面积，即为该时刻的卷积值。" },
      { t: "p", x: "随着 t 从 −∞ 逐渐增大，h(t − τ) 像一个滑动窗口扫过 f(τ)：两波形从分离到交叠再到分离，卷积结果随之从零上升、达到峰值、再回落到零。分段积分的区间端点由两波形非零区间的交叠边界确定——这是用图解法写分段表达式的关键（见例 2-2）。" },
      { t: "kp", x: "图解法四步口诀：换元、翻转、平移、相乘积分。由交换律，翻转哪个信号都可以，通常翻转并平移较简单的一个；积分变量是 τ，t 只是参数，每一个 t 值对应一次积分；分段端点由两个波形非零区间的交叠情况决定，分段后逐段积分，并检查各段端点处结果是否衔接。" },
      { t: "f", x: "交换律：f * h = h * f；　分配律：f * (h_{1} + h_{2}) = f * h_{1} + f * h_{2}；　结合律：(f * h_{1}) * h_{2} = f * (h_{1} * h_{2})" },
      { t: "p", x: "**与奇异函数的卷积**是最常用的化简手段：δ(t) 是卷积运算的单位元，与谁卷积都不改变原信号；与 δ′(t) 卷积相当于求一次导数；与 ε(t) 卷积相当于从 −∞ 到 t 的积分（累积）；与延时的冲激卷积即把信号整体延时：" },
      { t: "f", x: "f(t) * δ(t) = f(t)，　f(t) * δ(t − t_{0}) = f(t − t_{0})，　f(t) * δ′(t) = f′(t)，　f(t) * ε(t) = ∫_{−∞}^{t} f(τ)dτ" },
      { t: "p", x: "**微分、积分与时移性质**：卷积的导数可先对其中任一因子求导；两个因子一个求导、一个积分后再卷积，结果不变（一微一积、卷积不变）；两信号分别延时 t_{1}、t_{2} 后再卷积，结果整体延时 t_{1} + t_{2}：" },
      { t: "f", x: "(f * h)′ = f′ * h = f * h′，　(f * h)^{(−1)} = f^{(−1)} * h = f * h^{(−1)}，　f(t − t_{1}) * h(t − t_{2}) = y_{zs}(t − t_{1} − t_{2})" },
      { t: "tbl", cap: "表2-4  卷积的运算性质总表", head: ["性质", "表达式"], rows: [
        ["交换律", "f * h = h * f"],
        ["分配律", "f * (h_{1} + h_{2}) = f * h_{1} + f * h_{2}"],
        ["结合律", "(f * h_{1}) * h_{2} = f * (h_{1} * h_{2})"],
        ["卷积单位元", "f(t) * δ(t) = f(t)"],
        ["延时性质", "f(t) * δ(t − t_{0}) = f(t − t_{0})"],
        ["微分性质", "f(t) * δ′(t) = f′(t)；(f * h)′ = f′ * h = f * h′"],
        ["积分性质", "f(t) * ε(t) = ∫_{−∞}^{t} f(τ)dτ；(f * h)^{(−1)} = f^{(−1)} * h"],
        ["时移性质", "f(t − t_{1}) * h(t − t_{2}) = y_{zs}(t − t_{1} − t_{2})"]
      ], widths: [24, 76] },
      { t: "tbl", cap: "表2-5  常用卷积公式（a ≠ b，a、b > 0）", head: ["卷积式", "结果"], rows: [
        ["ε(t) * ε(t)", "t ε(t)"],
        ["e^{−at}ε(t) * ε(t)", "(1 − e^{−at})/a · ε(t)"],
        ["e^{−at}ε(t) * e^{−bt}ε(t)", "(e^{−at} − e^{−bt})/(b − a) · ε(t)"],
        ["e^{−at}ε(t) * e^{−at}ε(t)", "t e^{−at} ε(t)"],
        ["t e^{−at}ε(t) * e^{−at}ε(t)", "(t^{2}/2) e^{−at} ε(t)"],
        ["f(t) * δ_{T}(t)", "Σ_{k = −∞}^{+∞} f(t − kT)，即以 T 为周期的延拓"]
      ], widths: [42, 58] },
      { t: "ex", title: "例2-2  矩形脉冲卷积矩形脉冲（图解法）", problem: [
        { t: "p", x: "已知 f(t) = ε(t) − ε(t − 2)，h(t) = ε(t) − ε(t − 2)，用图解法求 y(t) = f(t) * h(t)，写出分段表达式并指出波形形状。" }
      ], solution: [
        { t: "p", x: "解：f(τ) 与 h(τ) 都是高度 1、宽度 2、起点在 τ = 0 的矩形脉冲。把 h(τ) 翻转再平移 t，得 h(t − τ)，其非零区间为 [t − 2, t]。按它与 f(τ) 的非零区间 [0, 2] 的交叠情况分四段讨论。" },
        { t: "p", x: "① t < 0：窗口 [t − 2, t] 完全在 [0, 2] 左侧，无交叠，y(t) = 0；" },
        { t: "p", x: "② 0 ≤ t ≤ 2：交叠区间 [0, t]，长度 t，区间内乘积恒为 1，y(t) = ∫_{0}^{t} 1 dτ = t；" },
        { t: "p", x: "③ 2 < t ≤ 4：交叠区间 [t − 2, 2]，长度 4 − t，y(t) = ∫_{t−2}^{2} 1 dτ = 4 − t；" },
        { t: "p", x: "④ t > 4：窗口滑过 [0, 2]，无交叠，y(t) = 0。" },
        { t: "f", x: "y(t) = 0（t < 0）；　t（0 ≤ t ≤ 2）；　4 − t（2 < t ≤ 4）；　0（t > 4）" },
        { t: "p", x: "结果为底宽 4、峰值 2 的等腰三角形，峰值出现在 t = 2（两脉冲完全重合）处。用表 2-5 验证：y(t) = (ε(t) − ε(t − 2)) * (ε(t) − ε(t − 2)) = tε(t) − 2(t − 2)ε(t − 2) + (t − 4)ε(t − 4)，分段展开后与上述结果完全一致。" }
      ] },
      { t: "sim", id: "conv-demo", cap: "图2-1  卷积积分动态演示", note: "选择两个信号，播放或拖动时间滑块，观察翻转—平移—相乘—积分的全过程：注意乘积曲线下的面积（阴影区）如何随平移量 t 变化，并与例 2-2 的三角形结果对照。" },
      { t: "h3", x: "2.6  用卷积法求零状态响应" },
      { t: "p", x: "卷积法把“解微分方程”简化为“一次卷积运算”，是求零状态响应的主导方法：只要求出系统的冲激响应 h(t)（由 H(p) 部分分式查表即得），再与激励 f(t) 作卷积，即得 y_{zs}(t)；需要全响应时，补上用 0_{−} 状态求出的零输入响应即可。" },
      { t: "kp", x: "卷积法求零状态响应的步骤：① 由微分方程写出传输算子 H(p) = N(p)/D(p)；② 将 H(p) 部分分式展开（假分式先长除），查表 2-3 写出 h(t)；③ 计算 y_{zs}(t) = f(t) * h(t)，优先使用表 2-5 公式与奇异函数性质化简，必要时用图解法分段积分；④ 需要全响应时，再求 y_{zi}(t) 并相加。复合系统：级联 h = h_{1} * h_{2}，并联 h = h_{1} + h_{2}。" },
      { t: "p", x: "级联与并联系统：由结合律，两个子系统级联时总冲激响应等于两个冲激响应的卷积；由分配律，并联时总冲激响应等于两者之和。这与第 4 章频域分析中系统函数相乘、相加的规律一一对应。" },
      { t: "f", x: "级联：h(t) = h_{1}(t) * h_{2}(t)；　并联：h(t) = h_{1}(t) + h_{2}(t)" },
      { t: "ex", title: "例2-3  利用性质计算卷积", problem: [
        { t: "p", x: "利用卷积性质计算：(1) (e^{−2t}ε(t)) * ε(t)；(2) (e^{−2t}ε(t)) * δ′(t)。" }
      ], solution: [
        { t: "p", x: "解：(1) 套用表 2-5 第二行 e^{−at}ε(t) * ε(t) = (1 − e^{−at})/a · ε(t)，取 a = 2：" },
        { t: "f", x: "(e^{−2t}ε(t)) * ε(t) = (1 − e^{−2t})/2 · ε(t) = (1/2)(1 − e^{−2t})ε(t)" },
        { t: "p", x: "直接积分验证：t ≥ 0 时 ∫_{0}^{t} e^{−2τ} × 1 dτ = (1 − e^{−2t})/2，与公式结果一致。" },
        { t: "p", x: "(2) 由性质 f(t) * δ′(t) = f′(t)，问题化为对 f(t) = e^{−2t}ε(t) 求导。注意 f 在 t = 0 处从 0 跳到 1，求导会产生冲激项：f′(t) = −2e^{−2t}ε(t) + δ(t)。" },
        { t: "f", x: "(e^{−2t}ε(t)) * δ′(t) = f′(t) = δ(t) − 2e^{−2t}ε(t)" },
        { t: "p", x: "提示：对含 ε(t) 的信号求导时，跳变处的冲激项最容易漏掉；漏掉后自检会发现 (f * δ)′ = f′ 即 f * δ′ = f′ 不再成立，可用此式检验结果。" }
      ] },

  /* ═══════════ 第 3 章 离散时间系统的时域分析 ═══════════ */
  {
    id: "c3", label: "第3章 离散时间系统的时域分析", blocks: [
      { t: "p", x: "本章讨论离散时间系统的时域分析，体系与连续系统完全平行：微分方程对应差分方程，微分算子 p 对应移序算子 E，冲激响应对应单位序列响应，卷积积分对应卷积和。主线是：建立差分方程与算子表示（3.1）；经典解法（3.2）；零输入/零状态分解（3.3）；单位序列响应与阶跃响应（3.4）；卷积和及其计算方法（3.5），特别是极为实用的**对位相乘求和法**。学习时应随时与第 2 章对照，体会“积分变求和、微分变差分”的类比与差别。" },
      { t: "h3", x: "3.1  差分方程与移序算子" },
      { t: "p", x: "处理离散时间信号的系统（数字滤波器、计算机递推算法、按期计息的账户等）用**差分方程**描述：输入输出都是序列，方程把不同序号的样本值联系起来。n 阶后向差分方程的一般形式为（a_{0} ≠ 0）：" },
      { t: "f", x: "a_{n}y(k − n) + a_{n−1}y(k − n + 1) + … + a_{1}y(k − 1) + a_{0}y(k) = b_{m}f(k − m) + b_{m−1}f(k − m + 1) + … + b_{1}f(k − 1) + b_{0}f(k)" },
      { t: "p", x: "后向形式与把各项序号统一前移 n 位的前向形式完全等价，二者可以互相转换；下面对前向形式讨论，并把最高阶项系数归一化为 1。" },
      { t: "p", x: "引入**移序（超前）算子 E**：E y(k) = y(k + 1)，E^{−1}y(k) = y(k − 1)，E^{n} 表示移序 n 次。算子多项式同样可以展开、因式分解，像代数式一样运算。前向差分方程的算子方程为：" },
      { t: "f", x: "(E^{n} + a_{n−1}E^{n−1} + … + a_{1}E + a_{0})y(k) = (b_{m}E^{m} + b_{m−1}E^{m−1} + … + b_{1}E + b_{0})f(k)" },
      { t: "p", x: "与连续系统类似，定义**传输算子** H(E) = N(E)/D(E)，则 y(k) = H(E)f(k)。H(E) 是离散系统时域描述的核心，求单位序列响应时直接对它作部分分式分解。" },
      { t: "f", x: "H(E) = N(E)/D(E) = (b_{m}E^{m} + … + b_{1}E + b_{0})/(E^{n} + a_{n−1}E^{n−1} + … + a_{1}E + a_{0})" },
      { t: "p", x: "令分母多项式为零得**特征方程** D(E) = 0，其根 γ_{1}、γ_{2}、…、γ_{n} 称为特征根。特征根决定自由响应的模式：|γ| < 1 对应衰减序列，|γ| > 1 对应增长序列，|γ| = 1 对应等幅振荡或恒定——这也是判断离散系统稳定性的依据（所有特征根的模均小于 1）。" },
      { t: "f", x: "D(E) = E^{n} + a_{n−1}E^{n−1} + … + a_{1}E + a_{0} = 0" },
      { t: "h3", x: "3.2  差分方程的经典解法" },
      { t: "p", x: "与连续系统完全平行，差分方程的全解 = **齐次解** + **特解**：齐次解由特征根按表 3-1 组合，特解由激励形式按表 3-2 试探确定，全解中的待定常数由初始条件确定。" },
      { t: "f", x: "y(k) = y_{h}(k) + y_{p}(k)" },
      { t: "p", x: "齐次解：把 y_{h}(k) = Cγ^{k} 代入齐次方程，得特征方程 D(γ) = 0；特征根的类型不同，齐次解的组合形式不同。注意共轭复根情形把振荡幅度 ρ^{k} 与振荡角频率 β 分开，波形为变幅振荡。" },
      { t: "f", x: "y_{h}(k) = C_{1}γ_{1}^{k} + C_{2}γ_{2}^{k} + … + C_{n}γ_{n}^{k}（单实根情形）" },
      { t: "tbl", cap: "表3-1  特征根与齐次解形式", head: ["特征根情况", "齐次解形式"], rows: [

      { t: "p", x: "**迭代法（递推法）**：把差分方程整理成关于最高序号项的递推式 y(k + n) = −a_{n−1}y(k + n − 1) − … − a_{1}y(k + 1) − a_{0}y(k) + b_{m}f(k + m) + … + b_{0}f(k)，从初始值出发逐点递推即可求得任意时刻的响应值。迭代法思想简单、最适合计算机执行，对非线性或时变系统同样适用；缺点是一般得不到闭式解，理论解析分析仍靠经典法与后续的变换域方法。" },
      { t: "p", x: "初始条件的两种给法：若直接给出 y(0)、y(1)、…（0_{+} 型初始条件），可代入全解定常数；若给出 y(−1)、y(−2)、…（激励接入前的 0_{−} 型初始状态），求零输入响应时可直接使用（见例 3-1），求全解则须先用迭代法由 0_{−} 状态推出 y(0)、y(1)。注意：离散系统没有 δ 函数匹配问题，初始状态到初始条件的转换靠递推完成。" },
      { t: "kp", x: "经典法流程五步：① 写出特征方程求特征根；② 按表 3-1 组成齐次解；③ 按表 3-2 设特解并代入方程定系数；④ 全解 = 齐次解 + 特解，由初始条件定齐次解常数；⑤ 把解代回方程、检查初值验算。若给的是 0_{−} 型初始状态而求全解，应先用递推推出 0_{+} 型初始条件。" },
      { t: "h3", x: "3.3  零输入响应与零状态响应" },
      { t: "p", x: "离散系统的全响应同样按成因分解为仅由初始状态引起的**零输入响应** y_{zi}(k) 与仅由激励引起的**零状态响应** y_{zs}(k)：" },
      { t: "f", x: "y(k) = y_{zi}(k) + y_{zs}(k)" },
      { t: "p", x: "**零输入响应**：令激励为零，方程成为齐次方程，y_{zi}(k) 为齐次解形式，待定常数由初始状态 y(−1)、y(−2)、… 确定——注意要把 k = −1、−2 直接代入表达式联立求解（见例 3-1）。" },
      { t: "f", x: "y_{zi}(k) = C_{1}γ_{1}^{k} + C_{2}γ_{2}^{k} + … + C_{n}γ_{n}^{k}（单实根情形）" },
      { t: "p", x: "**零状态响应**：令初始状态全为零（y(−1) = y(−2) = … = 0），由 k ≥ 0 作用的激励产生；可用经典法（齐次解 + 特解，由零状态条件定常数），更常用单位序列响应加卷积和（3.4—3.5 节）。零状态响应同样既含自由分量又含强迫分量。" },
      { t: "p", x: "与自由/强迫响应的关系和连续系统相同：齐次解为自由响应，特解为强迫响应；自由响应 = 零输入响应 + 零状态响应中的自由分量。这种分解把系统初始储能的作用与外加激励的作用分开，是讨论因果性、稳定性等系统性质的基础。" },
      { t: "p", x: "从物理上看，零输入响应反映系统“记忆”的初始储能如何按固有模式（特征根）演化；零状态响应反映系统对外部输入的整套行为。数字系统中初始状态对应存储单元（寄存器、延迟单元）的初值，这一分解在软硬件实现中都有明确的操作对应。" },
      { t: "ex", title: "例3-1  求零输入响应", problem: [
        { t: "p", x: "已知离散系统 y(k + 2) − 5y(k + 1) + 6y(k) = f(k)，初始状态 y(−1) = 1，y(−2) = 0。求零输入响应 y_{zi}(k)。" }

        { t: "f", x: "特征方程：γ^{2} − 5γ + 6 = 0，即 (γ − 2)(γ − 3) = 0" },
        { t: "p", x: "两个单实根 γ_{1} = 2、γ_{2} = 3，设 y_{zi}(k) = C_{1}2^{k} + C_{2}3^{k}。" },
        { t: "p", x: "把 k = −1、k = −2 代入联立方程：y(−1)：C_{1}/2 + C_{2}/3 = 1；y(−2)：C_{1}/4 + C_{2}/9 = 0。" },
        { t: "p", x: "第一式乘 6 得 3C_{1} + 2C_{2} = 6；第二式乘 36 得 9C_{1} + 4C_{2} = 0。第一式乘 2 减第二式：(6C_{1} + 4C_{2}) − (9C_{1} + 4C_{2}) = 12，得 −3C_{1} = 12，即 C_{1} = −4；代回 3 × (−4) + 2C_{2} = 6 得 C_{2} = 9。" },

      { t: "p", x: "**单位序列响应** h(k)：初始状态为零时，激励为单位序列 δ(k) 产生的响应。δ(k) 仅在 k = 0 处取值 1，因此 h(k) 完整刻画了离散 LTI 系统的时域特性，任意激励的零状态响应都由 y_{zs}(k) = f(k) * h(k) 得到。" },
      { t: "f", x: "h(k) = y_{zs}(k)|_{f(k) = δ(k)}" },
      { t: "p", x: "**由 H(E) 求 h(k)**：把 H(E) 化成表 3-3 中的标准部分分式再查表。常用两种套路：直接按 K/(E − a) 型展开（结果从 k = 1 起始，带 ε(k − 1)）；或考察 H(E)/E 展开后再乘回 E（得到 K E/(E − a) 型，结果为 a^{k}ε(k)，从 k = 0 起始）。两种做法结果一致，选择使计算简便的一种。" },
      { t: "p", x: "简单例子：一阶系统 y(k) − 0.5y(k − 1) = f(k)，写成 H(E) = E/(E − 0.5)，查表 3-3 第二行（K = 1、a = 0.5）立即得 h(k) = 0.5^{k}ε(k)。" },
      { t: "tbl", cap: "表3-3  常用 H(E) 部分分式与 h(k) 的对应关系", head: ["H(E)", "h(k)"], rows: [

        ["K E/(E − a)^{3}", "K · k(k − 1)/2 · a^{k−2}ε(k)"]
      ], widths: [40, 60] },
      { t: "p", x: "若 H(E) 的分子分母有公因子可先约去（零极点相消，见例 3-3）；若 H(E) 为假分式（分子次数不低于分母），先作长除，商中的常数项对应 K δ(k)，E 的一次项对应 δ(k + 1)；对因果系统通常直接处理真分式部分。" },
      { t: "p", x: "**阶跃响应** g(k)：初始状态为零时，激励为 ε(k) 的响应。由 δ(k) = ε(k) − ε(k − 1)（一阶后向差分）与 LTI 性质，二者通过差分、累加互相换算：" },
      { t: "f", x: "g(k) = y_{zs}(k)|_{f(k) = ε(k)}" },
      { t: "f", x: "h(k) = g(k) − g(k − 1)，　g(k) = Σ_{i = −∞}^{k} h(i)（因果系统：g(k) = Σ_{i = 0}^{k} h(i)）" },
      { t: "kp", x: "求 h(k) 的注意事项：① 先把 H(E) 化成部分分式再查表 3-3，注意区分 K/(E − a) 与 K E/(E − a) 两种形式（起始序号相差 1）；② 结果必须带 ε(k − 1) 或 ε(k) 标明起始点；③ 用迭代法算出前几项 h(0)、h(1)、h(2) 对照验证最稳妥；④ g(k) 与 h(k) 可用差分/累加互相换算，先求易求者。" },
      { t: "h3", x: "3.5  卷积和" },
      { t: "p", x: "把任意激励序列分解为不同时刻、不同强度的 δ(k − i) 之和，每个 δ(k − i) 的零状态响应是 h(k − i)，全部叠加即得**卷积和**：" },
      { t: "f", x: "y_{zs}(k) = f(k) * h(k) = Σ_{i = −∞}^{+∞} f(i)h(k − i)" },
      { t: "p", x: "**图解法**与连续卷积的四步一致：换元、翻转（得 h(−i)）、平移（得 h(k − i)）、相乘求和。唯一区别是最后一步把积分换成有限项求和：对每个 k，把交叠区间内 f(i) 与 h(k − i) 的对应项相乘后累加。" },
      { t: "p", x: "**对位相乘求和法（竖式乘法）**是有限短序列卷积最实用的笔算方法：把两个序列按序号从小到大自左向右排列，右端对齐（序号最大的项对齐）；仿照整数竖式乘法，用下层序列的每一项去乘上层序列各项，得到一行行乘积——但**不进位**；最后把同一列的数相加，从左到右各列的和依次就是卷积结果的序列值。" },
      { t: "p", x: "列位置的含义：乘积 f(i)h(j) 落在序号 i + j 对应的列上。因此若 f 从序号 a 开始非零、h 从序号 b 开始非零，则结果从序号 a + b 开始；长度为 L_{1} 与 L_{2} 的两个有限序列，卷积结果有 L_{1} + L_{2} − 1 个非零值。对位法本质上就是把序号当作幂次的多项式乘法。" },
      { t: "kp", x: "对位相乘求和法三步：① 两序列按序号升序排列、右端对齐；② 逐位相乘、不进位；③ 同列相加。结果起始序号 = 两序列起始序号之和，结果长度 = 两序列长度之和减 1。它只适合有限长序列；无限长序列（如 a^{k}ε(k)）必须用公式（表 3-4）、定义式求和或图解法。" },
      { t: "p", x: "**性质**：交换律、分配律、结合律与连续卷积完全相同；与 δ(k) 卷积不变，与 δ(k − k_{0}) 卷积平移 k_{0}，与 ε(k) 卷积相当于部分和（累加）；级联系统 h = h_{1} * h_{2}，并联系统 h = h_{1} + h_{2}。" },
      { t: "f", x: "交换律：f * h = h * f；　分配律：f * (h_{1} + h_{2}) = f * h_{1} + f * h_{2}；　结合律：(f * h_{1}) * h_{2} = f * (h_{1} * h_{2})" },
      { t: "f", x: "f(k) * δ(k) = f(k)，　f(k) * δ(k − k_{0}) = f(k − k_{0})，　f(k) * ε(k) = Σ_{i = −∞}^{k} f(i)" },
      { t: "tbl", cap: "表3-4  常用卷积和公式（因果序列，a ≠ b，a ≠ 1）", head: ["卷积和式", "结果"], rows: [
        ["ε(k) * ε(k)", "(k + 1)ε(k)"],

        ["k ε(k) * ε(k)", "k(k + 1)/2 · ε(k)"],
        ["f(k) * δ(k − k_{0})", "f(k − k_{0})"]

      { t: "sim", id: "conv-sum", cap: "图3-1  卷积和动态演示", note: "选择两个短序列，拖动序号滑块 k：观察翻转—平移后哪些乘积项落入求和窗口，右侧茎状图如何逐点累积出卷积结果；对照对位相乘求和法的每一步。" },
      { t: "ex", title: "例3-2  卷积和的计算与对位法验证", problem: [
        { t: "p", x: "(1) 求 y_{1}(k) = (2^{k}ε(k)) * ε(k)；(2) 用对位相乘求和法计算 y_{2}(k) = f(k) * h(k)，其中 f(k) 在 k = 0、1、2 处依次取 1、2、3，h(k) 在 k = 0、1 处依次取 2、1，并用定义式核验。" }
      ], solution: [
        { t: "p", x: "解：(1) 按定义 y_{1}(k) = Σ_{i=0}^{k} 2^{i} × 1 = 2^{0} + 2^{1} + … + 2^{k} = 2^{k+1} − 1（k ≥ 0）；也可查表 3-4 第二行，取 a = 2：(1 − 2^{k+1})/(1 − 2) = 2^{k+1} − 1。" },
        { t: "f", x: "y_{1}(k) = (2^{k+1} − 1)ε(k)" },
        { t: "p", x: "(2) 对位相乘求和法：两序列右端对齐，用 h 中的 1（k = 1 项）乘 f 得一行按原位排列；用 h 中的 2（k = 0 项）乘 f 得一行整体左移一列；逐位相乘不进位，同列相加：" },
        { t: "p", x: "第 0 列：1 × 2 = 2；　第 1 列：1 × 1 + 2 × 2 = 5；　第 2 列：2 × 1 + 3 × 2 = 8；　第 3 列：3 × 1 = 3。" },
        { t: "f", x: "y_{2}(k) 依次取 2、5、8、3（k = 0、1、2、3）" },
        { t: "p", x: "核验（定义式）：y_{2}(1) = Σ f(i)h(1 − i) = f(0)h(1) + f(1)h(0) = 1 × 1 + 2 × 2 = 5；y_{2}(2) = f(1)h(1) + f(2)h(0) = 2 × 1 + 3 × 2 = 8，一致。两序列长 3 与 2，结果长 3 + 2 − 1 = 4，符合长度规律。" }

      { t: "ex", title: "例3-3  由 H(E) 求单位序列响应", problem: [
        { t: "p", x: "已知离散系统的传输算子 H(E) = (E + 1)/(E^{2} + 3E + 2)，求单位序列响应 h(k)。" }

        { t: "p", x: "分子分母的公因子 (E + 1) 约去（零极点相消），H(E) 只剩一个极点 E = −2。按表 3-3 第一行 K/(E − a) ↔ K a^{k−1}ε(k − 1)，取 K = 1、a = −2：" },
        { t: "f", x: "h(k) = (−2)^{k−1}ε(k − 1)" },
        { t: "p", x: "用迭代法核验：H(E) 对应方程 y(k + 2) + 3y(k + 1) + 2y(k) = f(k + 1) + f(k)。令 f(k) = δ(k)，零状态下 h(−1) = h(−2) = 0：取 k = −2 得 h(0) = 0；取 k = −1 得 h(1) + 3h(0) = f(0) = 1，即 h(1) = 1；取 k = 0 得 h(2) + 3h(1) + 2h(0) = f(1) + f(0) = 1，即 h(2) = 1 − 3 = −2。公式给出 h(0) = 0、h(1) = (−2)^{0} = 1、h(2) = (−2)^{1} = −2，完全一致。" }

  /* ═══════════ 第 4 章 连续信号的频域分析 ═══════════ */
  {
    id: "c4", label: "第4章 连续信号的频域分析", blocks: [
      { t: "p", x: "前两章在时域直接求解响应；本章转入**频域**：把信号分解为一组不同频率的正弦（复指数）分量，通过研究各频率分量的分布——频谱——来刻画信号与系统。主线是：正交分解的思想准备（4.1）；周期信号的傅里叶级数与频谱（4.2）；由 T → ∞ 的极限建立傅里叶变换对（4.3）；傅里叶变换的性质体系（4.4）。其中“时域卷积 ↔ 频域相乘”是全书枢纽性的规律，是滤波、调制、采样理论的基石。" },
      { t: "h3", x: "4.1  信号的正交分解" },
      { t: "p", x: "把信号分解为基本信号之和，是信号分析的总体思路。类比几何：空间中任一矢量都可表示为一组相互垂直的单位矢量的线性组合（投影）。把这一思想移植到信号空间：选一组相互正交的基本信号作“基”，任一信号即可表示为基信号的线性组合，分解系数就是信号在各“基方向”上的投影。" },
      { t: "f", x: "(f, g) = ∫_{t1}^{t2} f(t)g(t) dt　（两实信号在区间 (t_{1}, t_{2}) 上的内积）" },
      { t: "p", x: "若 (f, g) = 0，则称 f 与 g 在该区间上**正交**。若函数集 φ_{1}(t)、φ_{2}(t)、… 中任意两个不同函数两两正交，则称为**正交函数集**。最常用的正交函数集是三角函数集 1、cos Ωt、cos 2Ωt、…、sin Ωt、sin 2Ωt、…，它在任意长度为 T = 2π/Ω 的区间上正交。" },
      { t: "f", x: "∫_{t1}^{t2} φ_{i}(t)φ_{j}(t) dt = 0（i ≠ j），　∫_{t1}^{t2} φ_{i}^{2}(t) dt = K_{i}（基函数自身能量）" },
      { t: "p", x: "用正交函数集近似表示 f(t) 时，按均方误差最小可导出分解系数（投影系数）——它恰是 f 在基函数上的投影与该基函数能量之比：" },
      { t: "f", x: "c_{n} = [∫_{t1}^{t2} f(t)φ_{n}(t) dt] / [∫_{t1}^{t2} φ_{n}^{2}(t) dt]" },
      { t: "p", x: "**完备**正交函数集：若再添入集外任何非零函数都无法保持两两正交，则称该正交集完备。只有完备的正交函数集才能**无误差**地表示满足条件的信号（均方误差为零），且能量关系（帕塞瓦尔等式）成立。完备正交分解是傅里叶级数、沃尔什级数、勒让德多项式展开等一切级数展开的共同框架。" },
      { t: "p", x: "本课程主要使用两组完备正交基：三角函数集（对应三角形式傅里叶级数）与复指数函数集 e^{jnΩt}（对应指数形式傅里叶级数）。选正弦、复指数作基的根本原因是：**正弦信号通过 LTI 系统后仍是同频率的正弦信号**（只改变幅度与相位），从而每个频率分量可独立分析、再线性叠加——这正是频域分析法优越性的根源。" },
      { t: "h3", x: "4.2  周期信号的傅里叶级数" },
      { t: "p", x: "**狄利克雷条件**（展开的充分条件）：① 在一个周期内绝对可积；② 在一个周期内只有有限个极大与极小值；③ 在一个周期内只有有限个第一类间断点。工程实际信号一般都满足。满足条件的周期信号（周期 T，基波角频率 Ω = 2π/T）可展开为三角形式的傅里叶级数：" },
      { t: "f", x: "f(t) = a_{0}/2 + Σ_{n=1}^{+∞} [a_{n}cos(nΩt) + b_{n}sin(nΩt)]" },
      { t: "f", x: "a_{n} = (2/T)∫_{−T/2}^{T/2} f(t)cos(nΩt) dt（n = 0, 1, 2, …），　b_{n} = (2/T)∫_{−T/2}^{T/2} f(t)sin(nΩt) dt（n = 1, 2, …）" },
      { t: "p", x: "系数公式由三角函数集的正交性直接导出（逐项相乘积分，非同名项全部归零）。把同频率的 a_{n}、b_{n} 合并，得**余弦（幅度—相位）形式**，物理意义一目了然：周期信号是直流分量与各次谐波之和，谐波只出现在基频 Ω 的整数倍上：" },
      { t: "f", x: "f(t) = A_{0}/2 + Σ_{n=1}^{+∞} A_{n}cos(nΩt + φ_{n})，　A_{n} = (a_{n}^{2} + b_{n}^{2})^{1/2}，　φ_{n} = −arctan(b_{n}/a_{n})" },
      { t: "p", x: "利用欧拉公式可写成更紧凑的**指数形式**，其中 F_{n} 称为复振幅，是频域分析中使用最广的形式。对实信号，F_{n} 与三角系数的关系为 F_{0} = a_{0}/2（直流）、F_{n} = (a_{n} − jb_{n})/2（n > 0），且 F_{−n} = F_{n}^{*}（共轭对称），三种形式对照见表 4-1：" },
      { t: "f", x: "f(t) = Σ_{n=−∞}^{+∞} F_{n}e^{jnΩt}，　F_{n} = (1/T)∫_{−T/2}^{T/2} f(t)e^{−jnΩt} dt" },
      { t: "f", x: "|F_{n}| = A_{n}/2（n = 1, 2, …，双边谱幅度是单边谱的一半）" },
      { t: "tbl", cap: "表4-1  傅里叶级数三种形式对照（Ω = 2π/T）", head: ["形式", "展开式", "系数关系"], rows: [
        ["三角形式", "a_{0}/2 + Σ[a_{n}cos nΩt + b_{n}sin nΩt]", "a_{n} = (2/T)∫f cos nΩt dt；b_{n} = (2/T)∫f sin nΩt dt"],
        ["余弦形式", "A_{0}/2 + Σ A_{n}cos(nΩt + φ_{n})", "A_{n} = (a_{n}^{2} + b_{n}^{2})^{1/2}；φ_{n} = −arctan(b_{n}/a_{n})"],
        ["指数形式", "Σ F_{n}e^{jnΩt}（n 从 −∞ 到 +∞）", "F_{n} = (1/T)∫f e^{−jnΩt} dt；|F_{n}| = A_{n}/2"]
      ], widths: [14, 38, 48] },
      { t: "kp", x: "周期信号频谱的三大特点：① **离散性**——谱线只分布在 0、±Ω、±2Ω、… 的离散频点上；② **谐波性**——谱线只出现在基频 Ω = 2π/T 的整数倍处，不含其他频率分量；③ **收敛性**——谱线幅度总体随谐波次数增大而趋于零（包络按 1/n 或更快的规律衰减）。频谱 = 幅度谱（|F_{n}| 或 A_{n} 的分布）+ 相位谱（φ_{n} 的分布）。" },
      { t: "p", x: "最重要的典型信号是**周期矩形脉冲**：幅度 1、宽度 τ、周期 T、脉冲中心取在 t = 0（偶函数，F_{n} 为实数）。代入指数形式系数公式得抽样函数 Sa 包络的离散谱。谱线顶点落在包络 (τ/T)Sa(ωτ/2) 上，包络在 ωτ/2 = ±π、±2π、… 处过零，即零点角频率为 2π/τ 的整数倍；|ω| < 2π/τ 的中央部分称为主瓣，信号能量主要集中在主瓣内，故通常取第一零点定义频带宽度 B_{ω} = 2π/τ rad/s（B_{f} = 1/τ Hz）：" },
      { t: "f", x: "F_{n} = (τ/T)Sa(nΩτ/2)，　Sa(x) = sin x / x" },
      { t: "f", x: "谱线间隔：Ω = 2π/T；　包络第一零点：ω = 2π/τ；　主瓣宽度（±第一零点间）：4π/τ；　频带宽度：B_{ω} = 2π/τ" },
      { t: "p", x: "**T 与 τ 对频谱的影响**：τ 一定而 T 增大时，谱线间隔 Ω = 2π/T 减小、谱线加密，同时谱线高度按 τ/T 成正比减小；T → ∞ 时谱线无限密集、幅度趋于零，离散谱过渡为连续谱——这正是 4.3 节傅里叶变换的来源。τ 增大时第一零点 2π/τ 减小、主瓣变窄，能量更集中：**时域越宽、频域越窄**。功率关系由帕塞瓦尔等式给出——平均功率等于直流与各次谐波功率之和：" },
      { t: "f", x: "(1/T)∫_{−T/2}^{T/2} f^{2}(t) dt = Σ_{n=−∞}^{+∞} |F_{n}|^{2} = A_{0}^{2}/4 + (1/2)Σ_{n=1}^{+∞} A_{n}^{2}" },
      { t: "ex", title: "例4-1  周期矩形脉冲的傅里叶级数与频谱", problem: [
        { t: "p", x: "周期矩形脉冲幅度 A = 1、宽度 τ = 1、周期 T = 4（脉冲中心位于 t = 0）。求指数形式傅里叶级数系数 F_{n}，指出谱线间隔、包络零点位置与频带宽度，并算出第 1 次谐波的幅度。" }

        { t: "p", x: "解：基波角频率 Ω = 2π/T = π/2 rad/s。脉冲中心在 t = 0，f(t) 为偶函数，F_{n} 为实数。代入系数公式：" },
        { t: "f", x: "F_{n} = (1/T)∫_{−τ/2}^{τ/2} 1 × e^{−jnΩt} dt = (τ/T)Sa(nΩτ/2)" },
        { t: "p", x: "代入 τ = 1、T = 4：nΩτ/2 = n × (π/2) × 1/2 = nπ/4，故" },
        { t: "f", x: "F_{n} = (1/4)Sa(nπ/4) = (1/4) · sin(nπ/4)/(nπ/4)" },
        { t: "p", x: "讨论：直流分量 F_{0} = 1/4；谱线间隔为 Ω = π/2 rad/s；包络零点满足 nΩτ/2 = mπ，即 n = 4m（m = 1, 2, …），第 4、8、12、… 次谐波谱线为零，第一零点对应角频率 ω = 2π/τ = 2π rad/s；能量主要集中在主瓣内，频带宽度 B_{ω} = 2π rad/s（B_{f} = 1/τ = 1 Hz）。" },

      { t: "sim", id: "fs-synth", cap: "图4-1  傅里叶级数谐波合成演示", note: "选择方波、三角波或锯齿波，拖动谐波数滑块：观察逐次谐波叠加如何逼近原信号、幅度谱谱线如何收敛，以及方波跳变处始终存在约 9% 过冲的吉布斯现象。" },
      { t: "h3", x: "4.3  傅里叶变换" },
      { t: "p", x: "非周期信号可视为 T → ∞ 的周期信号。T 增大时：谱线间隔 Ω = 2π/T → 0（谱线无限加密），|F_{n}| → 0（每根谱线高度趋于零），但比值 F_{n}/(2π/T) = F_{n}T/2π 保持有限——它是单位频带内的谱线强度，即**频谱密度**。以此为极限定义傅里叶变换：" },
      { t: "f", x: "F(jω) = ∫_{−∞}^{+∞} f(t)e^{−jωt} dt　（傅里叶正变换）" },
      { t: "f", x: "f(t) = (1/2π) ∫_{−∞}^{+∞} F(jω)e^{jωt} dω　（傅里叶反变换）" },
      { t: "p", x: "F(jω) 称为 f(t) 的频谱密度函数：|F(jω)| 是幅度谱密度，辐角 θ(ω) 是相位谱。非周期信号的频谱是**连续谱**——它包含一切频率成分，但每个成分的幅度都是无穷小量，只能用密度描述。f(t) 与 F(jω) 构成一对变换，记作 f(t) ↔ F(jω)。" },
      { t: "f", x: "F(jω) = |F(jω)|e^{jθ(ω)}，　f(t) ↔ F(jω)" },
      { t: "p", x: "傅里叶变换存在的充分条件是 f(t) 绝对可积（∫|f(t)|dt < ∞），但并非必要；引入冲激函数后，阶跃信号、直流信号、周期信号等功率信号也具有确定的傅里叶变换（表 4-2），频域方法因而能统一处理能量信号与功率信号。" },
      { t: "p", x: "典型例子——门函数：宽度 τ、幅度 1 的矩形脉冲 g_{τ}(t)（又称门函数）的频谱是 Sa 形连续谱，第一零点在 ω = 2π/τ，与 4.2 节周期矩形脉冲的包络完全一致：" },
      { t: "f", x: "g_{τ}(t) ↔ τSa(ωτ/2)" },
      { t: "tbl", cap: "表4-2  常用傅里叶变换对（a > 0）", head: ["f(t)", "F(jω)"], rows: [
        ["δ(t)", "1（均匀频谱）"],
        ["1", "2πδ(ω)"],
        ["ε(t)", "πδ(ω) + 1/(jω)"],
        ["sgn(t)", "2/(jω)"],
        ["e^{−at}ε(t)", "1/(a + jω)"],
        ["e^{−a|t|}", "2a/(a^{2} + ω^{2})"],
        ["g_{τ}(t)（宽度 τ 的门函数）", "τSa(ωτ/2)"],
        ["Sa(ω_{c}t)", "(π/ω_{c}) × 宽度 2ω_{c} 的门形谱"],
        ["cos ω_{0}t", "π[δ(ω − ω_{0}) + δ(ω + ω_{0})]"],
        ["sin ω_{0}t", "jπ[δ(ω + ω_{0}) − δ(ω − ω_{0})]"],

        ["δ_{T}(t) = Σ δ(t − kT)", "Ω Σ δ(ω − nΩ)，Ω = 2π/T"]
      ], widths: [40, 60] },
      { t: "p", x: "表 4-2 与性质（表 4-3）配合使用，绝大多数常用信号的频谱都可“查表 + 性质变形”得到，无需按定义积分。例如 e^{−at}sin(ω_{0}t)ε(t) 由频移性质得到，tε(t) 由频域微分性质得到，矩形脉冲延时后的频谱由时移性质直接写出。" },
      { t: "ex", title: "例4-2  利用性质求傅里叶变换", problem: [
        { t: "p", x: "已知 f(t) = e^{−at}ε(t)（a > 0）的傅里叶变换 F(jω) = 1/(a + jω)。利用性质求：(1) f(t − t_{0}) 的频谱；(2) f′(t) 的频谱。" }
      ], solution: [
        { t: "p", x: "解：(1) 时移性质：时域延时 t_{0}，频谱乘相位因子 e^{−jωt_{0}}。f(t − t_{0}) = e^{−a(t − t_{0})}ε(t − t_{0})，故" },

        { t: "p", x: "其幅度谱 1/(a^{2} + ω^{2})^{1/2} 与原信号完全相同，仅相位增加线性项 −ωt_{0}——时移不改变幅度谱。" },
        { t: "p", x: "(2) 时域微分性质：f′(t) ↔ jωF(jω)，故" },

      ] },
      { t: "h3", x: "4.4  傅里叶变换的性质" },
      { t: "p", x: "性质揭示时域与频域之间的对应规律，把“积分求变换”变成“查表 + 变形”，也是理解采样、调制、滤波原理的钥匙。先看**时移性质**：信号延时 t_{0}，频谱只乘一个相位因子，幅度谱完全不变——延时只改变各频率分量的相对相位，不改变其强弱，这是“传输延时本身不产生幅度失真”的理论依据。主要性质汇总于表 4-3。" },
      { t: "tbl", cap: "表4-3  傅里叶变换的主要性质（设 f(t) ↔ F(jω)，f_{1} ↔ F_{1}，f_{2} ↔ F_{2}）", head: ["性质", "时域", "频域"], rows: [

        ["频移", "f(t)e^{jω_{0}t}", "F[j(ω − ω_{0})]"],

        ["频域微分", "t f(t)", "j dF(jω)/dω"],
        ["时域卷积", "f_{1} * f_{2}", "F_{1}(jω)F_{2}(jω)"],
        ["频域卷积", "f_{1}f_{2}", "(1/2π)F_{1} * F_{2}"],
        ["帕塞瓦尔", "∫ f^{2}(t)dt", "(1/2π)∫ |F(jω)|^{2}dω"]
      ], widths: [16, 34, 50] },
      { t: "f", x: "f(t − t_{0}) ↔ F(jω)e^{−jωt_{0}}（幅度谱不变，附加线性相位 −ωt_{0}）" },
      { t: "p", x: "**尺度变换性质**：时域压缩 a 倍（a > 1），频域展宽 a 倍、幅度降为 1/a；时域展宽则频域压缩。信号有效时宽与有效带宽成**反比**——通信中“传输速率与带宽矛盾”的根源，也是 4.2 节矩形脉冲“τ 增大、主瓣变窄”现象的一般表述：" },
      { t: "f", x: "f(at) ↔ (1/|a|)F(jω/a)" },
      { t: "p", x: "**频移性质与调制**：时域乘 e^{jω_{0}t}，频谱搬移 ω_{0}。由于 cos ω_{0}t = (e^{jω_{0}t} + e^{−jω_{0}t})/2，用信号 f(t) 乘载波 cos ω_{0}t，就把频谱搬到 ±ω_{0} 附近（幅度各半）——这正是幅度调制的原理；同步解调则再乘一次同频载波把频谱搬回原处。" },
      { t: "f", x: "f(t)cos ω_{0}t ↔ (1/2){F[j(ω − ω_{0})] + F[j(ω + ω_{0})]}" },
      { t: "p", x: "**卷积定理——系统频域分析的基石**：时域卷积对应频域相乘，频域卷积对应时域相乘。于是零状态响应 y_{zs}(t) = f(t) * h(t) 在频域变为 Y(jω) = F(jω)H(jω)——把卷积积分简化为普通乘法，这是系统频域分析与滤波器理论的核心工具。" },
      { t: "f", x: "f_{1}(t) * f_{2}(t) ↔ F_{1}(jω)F_{2}(jω)，　f_{1}(t)f_{2}(t) ↔ (1/2π)F_{1}(jω) * F_{2}(jω)" },
      { t: "p", x: "**对偶性质**：把变换对 f(t) ↔ F(jω) 中的 F(jω) 换成时间函数 F(jt)，其频谱与 f 有对偶关系。它解释了成对出现的规律：门函数 ↔ Sa 形频谱，Sa 形信号 ↔ 门形频谱；时域微分 ↔ 乘 jω 与频域微分 ↔ 乘 jt 也互为对偶。善用对偶可成倍减少需要记忆的变换对。常用的微分、积分性质归纳如下：" },
      { t: "f", x: "f′(t) ↔ jωF(jω)，　∫_{−∞}^{t} f(τ)dτ ↔ πF(0)δ(ω) + F(jω)/(jω)，　t f(t) ↔ j dF(jω)/dω" },
      { t: "kp", x: "抓住三条规律：① 时移只改相位——幅度谱在延时下不变；② 时宽带宽成反比——时域压缩即频域展宽（尺度性质）；③ 卷积与相乘互为对偶——时域卷积 ↔ 频域相乘。这三条规律贯穿调制、滤波、采样三大应用，必须熟记并能正反双向使用。" },
      { t: "ex", title: "例4-3  cos ω_{0}t 与冲激串的傅里叶变换", problem: [
        { t: "p", x: "求：(1) f_{1}(t) = cos ω_{0}t；(2) 周期为 T 的冲激串 δ_{T}(t) = Σ_{k=−∞}^{+∞} δ(t − kT) 的傅里叶变换。" }
      ], solution: [
        { t: "p", x: "解：(1) 由欧拉公式 cos ω_{0}t = (e^{jω_{0}t} + e^{−jω_{0}t})/2。由常数 1 ↔ 2πδ(ω) 与频移性质得 e^{jω_{0}t} ↔ 2πδ(ω − ω_{0})，于是" },
        { t: "f", x: "cos ω_{0}t ↔ π[δ(ω − ω_{0}) + δ(ω + ω_{0})]" },
        { t: "p", x: "余弦信号的频谱是位于 ±ω_{0} 的两根强度为 π 的冲激谱线——单频信号频谱最简单，却是构成一切复杂信号的“原子”。" },
        { t: "p", x: "(2) δ_{T}(t) 是周期信号，先展开为指数形式傅里叶级数：系数 F_{n} = (1/T)∫_{−T/2}^{T/2} δ(t)e^{−jnΩt} dt = 1/T（Ω = 2π/T），故" },
        { t: "f", x: "δ_{T}(t) = (1/T) Σ_{n=−∞}^{+∞} e^{jnΩt}" },
        { t: "p", x: "对每一项 e^{jnΩt} 应用 e^{jω_{0}t} ↔ 2πδ(ω − ω_{0})（取 ω_{0} = nΩ）：" },
        { t: "f", x: "δ_{T}(t) ↔ Ω Σ_{n=−∞}^{+∞} δ(ω − nΩ)，　Ω = 2π/T" },
        { t: "p", x: "时域冲激串的频谱仍是冲激串：谱线间隔与谱线强度均为 Ω = 2π/T。这一结果是抽样（采样）理论的核心工具：以间隔 T 对信号理想抽样，相当于把频谱以 Ω = 2π/T 为周期进行搬移叠加。" }
      ] },
      { t: "sim", id: "ft-duality", cap: "图4-2  时频对偶演示", note: "拖动矩形脉冲宽度滑块：脉冲越窄，频谱主瓣越宽；脉冲越宽，主瓣越窄。观察时域宽度与频域主瓣宽度的乘积是否近似恒定，直观理解尺度变换性质与时宽—带宽反比规律。" },
      { t: "kp", x: "本章必须掌握：① 内积、正交函数集与完备正交分解的思想；② 周期信号傅里叶级数的三种形式及系数公式（表 4-1）、|F_{n}| = A_{n}/2 等关系；③ 周期信号频谱三特点（离散性、谐波性、收敛性）、周期矩形脉冲 F_{n} = (τ/T)Sa(nΩτ/2)、主瓣、第一零点 2π/τ 与频带宽度、帕塞瓦尔等式；④ 傅里叶变换对与频谱密度概念、典型变换对（表 4-2）；⑤ 性质体系（表 4-3）：时移不改幅度谱、尺度反比、频移与调制、时域卷积 ↔ 频域相乘、微分积分性质、对偶性；⑥ 综合运用性质与典型变换对求常用信号频谱的方法。" }
    ]

<script>
/* ── content3.js ── */
(function () {
  "use strict";
  window.DOC_CONTENT = window.DOC_CONTENT || {};
  window.DOC_CONTENT.chapters = window.DOC_CONTENT.chapters || [];
  window.DOC_CONTENT.chapters.push(
    { id: "c5", label: "第5章 傅里叶变换的应用", blocks: [
      { t: "p", x: "本章把傅里叶变换从信号分析推进到系统分析。首先建立系统频率响应的概念，然后依次讨论无失真传输的条件、理想低通滤波器、抽样定理与混叠、调制与解调以及两种基本复用方式。贯穿全章的主线只有一条：LTI 系统在频域中的作用是对输入信号各频率分量进行幅度加权与相移，即时域卷积化为频域乘法 Y(jω) = H(jω)F(jω)。" },

      { t: "h3", x: "5.1  系统的频率响应" },
      { t: "p", x: "LTI 连续系统的零状态响应是激励与冲激响应的卷积 y(t) = h(t)*f(t)。由时域卷积定理，卷积在频域对应乘法，由此得到描述系统的频域模型——频率响应" },
      { t: "f", x: "H(jω) = Y(jω)/F(jω)" },
      { t: "p", x: "H(jω) 与冲激响应构成一对傅里叶变换：h(t) ↔ H(jω)。其物理意义是系统对复指数分量 e^{jωt} 的复加权系数：输出只含输入已有的频率分量，幅度与相位被 H(jω) 重新塑造，不产生新频率。" },
      { t: "p", x: "把 H(jω) 写成极坐标形式 H(jω) = |H(jω)|e^{jφ_{H}(ω)}，其中 |H(jω)| 称为幅频特性，反映各频率分量被放大或抑制的程度；φ_{H}(ω) 称为相频特性，反映各分量获得的相移即时间延迟。" },
      { t: "p", x: "本节最重要的结论是正弦稳态响应公式：若激励为单一频率正弦 f(t) = A cos(ω_{0}t + φ)，则系统的稳态输出为同频率正弦" },
      { t: "f", x: "y(t) = A|H(jω_{0})|cos(ω_{0}t + φ + φ_{H}(ω_{0}))" },
      { t: "p", x: "即频率不变、幅度乘以 |H(jω_{0})|、相位附加 φ_{H}(ω_{0})。计算步骤：先求出 H(jω)（可由电路相量模型或对 h(t) 取傅里叶变换得到），再令 ω = ω_{0} 代入并分别取模与辐角。复杂周期信号可先分解为谐波，逐项使用上式再叠加。" },

      { t: "h3", x: "5.2  无失真传输" },
      { t: "p", x: "若希望信号通过系统后波形形状不变，只允许整体幅度按比例缩放和整体时间延迟，称为无失真传输，其时域定义为" },
      { t: "f", x: "y(t) = K f(t − t_{d})" },
      { t: "p", x: "其中 K 为增益常数，t_{d} 为延时常数。对上式取傅里叶变换并利用时移性质 Y(jω) = KF(jω)e^{−jωt_{d}}，得到无失真传输系统的频率响应" },
      { t: "f", x: "H(jω) = K e^{−jωt_{d}}" },
      { t: "p", x: "该条件可分解为两条：幅频特性为常数，相频特性为过原点的直线" },
      { t: "f", x: "|H(jω)| = K（与 ω 无关），φ_{H}(ω) = −ωt_{d}（斜率为 −t_{d} 的过原点直线）" },
      { t: "p", x: "相频条件的含义是各频率分量获得与频率成正比的相移，即经历相同的时延 t_{d} = −dφ_{H}(ω)/dω（群时延为常数）。若相频特性是直线但不过原点（附加常数相位），分量间相对关系仍被破坏，同样产生失真。" },
      { t: "kp", x: "幅度失真：|H(jω)| 不是常数，各频率分量被不等地放大或衰减，能量分布改变。相位失真：φ_{H}(ω) 不是过原点的直线，各分量时延不同，叠加后波形畸变。两者都不产生新的频率成分，统称线性失真，区别于非线性器件产生谐波的非线性失真。" },
      { t: "ex", title: "例5-1  判断无失真传输并求稳态输出", problem: [
        { t: "p", x: "已知 LTI 系统的频率响应 H(jω) = (2 − jω)/(2 + jω)，激励 f(t) = 2cos t + 2cos 2t。该系统是否为无失真传输系统？求稳态输出 y(t)。" }
      ], solution: [
        { t: "p", x: "解：先分析幅频与相频特性。分子 2 − jω 与分母 2 + jω 的模相同、辐角相反，故" },
        { t: "f", x: "|H(jω)| = 1，φ_{H}(ω) = −2arctan(ω/2)" },
        { t: "p", x: "幅频恒为 1，无幅度失真；但相位不是过原点的直线：φ_{H}(1) = −2arctan(0.5) ≈ −0.927 rad，φ_{H}(2) = −2arctan(1) = −π/2 ≈ −1.571 rad。两分量的等效时延分别为 0.927 s 与 π/4 ≈ 0.785 s，不相等，存在**相位失真**，不是无失真传输系统。" },
        { t: "p", x: "用正弦稳态公式逐个分量求输出：" },
        { t: "f", x: "y(t) = 2|H(j1)|cos(t + φ_{H}(1)) + 2|H(j2)|cos(2t + φ_{H}(2))" },
        { t: "f", x: "y(t) = 2cos(t − 0.927) + 2cos(2t − π/2) = 2cos(t − 0.927) + 2sin 2t" },
        { t: "p", x: "两个分量幅度都未变，但相对相位关系改变，合成波形与 f(t) 不满足 y = K f(t − t_{d}) 的关系，直观体现了相位失真的后果。" }
      ] },

      { t: "h3", x: "5.3  理想低通滤波器" },
      { t: "p", x: "理想低通滤波器让截止频率以下的分量无失真通过、以上的分量完全抑制，频率响应定义为" },
      { t: "f", x: "H(jω) = e^{−jωt_{d}}（|ω| ≤ ω_{c}）；H(jω) = 0（|ω| > ω_{c}）" },
      { t: "p", x: "其中 ω_{c} 为截止频率，t_{d} 为通带时延。H(jω) 是宽度 2ω_{c} 的门函数与 e^{−jωt_{d}} 的乘积：门函数的逆变换是 Sa 波形（Sa(x) = sin x/x），指数因子对应时移，于是冲激响应为" },
      { t: "f", x: "h(t) = (ω_{c}/π)Sa[ω_{c}(t − t_{d})]" },
      { t: "p", x: "h(t) 的峰值出现在 t = t_{d}，峰值大小为 ω_{c}/π；零点位于 t_{d} ± nπ/ω_{c}（n = 1, 2, …），主瓣宽度 2π/ω_{c}。ω_{c} 越大，h(t) 越窄越尖，系统响应越快；相应地，阶跃响应在 t_{d} 附近从最小值过渡到最大值所需时间约为 2π/ω_{c}，说明**带宽与响应速度成反比**。" },
      { t: "p", x: "h(t) 在 t < 0 区域不为零，冲激尚未加入系统已出现响应，因此理想低通是**非因果系统**，物理上不可实现；阶跃响应中的振荡（吉布斯现象）也说明带限系统无法瞬时跟踪突变。" },
      { t: "p", x: "幅度特性可实现性的判据是佩利–维纳必要条件：允许 |H(jω)| 在有限个离散频点为零，但不允许在有限宽的频带内恒为零。" },
      { t: "f", x: "∫_{−∞}^{+∞} |ln|H(jω)||(1 + ω^{2})^{−1}dω < ∞" },
      { t: "tbl", cap: "表5-1  四种理想滤波器（通带内 H(jω) = e^{−jωt_{d}}，阻带内为 0，均不可物理实现）", head: ["类型", "通带范围", "作用"], rows: [
        ["低通", "|ω| ≤ ω_{c}", "通过低频、抑制高频"],
        ["高通", "|ω| ≥ ω_{c}", "通过高频、抑制低频"],
        ["带通", "ω_{1} ≤ |ω| ≤ ω_{2}", "通过中间频段"],
        ["带阻", "|ω| ≤ ω_{1} 或 |ω| ≥ ω_{2}", "抑制中间频段（陷波）"]
      ], widths: [16, 40, 44] },
      { t: "ex", title: "例5-3  正弦信号通过理想低通滤波器", problem: [
        { t: "p", x: "已知理想低通滤波器 H(jω) = e^{−jω×0.001}（|ω| ≤ 200π rad/s），当 |ω| > 200π 时 H(jω) = 0。输入 f(t) = 3cos(100πt) + 2cos(300πt)，求稳态输出 y(t)。" }
      ], solution: [
        { t: "p", x: "解：逐个分量判断频率是否位于通带内。" },
        { t: "p", x: "分量一：ω_{0} = 100π rad/s < 200π，在通带内。|H(j100π)| = 1，相移 φ = −ω_{0}t_{d} = −100π×0.001 = −0.1π rad，故" },
        { t: "f", x: "y_{1}(t) = 3cos(100πt − 0.1π) = 3cos[100π(t − 0.001)]" },
        { t: "p", x: "分量二：ω_{0} = 300π rad/s > 200π，在阻带内，被完全滤除，y_{2}(t) = 0。因此" },
        { t: "f", x: "y(t) = 3cos[100π(t − 0.001)]" },
        { t: "p", x: "可见理想低通对通带内分量相当于无失真传输（幅度不变、延时 t_{d} = 1 ms），对阻带分量彻底清除，这正是选频滤波的本质。" }
      ] },
      { t: "sim", id: "filter-lp", cap: "图5-1  理想低通滤波演示", note: "三频率分量合成的信号通过低通滤波器，拖动截止频率观察输出波形与滤波效果。" },

      { t: "h3", x: "5.4  抽样定理" },
      { t: "p", x: "数字系统处理连续信号的第一步是抽样：只保留等间隔时刻的样值。抽样定理回答关键问题——抽样间隔多大，样值才不丢失信息。理想（冲激）抽样模型是把 f(t) 与周期冲激序列相乘" },
      { t: "f", x: "f_{s}(t) = f(t)·δ_{T_{s}}(t) = Σ_{n=−∞}^{+∞} f(nT_{s})δ(t − nT_{s})" },
      { t: "p", x: "其中 T_{s} 为抽样间隔，f_{s} = 1/T_{s} 为抽样频率，ω_{s} = 2π/T_{s} 为抽样角频率。δ_{T_{s}}(t) 的频谱是强度为 ω_{s}、间隔为 ω_{s} 的冲激串，时域相乘对应频域卷积，于是抽样信号的频谱是原频谱的**周期延拓**" },
      { t: "f", x: "F_{s}(jω) = (1/T_{s})Σ_{n=−∞}^{+∞} F(j(ω − nω_{s}))" },
      { t: "f", x: "ω_{s} ≥ 2ω_{m}，即 f_{s} ≥ 2f_{m}，T_{s} ≤ π/ω_{m} = 1/(2f_{m})" },
      { t: "kp", x: "奈奎斯特准则：只有当抽样频率不低于信号最高频率的两倍（f_{s} ≥ 2f_{m}）时，抽样值才携带原信号的全部信息。f_{s} = 2f_{m} 称为奈奎斯特频率（速率），对应的 T_{s} = 1/(2f_{m}) 是允许的最大抽样间隔。工程上为便于恢复滤波器设计并保留余量，常取 f_{s} 为 (2.5～5)f_{m}。注意 f_{m} 必须取信号中最高频率分量的频率。" },
      { t: "p", x: "混叠现象：若 ω_{s} < 2ω_{m}，相邻频瓣互相重叠，重叠区内的频率分量无法区分，此后无论用什么滤波器都不能无失真恢复。频率为 f 的分量被 f_{s} 抽样后会出现在 |f − nf_{s}| 处，表现为信号中并不存在的低频假象（假频）。" },
      { t: "p", x: "恢复：当满足奈奎斯特准则时，让 F_{s}(jω) 通过增益 T_{s}、截止频率 ω_{c} = ω_{s}/2 的理想低通即可取出单个频瓣，时域上等价于用 Sa 函数对样值内插" },
      { t: "f", x: "f(t) = Σ_{n=−∞}^{+∞} f(nT_{s})·Sa[ω_{s}(t − nT_{s})/2]" },
      { t: "p", x: "取临界抽样 ω_{s} = 2ω_{m} 时上式化为 Sa[ω_{m}(t − nT_{s})]。内插公式表明离散样值配合连续插值函数可精确重构原信号，这是数字系统采集、处理并恢复模拟信号的理论基石。" },
      { t: "ex", title: "例5-2  最低抽样频率与最大抽样间隔", problem: [
        { t: "p", x: "某语音信号的最高频率分量为 f_{m} = 4 kHz（ω_{m} = 8000π rad/s）。（1）求最低抽样频率 f_{s} 与最大抽样间隔 T_{s}；（2）若取 f_{s} = 6 kHz，会发生什么现象？" }
      ], solution: [
        { t: "p", x: "解：（1）由奈奎斯特准则 f_{s} ≥ 2f_{m} = 2×4 kHz = 8 kHz，故最低抽样频率为 8 kHz，对应抽样角频率 ω_{s} = 2πf_{s} = 16000π rad/s。" },
        { t: "f", x: "T_{s} ≤ 1/f_{s} = 1/8000 s = 125 μs" },
        { t: "p", x: "即最大抽样间隔为 125 μs。" },
        { t: "p", x: "（2）f_{s} = 6 kHz 时，f_{s}/2 = 3 kHz < f_{m} = 4 kHz，不满足奈奎斯特准则，发生混叠：原 4 kHz 分量抽样后出现在 |4000 − 6000| = 2000 Hz 处，折叠为 2 kHz 的假频，落在有效频带内无法与真实低频分量区分；4 kHz 以下的分量本身不受影响。恢复信号中 4 kHz 成分被错误的 2 kHz 成分取代，造成失真。" }
      ] },
      { t: "sim", id: "sampling", cap: "图5-2  抽样定理与混叠演示", note: "调节抽样频率，观察频谱延拓、混叠发生与信号恢复质量。" },

      { t: "h3", x: "5.5  调制与解调" },
      { t: "p", x: "调制的目的是把低频消息搬移到高频载波附近：使天线尺寸与信号波长匹配、实现信道复用并抑制干扰。其理论基础是频移特性——cos(ω_{0}t) 的频谱为 π[δ(ω − ω_{0}) + δ(ω + ω_{0})]，时域相乘对应频域与冲激卷积，即把频谱搬移到 ±ω_{0} 处" },
      { t: "f", x: "f(t)cos(ω_{0}t) ↔ ½[F(j(ω + ω_{0})) + F(j(ω − ω_{0}))]" },
      { t: "p", x: "设消息信号频带限于 |ω| ≤ ω_{m}，则已调信号 y(t) = f(t)cos(ω_{0}t) 的频谱集中在 ±ω_{0} 附近各占带宽 ω_{m}，总带宽 2ω_{m}；频谱形状不变，仅中心被搬移。" },
      { t: "p", x: "同步（相干）解调：接收端再乘一次同频同相载波，利用 cos^{2}(ω_{0}t) = ½[1 + cos(2ω_{0}t)]，得" },
      { t: "f", x: "y(t)cos(ω_{0}t) = ½f(t) + ½f(t)cos(2ω_{0}t)" },
      { t: "f", x: "½F(jω) + ¼[F(j(ω + 2ω_{0})) + F(j(ω − 2ω_{0}))]" },
      { t: "p", x: "第一项是搬回原处的基带频谱，第二项位于 ±2ω_{0} 附近。只要 ω_{0} > ω_{m}（工程上取远大于），用截止频率 ω_{c} 满足 ω_{m} < ω_{c} < 2ω_{0} − ω_{m} 的低通滤波器即可取出 ½f(t)，再放大 2 倍完成解调。" },
      { t: "p", x: "同步要求：接收载波必须与发送载波同频同相。存在相位差 Δφ 时解调输出为 f(t)cos(Δφ)，幅度衰减甚至为零；频率不同步则输出波形失真。因此实际系统需要载波提取（同步）电路。" },
      { t: "sim", id: "am-mod", cap: "图5-3  幅度调制与频谱搬移演示", note: "调节载波频率与调制深度，观察已调信号波形与频谱搬移。" },

      { t: "h3", x: "5.6  频分复用与时分复用" },
      { t: "p", x: "一条信道同时传输多路信号称为复用。频移特性与抽样定理分别支撑了两种基本复用方式。" },
      { t: "p", x: "频分复用（FDM）：发送端将各路消息用不同载波调制，使各路频谱搬移到互不重叠的频段后叠加发送；接收端先用不同中心频率的带通滤波器分离各路，再同步解调还原。相邻路之间需留保护带以防串扰。" },
      { t: "p", x: "时分复用（TDM）：以抽样定理为依据，将各路抽样值按时间先后轮流安排在不同时隙，同一时刻只传送一路样值；接收端按时隙用门控电路分路，再经内插恢复。抽样频率越高、时隙越窄，可复用的路数越多。" },
      { t: "tbl", cap: "表5-2  频分复用与时分复用对照", head: ["比较项", "频分复用（FDM）", "时分复用（TDM）"], rows: [
        ["划分资源", "按频率：各路占用不同频段", "按时间：各路占用不同时隙"],
        ["理论基础", "调制引起频谱搬移", "抽样定理"],
        ["信号形式", "模拟、数字均可", "抽样脉冲或数字信号"],
        ["接收端分离", "带通滤波器分路", "门控（时隙同步）分路"],
        ["主要问题", "非线性串扰、需保护带", "需要严格同步、防止时隙泄漏"],
        ["典型应用", "广播、载波电话", "PCM 数字电话、数字传输系统"]
      ], widths: [18, 41, 41] },
      { t: "p", x: "从发展趋势看，TDM 与数字技术天然契合，便于编码、加密与交换，抗干扰能力强；FDM 设备以滤波器和调制器为主，可直接利用现有模拟信道。现代系统（如正交频分复用 OFDM）常将两种思想结合使用。" },
      { t: "kp", x: "本章必须掌握：（1）频率响应定义 H(jω) = Y(jω)/F(jω) 与 h(t) ↔ H(jω)；（2）正弦稳态响应公式 y(t) = A|H(jω_{0})|cos(ω_{0}t + φ + φ_{H}(ω_{0}))；（3）无失真传输条件 |H(jω)| = K 且 φ_{H}(ω) = −ωt_{d}；（4）理想低通的频率响应与 h(t) = (ω_{c}/π)Sa[ω_{c}(t − t_{d})]、非因果性与佩利–维纳条件；（5）抽样频谱周期延拓公式、奈奎斯特准则 f_{s} ≥ 2f_{m}、混叠与 Sa 内插公式；（6）调制与同步解调的频谱搬移过程；（7）FDM 与 TDM 的原理对照。" }
    ] },

    { id: "c6", label: "第6章 连续时间系统的复频域分析", blocks: [
      { t: "p", x: "本章把傅里叶变换推广为拉普拉斯变换，用复频率 s = σ + jω 统一处理系统的暂态与稳态、零输入与零状态。主线是：对微分方程取拉普拉斯变换使其化为代数方程，初始条件自动进入；系统函数 H(s) 的零极点分布完全决定系统的响应模式与稳定性。学习时应注意与第 5 章的联系：H(jω) = H(s)|_{s=jω}。" },

      { t: "h3", x: "6.1  拉普拉斯变换的定义与收敛域" },
      { t: "p", x: "傅里叶变换要求信号绝对可积，阶跃、指数增长等信号难以处理；系统分析还必须考虑初始条件。解决办法是先给信号乘以衰减因子 e^{−σt} 再作傅里叶变换，由此得到拉普拉斯变换。对因果信号采用单边定义" },
      { t: "f", x: "F(s) = ∫_{0−}^{+∞} f(t)e^{−st}dt，s = σ + jω" },
      { t: "p", x: "积分下限取 0_{−} 的用意：把 t = 0 时刻的冲激以及换路前的初始状态全部包含进来，使微分性质可以直接使用 0_{−} 初始条件，避免求 0_{+} 初始值的繁琐步骤。" },
      { t: "p", x: "收敛域：使积分收敛的 s 的取值范围。若存在收敛坐标 σ_{0}，使 σ > σ_{0} 时 f(t)e^{−σt} 绝对可积，则" },
      { t: "f", x: "σ > σ_{0}（单边拉普拉斯变换的收敛域为右半平面）" },
      { t: "p", x: "例如 e^{−at}ε(t) 的收敛域为 σ > −a，ε(t) 的收敛域为 σ > 0；增长信号 e^{at}ε(t)（a > 0）也有收敛域 σ > a，仍存在拉普拉斯变换——这正是它比傅里叶变换适用面更广的原因。本课程讨论因果信号与因果系统，一律采用单边拉普拉斯变换，其收敛域总在最右极点之右的半平面，一般不必逐一标明。" },
      { t: "p", x: "与傅里叶变换的关系：拉普拉斯变换是傅里叶变换的推广，当收敛域包含虚轴时，取 σ = 0 即 s = jω 可得" },
      { t: "f", x: "F(jω) = F(s)|_{s = jω}" },

      { t: "h3", x: "6.2  常用拉普拉斯变换对" },
      { t: "p", x: "与傅里叶分析一样，实际计算主要依靠变换表与性质。下表列出最常用的因果信号变换对（时域均含 ε(t) 因子，查表时按因果信号处理）。" },
      { t: "tbl", cap: "表6-1  常用单边拉普拉斯变换对", head: ["f(t)", "F(s)", "收敛域"], rows: [
        ["δ(t)", "1", "全平面"],
        ["δ′(t)", "s", "全平面"],
        ["δ^{(n)}(t)", "s^{n}", "全平面"],
        ["ε(t)", "1/s", "σ > 0"],
        ["tε(t)", "1/s^{2}", "σ > 0"],
        ["t^{n}ε(t)", "n!/s^{n+1}", "σ > 0"],
        ["e^{−at}ε(t)", "1/(s + a)", "σ > −a"],
        ["t e^{−at}ε(t)", "1/(s + a)^{2}", "σ > −a"],
        ["t^{n}e^{−at}ε(t)", "n!/(s + a)^{n+1}", "σ > −a"],
        ["sin(ω_{0}t)ε(t)", "ω_{0}/(s^{2} + ω_{0}^{2})", "σ > 0"],
        ["cos(ω_{0}t)ε(t)", "s/(s^{2} + ω_{0}^{2})", "σ > 0"],
        ["e^{−at}sin(ω_{0}t)ε(t)", "ω_{0}/[(s + a)^{2} + ω_{0}^{2}]", "σ > −a"],
        ["e^{−at}cos(ω_{0}t)ε(t)", "(s + a)/[(s + a)^{2} + ω_{0}^{2}]", "σ > −a"]
      ], widths: [28, 42, 30] },
      { t: "p", x: "核心变换对是 e^{−at}ε(t) ↔ 1/(s + a)：结合 s 域平移性质可派生 e^{−at}cos、e^{−at}sin 各对。例如求 t e^{−2t}ε(t) 的象函数，直接查表中第 8 行得 1/(s + 2)^{2}。" },
      { t: "p", x: "δ(t) ↔ 1 与 ε(t) ↔ 1/s 常用于检验：前者代入定义积分立得；后者 ∫_{0}^{+∞} e^{−st}dt = 1/s（σ > 0）。" },

      { t: "h3", x: "6.3  拉普拉斯变换的性质" },
      { t: "p", x: "性质把复杂信号与已知变换对联系起来，也是解微分方程的工具。设 f(t) ↔ F(s)，常用性质如下。" },
      { t: "tbl", cap: "表6-2  拉普拉斯变换的常用性质（f(t) ↔ F(s)）", head: ["性质", "时域", "s 域"], rows: [
        ["线性", "a f_{1}(t) + b f_{2}(t)", "a F_{1}(s) + b F_{2}(s)"],
        ["时移", "f(t − t_{0})ε(t − t_{0})", "e^{−st_{0}}F(s)"],
        ["s 域平移", "e^{−at}f(t)", "F(s + a)"],
        ["尺度变换", "f(at)，a > 0", "(1/a)F(s/a)"],
        ["时域微分", "f′(t)", "sF(s) − f(0_{−})"],
        ["时域二阶微分", "f″(t)", "s^{2}F(s) − sf(0_{−}) − f′(0_{−})"],
        ["时域积分", "∫_{0−}^{t} f(τ)dτ", "F(s)/s"],
        ["s 域微分", "t f(t)", "−dF(s)/ds"],
        ["初值定理", "f(0_{+})", "lim_{s→∞} sF(s)（F 为真分式）"],
        ["终值定理", "f(∞)", "lim_{s→0} sF(s)（sF(s) 极点均在左半平面）"],
        ["时域卷积", "f_{1}(t)*f_{2}(t)", "F_{1}(s)F_{2}(s)"]
      ], widths: [20, 34, 46] },
      { t: "kp", x: "两个易错点：（1）时移性质要求延时后仍为因果形式 f(t − t_{0})ε(t − t_{0})，波形整体延时才能直接乘 e^{−st_{0}}；（2）微分性质自动携带 0_{−} 初始条件，这是它能用于解微分方程的关键；终值定理只有在 sF(s) 的所有极点位于左半平面（原点单极点除外）时才可用，存在虚轴共轭极点（振荡）或右半平面极点（增长）时 f(∞) 不存在，不能套用。" },
      { t: "f", x: "y(t) = h(t)*f(t) ↔ Y(s) = H(s)F(s)" },
      { t: "p", x: "卷积定理是系统复频域分析的基石：零状态响应的卷积积分在 s 域成为乘积，微分方程求解由此转化为代数运算。初值定理常用于校验部分分式展开的结果。" },

      { t: "h3", x: "6.4  部分分式法求拉普拉斯逆变换" },
      { t: "p", x: "逆变换的复变积分定义 f(t) = (1/2πj)∫_{σ−j∞}^{σ+j∞} F(s)e^{st}ds 实际很少直接计算，工程上用部分分式法：把有理函数 F(s) = N(s)/D(s) 拆成简单分式之和后逐项查表。" },
      { t: "p", x: "若 F(s) 为真分式且 D(s) 只有单根 p_{1}、p_{2}、…、p_{n}，则" },
      { t: "f", x: "F(s) = Σ_{i=1}^{n} K_{i}/(s − p_{i})，K_{i} = [(s − p_{i})F(s)]|_{s = p_{i}}" },
      { t: "p", x: "若分子次数不低于分母（假分式），先用长除法分离出常数或 s 的正幂项（对应 δ(t) 及其导数），再对余式作部分分式。" },
      { t: "p", x: "重根情形：设 p_{1} 为二重根，展开为 K_{11}/(s − p_{1})^{2} + K_{12}/(s − p_{1})，对应逆变换为 (K_{11}t + K_{12})e^{p_{1}t}ε(t)，系数为" },
      { t: "f", x: "K_{11} = (s − p_{1})^{2}F(s)|_{s = p_{1}}，K_{12} = d/ds[(s − p_{1})^{2}F(s)]|_{s = p_{1}}" },
      { t: "p", x: "共轭复根情形：分母含二次因子 s^{2} + as + b（判别式小于零）时不必求出复数极点，直接配方为 (s + a/2)^{2} + ω_{0}^{2}，再利用 cos 对（配合 ω_{0}/[(s + a)^{2} + ω_{0}^{2}] ↔ e^{−at}sin(ω_{0}t)ε(t)，任何共轭复极点都对应衰减或增长振荡，见例6-1 与例6-3）" },
      { t: "f", x: "(s + a)/[(s + a)^{2} + ω_{0}^{2}] ↔ e^{−at}cos(ω_{0}t)ε(t)" },
      { t: "ex", title: "例6-1  部分分式法求拉普拉斯逆变换", problem: [
        { t: "p", x: "求 F(s) = 10/[s(s + 1)(s + 2)] 的拉普拉斯逆变换 f(t)。" }
      ], solution: [
        { t: "p", x: "解：F(s) 为真分式，有三个单极点 p_{1} = 0、p_{2} = −1、p_{3} = −2。设" },
        { t: "f", x: "F(s) = K_{1}/s + K_{2}/(s + 1) + K_{3}/(s + 2)" },
        { t: "p", x: "用公式 K_{i} = [(s − p_{i})F(s)]|_{s=p_{i}} 逐个求系数：" },
        { t: "f", x: "K_{1} = 10/[(s + 1)(s + 2)]|_{s=0} = 10/(1×2) = 5" },
        { t: "f", x: "K_{2} = 10/[s(s + 2)]|_{s=−1} = 10/[(−1)×1] = −10" },
        { t: "f", x: "K_{3} = 10/[s(s + 1)]|_{s=−2} = 10/[(−2)×(−1)] = 5" },
        { t: "p", x: "于是" },
        { t: "f", x: "F(s) = 5/s − 10/(s + 1) + 5/(s + 2)" },
        { t: "f", x: "f(t) = 5 − 10e^{−t} + 5e^{−2t} = 5(1 − e^{−t})^{2}，t ≥ 0" },
        { t: "p", x: "校验：初值 f(0_{+}) = lim_{s→∞} sF(s) = 0，与 5 − 10 + 5 = 0 一致；终值 f(∞) = lim_{s→0} sF(s) = 10/2 = 5，与表达式的稳态值 5 一致。" }
      ] },

      { t: "h3", x: "6.5  用拉普拉斯变换求解线性系统" },
      { t: "p", x: "经典法解常系数线性微分方程需分别求齐次通解与特解并匹配初始条件；s 域方法把整个过程代数化，步骤为：（1）对方程两边取拉普拉斯变换，初始条件经微分性质自动带入；（2）解出 Y(s)；（3）部分分式展开后查表逆变换。以 y″ + a_{1}y′ + a_{0}y = b f(t) 为例，变换后得" },
      { t: "f", x: "(s^{2} + a_{1}s + a_{0})Y(s) = [sy(0_{−}) + y′(0_{−}) + a_{1}y(0_{−})] + bF(s)" },
      { t: "p", x: "右端第一项完全由初始条件决定，第二项完全由激励决定，两者在 s 域天然分离" },
      { t: "f", x: "Y(s) = Y_{zi}(s) + Y_{zs}(s) = [初始条件项]/A(s) + H(s)F(s)" },
      { t: "p", x: "分别逆变换即得零输入响应 y_{zi}(t)（模式由特征根决定）与零状态响应 y_{zs}(t)（还与激励有关），全响应为二者之和。这一分离无需额外计算，是 s 域法的重要优点。" },
      { t: "p", x: "含初始储能的电路可直接建立 s 域模型：把元件用复阻抗与等效源替换后，基尔霍夫定律形式不变，电阻电路的全部方法（串并联、分压分流、戴维南等效）均可使用。" },
      { t: "tbl", cap: "表6-3  R、L、C 元件的 s 域模型", head: ["元件", "阻抗 Z(s)", "串联等效（含电压源）", "并联等效（含电流源）"], rows: [
        ["R", "R", "U = RI（无初始储能）", "I = U/R"],
        ["L", "sL", "U = sL·I − L·i_{L}(0_{−})", "I = U/(sL) + i_{L}(0_{−})/s"],
        ["C", "1/(sC)", "U = I/(sC) + u_{C}(0_{−})/s", "I = sC·U − C·u_{C}(0_{−})"]
      ], widths: [10, 16, 38, 36] },
      { t: "p", x: "u_{C}(0_{−})/s 与 i_{L}(0_{−})/s 分别是初始电容电压与电感电流的象函数；选用串联还是并联形式以列写方程方便为准。" },
      { t: "ex", title: "例6-2  用拉普拉斯变换解微分方程并分离零输入零状态", problem: [
        { t: "p", x: "已知系统方程 y″(t) + 3y′(t) + 2y(t) = f(t)，初始条件 y(0_{−}) = 1、y′(0_{−}) = 2，激励 f(t) = ε(t)。求零输入响应、零状态响应与全响应。" }
      ], solution: [
        { t: "p", x: "解：对方程两边取拉普拉斯变换，利用微分性质 y′(t) ↔ sY(s) − y(0_{−})、y″(t) ↔ s^{2}Y(s) − sy(0_{−}) − y′(0_{−})，得" },
        { t: "f", x: "(s^{2} + 3s + 2)Y(s) = F(s) + (s + 3)y(0_{−}) + y′(0_{−})" },
        { t: "p", x: "代入 y(0_{−}) = 1、y′(0_{−}) = 2、F(s) = 1/s：" },
        { t: "f", x: "(s^{2} + 3s + 2)Y(s) = 1/s + s + 5" },
        { t: "p", x: "零输入部分只取初始条件项，注意 s^{2} + 3s + 2 = (s + 1)(s + 2)：" },
        { t: "f", x: "Y_{zi}(s) = (s + 5)/[(s + 1)(s + 2)] = 4/(s + 1) − 3/(s + 2)" },
        { t: "p", x: "其中 K_{1} = (s + 5)/(s + 2)|_{s=−1} = 4，K_{2} = (s + 5)/(s + 1)|_{s=−2} = −3。逆变换得" },
        { t: "f", x: "y_{zi}(t) = (4e^{−t} − 3e^{−2t})ε(t)" },
        { t: "p", x: "零状态部分：" },
        { t: "f", x: "Y_{zs}(s) = 1/[s(s + 1)(s + 2)] = (1/2)(1/s) − 1/(s + 1) + (1/2)/(s + 2)" },
        { t: "f", x: "y_{zs}(t) = (1/2 − e^{−t} + (1/2)e^{−2t})ε(t)" },
        { t: "p", x: "全响应为零输入与零状态之和：" },
        { t: "f", x: "y(t) = 1/2 + 3e^{−t} − (5/2)e^{−2t}，t ≥ 0" },
        { t: "p", x: "校验：y(0_{+}) = 1/2 + 3 − 5/2 = 1 = y(0_{−})；y′(0_{+}) = −3 + 5 = 2 = y′(0_{−})，且 y_{zi}(0) = 4 − 3 = 1、y_{zi}′(0) = −4 + 6 = 2。式中 1/2 是由激励维持的强迫分量（稳态），两个指数项是自由分量（暂态）。" }
      ] },

      { t: "h3", x: "6.6  系统函数与系统稳定性" },
      { t: "p", x: "系统函数（传递函数）定义为零状态响应与激励的象函数之比，它与冲激响应构成变换对 h(t) ↔ H(s)，与微分方程一一对应（A(s) 即特征多项式），只取决于系统结构与参数，与激励和初始状态无关。" },
      { t: "f", x: "H(s) = Y_{zs}(s)/F(s) = B(s)/A(s)" },
      { t: "p", x: "令 B(s) = 0 得零点，A(s) = 0 得极点。极点决定响应的自然模式 A e^{p_{i}t}，零点影响各模式的幅度与相位；把零极点标在 s 平面上得到零极点图，它是系统的图形化表征。" },
      { t: "tbl", cap: "表6-4  极点位置与冲激响应 h(t) 的形态（A、θ 为常数）", head: ["极点位置", "h(t) 形态", "趋势"], rows: [
        ["左半平面实极点 s = −a（a > 0）", "A e^{−at}ε(t)", "指数衰减，稳定"],
        ["右半平面实极点 s = a（a > 0）", "A e^{at}ε(t)", "指数增长，不稳定"],
        ["原点单极点 s = 0", "A ε(t)", "恒定，临界"],
        ["原点二重极点", "A t ε(t)", "线性增长，不稳定"],
        ["虚轴共轭极点 ±jω_{0}", "A cos(ω_{0}t + θ)ε(t)", "等幅振荡，临界"],
        ["左半平面共轭极点 −a ± jω_{0}", "A e^{−at}cos(ω_{0}t + θ)ε(t)", "衰减振荡，稳定"],
        ["右半平面共轭极点 a ± jω_{0}", "A e^{at}cos(ω_{0}t + θ)ε(t)", "增长振荡，不稳定"]
      ], widths: [32, 38, 30] },
      { t: "p", x: "稳定性（BIBO）：有界输入产生有界输出。对因果 LTI 系统有充要条件" },
      { t: "f", x: "系统稳定的充要条件：全部极点满足 Re s_{i} < 0" },
      { t: "kp", x: "稳定性判断要点：极点全在左半开平面 → 稳定（h(t) 各模式均衰减）；虚轴单极点 → 临界稳定（等幅振荡或恒定，工程上视为不可靠）；虚轴重极点或右半平面任一极点 → 不稳定。判据：先看多项式系数是否缺项或异号（必不稳定），一至三阶系统用罗斯–霍尔维茨判据免求根，高阶或含参数时配合零极点分析。" },
      { t: "p", x: "罗斯–霍尔维茨判据由特征多项式 D(s) = a_{n}s^{n} + … + a_{1}s + a_{0} 的系数判断全部根是否位于左半平面。常用低阶结论：一阶、二阶系统要求系数全部为正；三阶还需要" },
      { t: "f", x: "D(s) = a_{3}s^{3} + a_{2}s^{2} + a_{1}s + a_{0}：a_{i} > 0 且 a_{2}a_{1} > a_{3}a_{0}" },
      { t: "p", x: "对稳定系统，频率响应由系统函数直接得到：H(jω) = H(s)|_{s=jω}，沿虚轴计算幅频与相频；零极点图还给出几何解释——幅频等于 jω 点到各零点距离乘积与到各极点距离乘积之比。阶跃响应的象函数为 G(s) = H(s)/s。" },
      { t: "ex", title: "例6-3  判断系统稳定性并求冲激响应形态", problem: [
        { t: "p", x: "已知系统函数 H(s) = 20/(s^{3} + 4s^{2} + 14s + 20)。判断系统是否稳定，并求冲激响应 h(t)。" }
      ], solution: [
        { t: "p", x: "解：特征多项式 D(s) = s^{3} + 4s^{2} + 14s + 20。先用罗斯–霍尔维茨判据：a_{3} = 1、a_{2} = 4、a_{1} = 14、a_{0} = 20 全为正，且 a_{2}a_{1} = 4×14 = 56 > a_{3}a_{0} = 1×20 = 20，满足三阶稳定条件，故三个极点全在左半平面，系统稳定。" },
        { t: "p", x: "求极点：试 s = −2，代入得 −8 + 16 − 28 + 20 = 0，故 s + 2 是因式，" },
        { t: "f", x: "D(s) = (s + 2)(s^{2} + 2s + 10)" },
        { t: "p", x: "极点为 p_{1} = −2 与 p_{2,3} = −1 ± j3，实部均为负，与罗斯判据结论一致。设 H(s) = A/(s + 2) + (Bs + C)/(s^{2} + 2s + 10)，通分后令 s = −2 得 A = 20/10 = 2；比较系数得 B = −2、C = 0。于是" },
        { t: "f", x: "H(s) = 2/(s + 2) − 2(s + 1)/[(s + 1)^{2} + 9] + 2/[(s + 1)^{2} + 9]" },
        { t: "p", x: "第三项改写为 (2/3)·3/[(s + 1)^{2} + 9] 后逐项逆变换：" },
        { t: "f", x: "h(t) = [2e^{−2t} − 2e^{−t}cos(3t) + (2/3)e^{−t}sin(3t)]ε(t)" },
        { t: "p", x: "形态说明：实极点 −2 对应指数衰减分量；共轭极点 −1 ± j3 对应角频率 3 rad/s、按 e^{−t} 衰减的振荡分量。各分量均随 t 衰减趋于零，系统渐近稳定，与罗斯判据结论一致。" }
      ] },
      { t: "sim", id: "s-pole", cap: "图6-1  s 平面极点与冲激响应联动", note: "在 s 平面点击或拖动放置极点，右侧实时绘制对应的冲激响应 h(t)。" },
      { t: "kp", x: "本章必须掌握：（1）单边拉普拉斯变换定义（0_{−} 下限）与收敛域概念、F(jω) = F(s)|_{s=jω}；（2）常用变换对表与性质表，特别是微分性质携带初始条件、卷积定理、初值与终值定理及适用条件；（3）部分分式法（单根、重根、共轭复根配方）；（4）s 域求解微分方程并分离零输入与零状态响应，R、L、C 元件的 s 域模型；（5）H(s) 定义、零极点图与 h(t) 形态的对应关系；（6）BIBO 稳定充要条件与罗斯–霍尔维茨判据（一至三阶）。" }
    ] },

    { id: "c7", label: "第7章 离散时间系统的 z 域分析", blocks: [
      { t: "p", x: "离散系统的 z 域分析与连续系统的 s 域分析完全平行：z 变换把差分方程化为代数方程，把卷积化为乘法，系统函数 H(z) 的极点分布决定响应模式与稳定性。学习中应不断与第 6 章对照——s 左半平面对应 z 平面单位圆内部，这是两章之间最重要的映射关系。" },

      { t: "h3", x: "7.1  z 变换的定义与收敛域" },
      { t: "p", x: "离散信号的分析工具是 z 变换。对序列 f(k) 定义单边 z 变换为 z^{−1} 的幂级数（罗朗级数）" },
      { t: "f", x: "F(z) = Σ_{k=0}^{+∞} f(k)z^{−k}" },
      { t: "p", x: "z 变换可由抽样信号的拉普拉斯变换导出：对 f_{s}(t) = Σ f(kT)δ(t − kT) 取拉普拉斯变换得 Σ f(kT)e^{−skT}，令 z = e^{sT} 即为上式，因此" },
      { t: "f", x: "z = e^{sT}，s = σ + jω → |z| = e^{σT}，θ = ωT" },
      { t: "p", x: "该映射把 s 左半平面（σ < 0）映为 z 平面单位圆内部，虚轴映为单位圆，右半平面映为圆外。离散系统的稳定域（s 左半平面）对应单位圆内，这是本章稳定性分析的几何基础。" },
      { t: "p", x: "收敛域：使级数收敛的 z 的集合。单边 z 变换的收敛域是以原点为心的圆外区域" },
      { t: "f", x: "|z| > ρ_{0}（ρ_{0} 为收敛半径，取决于序列的增长速率）" },
      { t: "p", x: "例如 a^{k}ε(k) 的收敛域为 |z| > |a|，ε(k) 为 |z| > 1；只要收敛半径有限，即使指数增长序列也存在 z 变换，适用面广。本课程只讨论因果序列的单边 z 变换，收敛域总在最右极点所在圆之外，通常不必逐一注明。" },

      { t: "h3", x: "7.2  常用 z 变换对" },
      { t: "p", x: "常用变换对由几何级数求和公式 Σ_{k=0}^{+∞} x^{k} = 1/(1 − x)（|x| < 1）导出。例如 a^{k}ε(k)：" },
      { t: "f", x: "Σ_{k=0}^{+∞} a^{k}z^{−k} = z/(z − a)，|z| > |a|" },
      { t: "tbl", cap: "表7-1  常用单边 z 变换对", head: ["f(k)", "F(z)", "收敛域"], rows: [
        ["δ(k)", "1", "全平面"],
        ["ε(k)", "z/(z − 1)", "|z| > 1"],
        ["kε(k)", "z/(z − 1)^{2}", "|z| > 1"],
        ["k^{2}ε(k)", "z(z + 1)/(z − 1)^{3}", "|z| > 1"],
        ["a^{k}ε(k)", "z/(z − a)", "|z| > |a|"],
        ["k a^{k}ε(k)", "az/(z − a)^{2}", "|z| > |a|"],
        ["(k + 1)a^{k}ε(k)", "z^{2}/(z − a)^{2}", "|z| > |a|"],
        ["sin(βk)ε(k)", "z sinβ/(z^{2} − 2zcosβ + 1)", "|z| > 1"],
        ["cos(βk)ε(k)", "z(z − cosβ)/(z^{2} − 2zcosβ + 1)", "|z| > 1"],
        ["a^{k}sin(βk)ε(k)", "az sinβ/(z^{2} − 2azcosβ + a^{2})", "|z| > |a|"],
        ["a^{k}cos(βk)ε(k)", "z(z − acosβ)/(z^{2} − 2azcosβ + a^{2})", "|z| > |a|"]
      ], widths: [24, 46, 30] },
      { t: "p", x: "核心对 a^{k}ε(k) ↔ z/(z − a) 的三种典型：a = 1 退化为 ε(k)；|a| < 1 与 |a| > 1 对应衰减与增长；a = ρe^{±jβ}（共轭）合成 ρ^{k}cos(βk)、ρ^{k}sin(βk) 型振荡序列。" },
      { t: "f", x: "k a^{k}ε(k) ↔ az/(z − a)^{2}（可由 k 加权性质从核心对导出）" },
      { t: "p", x: "使用提示：解差分方程时最常用 ε(k)、a^{k}ε(k)、k a^{k}ε(k) 与 a^{k}cos(βk) 四类，建议熟记并能默写其象函数。" },

      { t: "h3", x: "7.3  z 变换的性质" },
      { t: "p", x: "设 f(k) ↔ F(z)（收敛域 |z| > ρ_{0}）。性质中移位性质分右移与左移两类，是解差分方程的主要工具。" },
      { t: "tbl", cap: "表7-2  z 变换的常用性质（f(k) ↔ F(z)）", head: ["性质", "k 域", "z 域"], rows: [
        ["线性", "a f_{1}(k) + b f_{2}(k)", "a F_{1}(z) + b F_{2}(z)"],
        ["右移（延时）", "f(k − i)ε(k − i)", "z^{−i}F(z)"],
        ["左移（超前）", "f(k + i)ε(k)", "z^{i}[F(z) − Σ_{m=0}^{i−1} f(m)z^{−m}]"],
        ["z 域尺度", "a^{k}f(k)", "F(z/a)"],
        ["k 加权", "k f(k)", "−z·dF(z)/dz"],
        ["时域卷积", "f_{1}(k)*f_{2}(k)", "F_{1}(z)F_{2}(z)"],
        ["累加", "Σ_{i=0}^{k} f(i)", "zF(z)/(z − 1)"],
        ["初值定理", "f(0)", "lim_{z→∞} F(z)"],
        ["终值定理", "f(∞)", "lim_{z→1} (z − 1)F(z)（极点均在单位圆内）"]
      ], widths: [18, 36, 46] },
      { t: "kp", x: "左移与右移公式不同，切勿混用：右移（延时）f(k − i)ε(k − i) ↔ z^{−i}F(z)，只乘 z^{−i}、无初值项，前提是延时后仍为因果序列；左移（超前）f(k + i)ε(k) ↔ z^{i}F(z) 减去前 i 个初值对应的项，如 Z[f(k+1)ε(k)] = zF(z) − zf(0)，Z[f(k+2)ε(k)] = z^{2}F(z) − z^{2}f(0) − zf(1)。前向形式（含 y(k+2) 等）的方程用左移性质，后向形式（含 y(k−1) 等）的方程用右移性质。" },
      { t: "f", x: "y(k) = h(k)*f(k) ↔ Y(z) = H(z)F(z)" },
      { t: "p", x: "卷积定理同样是系统分析的基石：离散卷积求和化为代数乘积。尺度性质 a^{k}f(k) ↔ F(z/a) 把极点整体缩放 a 倍；k 加权性质用于产生重极点项 az/(z − a)^{2}。" },
      { t: "p", x: "初值定理要求序列因果；终值定理要求 (z − 1)F(z) 的极点都在单位圆内，否则 f(∞) 不存在（如等幅振荡或增长序列），不能套用。" },

      { t: "h3", x: "7.4  逆 z 变换" },
      { t: "p", x: "幂级数展开法（长除法）：F(z) 本身就是 z^{−k} 的幂级数，把分子、分母按 z 的降幂排列后作长除，商中 z^{−k} 项的系数即 f(k)。降幂排列对应因果（右边）序列；该方法适合只需求序列前若干项或检验结果。例如 F(z) = z^{2}/(z^{2} − 1.5z + 0.5) 长除得 1 + 1.5z^{−1} + 1.75z^{−2} + 1.875z^{−3} + …，即 f(k) = 2 − (0.5)^{k}（见例7-1）。" },
      { t: "p", x: "部分分式法：由于基本变换对的形式是 z/(z − a) 而非 1/(z − a)，应先把 F(z) 除以 z 再展开" },
      { t: "f", x: "F(z)/z = Σ_{i} K_{i}/(z − p_{i})，K_{i} = [(z − p_{i})F(z)/z]|_{z = p_{i}}" },
      { t: "p", x: "各项乘回 z 后利用 z/(z − p_{i}) ↔ p_{i}^{k}ε(k) 逐项写出 f(k)；若 F(z) 为假分式，先长除分离出 z 的正幂项（对应 δ(k) 及其移位）。" },
      { t: "p", x: "共轭复极点不必求复系数：把分母写成 z^{2} − 2aρcosβ·z + a^{2} 形式后，直接套用 a^{k}cos(βk)、a^{k}sin(βk) 变换对合成，见例7-3。" },
      { t: "p", x: "收敛域的作用：单边（因果）情形默认收敛域为圆外，逆变换唯一；双边 z 变换则必须给定收敛域才能唯一确定序列，同一 F(z) 配不同收敛域对应不同序列。" },
      { t: "ex", title: "例7-1  部分分式法求逆 z 变换", problem: [
        { t: "p", x: "求 F(z) = z^{2}/[(z − 1)(z − 0.5)]（|z| > 1）的逆 z 变换 f(k)。" }
      ], solution: [
        { t: "p", x: "解：对 F(z)/z 作部分分式展开：" },
        { t: "f", x: "F(z)/z = z/[(z − 1)(z − 0.5)] = K_{1}/(z − 1) + K_{2}/(z − 0.5)" },
        { t: "f", x: "K_{1} = z/(z − 0.5)|_{z=1} = 1/0.5 = 2，K_{2} = z/(z − 1)|_{z=0.5} = 0.5/(−0.5) = −1" },
        { t: "p", x: "乘回 z：" },
        { t: "f", x: "F(z) = 2z/(z − 1) − z/(z − 0.5)" },
        { t: "f", x: "f(k) = [2 − (0.5)^{k}]ε(k)" },
        { t: "p", x: "校验：初值 f(0) = 2 − 1 = 1 = lim_{z→∞} F(z)；终值 f(∞) = 2，与 lim_{z→1}(z − 1)F(z) = 1/(1 − 0.5) = 2 一致。" }
      ] },

      { t: "h3", x: "7.5  用 z 变换求解差分方程" },

      ], widths: [12, 46, 42] },
      { t: "kp", x: "三大变换的统一记忆：拉普拉斯变换是加权的傅里叶变换（s 平面，σ 代替加权）；z 变换是抽样信号拉普拉斯变换的变量置换（z = e^{sT}，s 左半平面 ↔ z 单位圆内）；傅里叶变换即虚轴（单位圆）上的取值。所有方法共享两条主线——时域卷积对应变换域相乘、极点决定响应的模式。" }
    ]
  }
  );
})();
